<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="lab-title lab-desc">
  <title id="lab-title">응대 검사기 흐름</title>
  <desc id="lab-desc">시민 작성 양식으로 민원을 남기면 짧은 진행 안내를 보여 주고, 안내 또는 처리 사유를 확인합니다.</desc>
  <defs>
    <linearGradient id="lab-bg" x1="0" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="20" fill="url(#lab-bg)"/>
  <g font-family="Arial, 'Noto Sans KR', sans-serif">
    <text x="48" y="42" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="2.4">/#/LAB · ASSIST</text>
    <text x="48" y="78" fill="#f8fafc" font-size="28" font-weight="700">작성하면 지금 하는 일만 짧게 보여 줍니다</text>
    <rect x="48" y="108" width="340" height="76" rx="14" fill="#15233a" stroke="#2f6fed" stroke-opacity=".45"/>
    <text x="72" y="140" fill="#bfdbfe" font-size="13" font-weight="700">1 민원 작성</text>
    <text x="72" y="164" fill="#e2e8f0" font-size="16">시민 직접 작성 양식</text>
    <rect x="430" y="108" width="340" height="76" rx="14" fill="#132a2c" stroke="#2dd4bf" stroke-opacity=".4"/>
    <text x="454" y="140" fill="#99f6e4" font-size="13" font-weight="700">2 짧은 진행</text>
    <text x="454" y="164" fill="#e2e8f0" font-size="16">안내·사례를 찾고 있어요</text>
    <rect x="812" y="108" width="340" height="76" rx="14" fill="#2a2416" stroke="#e4c877" stroke-opacity=".4"/>
    <text x="836" y="140" fill="#fde68a" font-size="13" font-weight="700">3 안내 또는 사유</text>
    <text x="836" y="164" fill="#e2e8f0" font-size="16">답변 · 부서 후보 · 담당자 검토</text>
  </g>
</svg>
