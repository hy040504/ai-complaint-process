<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">AI Complaint Process</title>
  <desc id="description">청주 민원 데이터를 근거로 안내와 부서 연결을 지원하는 AI 완충지대. 민원 웹, 검색, LLM, 응대 계층, PREFIX 시스템 접두, Codex 검색 도구, CPU용 e5-small-ko 임베딩, Windows 응대·문장 임베딩 CMD, PostgreSQL 업무 스키마로 구성합니다.</desc>
