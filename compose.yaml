name: cheongju-rag
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: complaints
      POSTGRES_USER: complaint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${RAG_DB_PORT:-55432}:5432"
    volumes:
      - ./.rag-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complaint -d complaints"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped
  rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: complaints
      PGUSER: complaint
      PGPASSWORD: ${POSTGRES_PASSWORD}
      HF_HOME: /cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: 1
      HF_HUB_DISABLE_XET: 1
      TOKENIZERS_PARALLELISM: "false"
      RAG_DEVICE: cpu
      RAG_API_URL: http://127.0.0.1:8000
      RAG_THREADS: ${RAG_THREADS:-4}
      RAG_BATCH_SIZE: ${RAG_BATCH_SIZE:-8}
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - ./.rag-cache:/cache
    ports:
      - "127.0.0.1:${RAG_API_PORT:-8007}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      start_period: 120s
      retries: 3
    mem_limit: 9g
    cpus: ${RAG_CPUS:-4}
    restart: unless-stopped
