th><th>cz (시민 문구)<\/th><th style=\"width:40px\">SMS<\/th><th>비고<\/th><\/tr><\/thead><tbody><tr><td>접수 완료<\/td><td>접수 완료 — 문자로 안내드렸어요<\/td><td>●<\/td><td>접수번호 포함<\/td><\/tr><tr><td>자동/수동 배정<\/td><td>담당 부서 배정 — {dept}<\/td><td>●<\/td><td><\/td><\/tr><tr><td>보좌관 배정<\/td><td>담당 부서를 확인하고 있습니다<\/td><td><\/td><td><\/td><\/tr><tr><td>양식 열람<\/td><td>담당자가 검토를 시작했습니다<\/td><td><\/td><td><\/td><\/tr><tr><td>조치 계획<\/td><td>담당 부서가 조치 계획을 세우고 있습니다 (예정 {date})<\/td><td><\/td><td><\/td><\/tr><tr><td>현장 일정<\/td><td>현장 확인 중 (방문 예정)<\/td><td>●<\/td><td><\/td><\/tr><tr><td>협조 요청/회신<\/td><td>관련 부서와 협의 중 / 관련 부서 협의가 완료되었습니다<\/td><td><\/td><td><\/td><\/tr><tr><td>보완 요청<\/td><td>추가 자료가 필요합니다 — {needFile}<\/td><td>●<\/td><td>C-07 링크<\/td><\/tr><tr><td>보완 제출<\/td><td>검토가 재개되었습니다<\/td><td>●<\/td><td><\/td><\/tr><tr><td>기한 연장 승인<\/td><td>처리기간이 연장되었습니다 (사유: {why})<\/td><td>●<\/td><td><\/td><\/tr><tr><td>조치 완료<\/td><td>현장 조치가 완료되었습니다<\/td><td>●<\/td><td><\/td><\/tr><tr><td>결재 상신<\/td><td>답변 검토 중<\/td><td><\/td><td><\/td><\/tr><tr><td>전결<\/td><td>답변 완료 — 처리기간 N일<\/td><td>●<\/td><td>답변서 게시<\/td><\/tr><tr><td>문의 전달<\/td><td>답변 완료 — 문의 답변이 등록되었습니다<\/td><td>●<\/td><td><\/td><\/tr><tr><td>소관 외<\/td><td>답변 완료 — 소관 기관 안내<\/td><td>●<\/td><td><\/td><\/tr><tr><td>반려 반환<\/td><td>담당 부서를 다시 확인하고 있습니다<\/td><td><\/td><td><\/td><\/tr><tr><td>내부 메모·마스킹·시그널·회부·양식 발송<\/td><td>(비공개)<\/td><td><\/td><td>vis:int<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note blue\">SMS 포맷: <code>[청주시 민원] 김○○님의 민원({short}) — {cz} / {web}/t/{short}<\/code>. 링크는 서명 토큰(7일·1건 조회). 시민이 문자 수신을 끈 경우에도 웹 트래커에는 동일 문구가 남습니다.<\/div><\/div><\/section>\n<section id=\"s11\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 11 · API<\/div><h2>REST 48 엔드포인트 + 이벤트 스트림<\/h2><p class=\"lede\">응답은 항상 갱신된 <code>Case<\/code>를 반환하고, 서버는 <code>/api/events/stream<\/code>으로 <code>{caseId, ev, stage, status, form.state}<\/code>를 브로드캐스트합니다.<\/p><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/ai/analyze<\/code> — 분류·라우팅·tip·form 스펙<\/div><div class=\"m-post\">POST<\/div><div><code>/api/ai/mask<\/code> — 마스킹<\/div><div class=\"m-post\">POST<\/div><div><code>/api/ai/duplicate<\/code> — 중복 후보<\/div><div class=\"m-post\">POST<\/div><div><code>/api/ai/inquiry-draft<\/code> — 문의 초안<\/div><div class=\"m-post\">POST<\/div><div><code>/api/ai/answer-draft<\/code> — RAG 답변 초안<\/div><div class=\"m-post\">POST<\/div><div><code>/api/ai/transfer-form<\/code> — 업무 양식 생성<\/div><div class=\"m-post\">POST<\/div><div><code>/api/ai/policy-draft<\/code> — 정책 초안<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases<\/code> — 접수<\/div><div class=\"m-get\">GET<\/div><div><code>/api/cases/{id}<\/code> — 상세(역할별 필드 마스킹)<\/div><div class=\"m-get\">GET<\/div><div><code>/api/cases/{id}/timeline<\/code> — 공개 이벤트<\/div><div class=\"m-get\">GET<\/div><div><code>/api/cases?mine=1<\/code> — 나의 민원<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/supplement<\/code> — 보완<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/rating<\/code> — 만족도<\/div><div class=\"m-get\">GET<\/div><div><code>/api/queue<\/code> — 큐<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/assign<\/code> — 배정/보좌관<\/div><div class=\"m-put\">PUT<\/div><div><code>/api/cases/{id}/form<\/code> — 양식 편집<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/form/send<\/code> — 전달<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/form/open<\/code> — 열람<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/auto-confirm<\/code> — 검수<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/nonjur<\/code> — 소관 외 답변<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/inquiry/send<\/code> — 문의 전달<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/plan<\/code> — 조치 계획<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/field<\/code> — 현장 조치<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/coop<\/code> — 협조<\/div><div class=\"m-put\">PUT<\/div><div><code>/api/cases/{id}/coop/{i}<\/code> — 회신<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/extension<\/code> — 연장 요청<\/div><div class=\"m-put\">PUT<\/div><div><code>/api/cases/{id}/extension<\/code> — 승인/반려<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/reject<\/code> — 반려<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/special<\/code> — 회부<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/approval<\/code> — 결재 단계<\/div><div class=\"m-post\">POST<\/div><div><code>/api/specials<\/code> — 발생보고서<\/div><div class=\"m-put\">PUT<\/div><div><code>/api/specials/{id}<\/code> — 상태<\/div><div class=\"m-get\">GET<\/div><div><code>/api/stats?period=<\/code> — 통계<\/div><div class=\"m-get\">GET<\/div><div><code>/api/classify/{axis}<\/code> — 분류 11축<\/div><div class=\"m-get\">GET<\/div><div><code>/api/policies<\/code> — 정책<\/div><div class=\"m-post\">POST<\/div><div><code>/api/policies<\/code> — 과제 등록<\/div><div class=\"m-put\">PUT<\/div><div><code>/api/thresholds<\/code> — 임계치<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/question<\/code> — 추가 질문<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/question/{i}/answer<\/code> — 시민 답변<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/review<\/code> — 재검토 요청<\/div><div class=\"m-put\">PUT<\/div><div><code>/api/cases/{id}/review<\/code> — 재검토 결정<\/div><div class=\"m-post\">POST<\/div><div><code>/api/issues/{id}/step<\/code> — 발급 단계<\/div><div class=\"m-post\">POST<\/div><div><code>/api/policies/{id}/step<\/code> — 정책 단계 확정<\/div><div class=\"m-post\">POST<\/div><div><code>/api/policies/{id}/consult<\/code> — 부서 협의<\/div><div class=\"m-put\">PUT<\/div><div><code>/api/policies/{id}/budget<\/code> — 예산·일정<\/div><div class=\"m-post\">POST<\/div><div><code>/api/policies/{id}/agenda<\/code> — 상신·심의<\/div><div class=\"m-get\">GET<\/div><div><code>/api/policies/{id}/exec<\/code> — 효과 추적<\/div><div class=\"m-get\">GET<\/div><div><code>/api/events/stream<\/code> — SSE — 6개 창 동기화<\/div><\/div><div class=\"note gold\"><b>역할별 응답 필터<\/b> — 시민 토큰으로 <code>GET /cases/{id}<\/code> 시 <code>ev<\/code>는 <code>cz<\/code>가 있는 항목만, <code>raw<\/code>는 마스킹본, <code>form/plan/coops/dproc<\/code>는 제외됩니다. 담당자 토큰은 자기 부서 <code>transfers<\/code>만, 민원과는 전체.<\/div><\/div><\/section>\n<section id=\"s12\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 12 · SECURITY<\/div><h2>권한 · 감사 · 개인정보<\/h2><div class=\"tw\"><table><thead><tr><th style=\"width:140px\">역할<\/th><th>조회<\/th><th>쓰기<\/th><th style=\"width:160px\">감사 기록<\/th><\/tr><\/thead><tbody><tr><td>시민<\/td><td>본인 민원 · 공개 이벤트 · 소식<\/td><td>접수·보완·만족도·문자 설정<\/td><td>—<\/td><\/tr><tr><td>민원과 (류○○ 주무관)<\/td><td>전체 큐 · 원문(마스킹본) · 특이(순화 요약, 원문은 목적 선택)<\/td><td>배정·보좌관·양식·검수·소관 외 답변·문의 전달·연장 승인·발생보고서<\/td><td>원문 열람 · 상신 · 재배정<\/td><\/tr><tr><td>담당자 (부서)<\/td><td>자기 부서 transfers · 협조 수신<\/td><td>열람·계획·조치·협조·연장 요청·반려·회부·초안·결재<\/td><td>열람 · 반려 · 회부<\/td><\/tr><tr><td>보좌관<\/td><td>소관 판단 요청서<\/td><td>판단(주관·협조)<\/td><td>판단<\/td><\/tr><tr><td>관리자 (민원총괄)<\/td><td>전체 통계·분류·정책 · 발생보고서 · 감사 로그<\/td><td>임계치·정책 등록·보호조치·학습 반영·공지 발행<\/td><td>설정 변경 · 승인 · 군집 열람<\/td><\/tr><tr><td>감사·법무<\/td><td>감사 로그 · 증적<\/td><td>증적 출력<\/td><td>열람<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note red\"><b>개인정보<\/b> — 입력 시점 마스킹(§4①) · 원본 미저장 · 정책 분석은 비식별 집계만 · 특이민원 원문은 목적 선택 후 열람하며 <code>Audit{who,act,purpose,t,case}<\/code> 필수 · 심리 지원 신청은 익명(관리자 화면 비노출) · 인증 정보는 검증 직후 파기.<\/div><\/div><\/section>\n<section id=\"s13\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 13 · CROSS-ROLE<\/div><h2>교차 연동 22경로<\/h2><div class=\"tw\"><table><thead><tr><th style=\"width:30px\">#<\/th><th style=\"width:200px\">시작<\/th><th style=\"width:230px\">도착<\/th><th>반영<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>시민 접수 (C-03)<\/td><td>민원과 M-01 · 관리자 A-01/A-10<\/td><td>NEW 팝업·배지 · 접수 대기 KPI · 일자별 막대 · 카테고리 건수<\/td><\/tr><tr><td>2<\/td><td>AI 자동 배정<\/td><td>민원과 M-01 ⚡ · 담당자 D-01 미열람 · A-06<\/td><td>검수 블록 · 배정 팝업 · 자동 배정 지표<\/td><\/tr><tr><td>3<\/td><td>민원과 배정·양식 전달<\/td><td>담당자 D-01/D-02 · 시민 C-05<\/td><td>미열람 → 열람 시각 · “배정/검토 시작”<\/td><\/tr><tr><td>4<\/td><td>보좌관 판단<\/td><td>민원과 S-02 · 시민<\/td><td>주관·협조 재작성 · “담당 부서 배정”<\/td><\/tr><tr><td>5<\/td><td>담당자 열람<\/td><td>민원과 M-03 · 시민<\/td><td>열람자·시각 · “검토 시작”<\/td><\/tr><tr><td>6<\/td><td>담당자 조치 계획·현장 조치<\/td><td>시민 C-05/C-08 · 민원과 S-02 모니터링<\/td><td>문구 갱신 · SMS · 최근 처리 3건<\/td><\/tr><tr><td>7<\/td><td>협조 요청<\/td><td>협조 부서 D-01 수신함 · 시민<\/td><td>회신 → “협의 완료”<\/td><\/tr><tr><td>8<\/td><td>기한 연장 요청<\/td><td>민원과 M-03 승인 · 시민<\/td><td>dd 갱신 · 사유 SMS<\/td><\/tr><tr><td>9<\/td><td>담당자 반려<\/td><td>민원과 M-01 ⟲ · S-02 배너 · A-06 · A-01<\/td><td>재배정 · 환류 · 정확도<\/td><\/tr><tr><td>10<\/td><td>특이민원 회부<\/td><td>민원과 S-07/S-08 · A-13<\/td><td>순화 요약 · 발생보고서 · 승인/법무<\/td><\/tr><tr><td>11<\/td><td>원문 열람·군집 열람<\/td><td>A-07 감사 로그<\/td><td>who·purpose·t<\/td><\/tr><tr><td>12<\/td><td>전결<\/td><td>시민 C-06 · A-01<\/td><td>답변서·SMS · 초안 활용률<\/td><\/tr><tr><td>13<\/td><td>문의 AI 전달<\/td><td>시민 C-06<\/td><td>문의 답변 게시<\/td><\/tr><tr><td>14<\/td><td>소관 외 답변<\/td><td>시민 C-04/C-06 · A-14 KPI<\/td><td>소관 외 안내 태그 · nonJur 건수<\/td><\/tr><tr><td>15<\/td><td>A-05/A-11/A-14 공지·사전 안내<\/td><td>시민 C-01/C-11<\/td><td>새 공지 배지 최상단<\/td><\/tr><tr><td>16<\/td><td>A-09 임계치<\/td><td>시민 C-02 · 민원과 S-02 · 자동 배정 조건<\/td><td>분기 즉시 전환<\/td><\/tr><tr><td>17<\/td><td>A-14 자주 하는 → 정책 등록<\/td><td>A-11 목록 · A-12<\/td><td>P-xx 후보 · 임계 시 초안<\/td><\/tr><tr><td>18<\/td><td>시민 만족도·보완 제출<\/td><td>A-01 만족도 · 담당자 큐<\/td><td>지표 갱신 · 검토 재개<\/td><\/tr><tr><td>19<\/td><td>민원과 추가 질문<\/td><td>시민 C-05/C-08<\/td><td>질문 박스 · SMS · 답변 → 큐 💬<\/td><\/tr><tr><td>20<\/td><td>시민 재검토 요청<\/td><td>민원과 M-01 ⟳ · 담당자 D-01(재전달 시)<\/td><td>재검토 블록 · [재검토] 양식<\/td><\/tr><tr><td>21<\/td><td>민원과 서류 발급 완료<\/td><td>시민 C-08<\/td><td>발급 문자 링크<\/td><\/tr><tr><td>22<\/td><td>A-12 가결·시행<\/td><td>시민 C-01/C-11 · A-01<\/td><td>사전 안내 공지 · 정책 반영 현황<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section>\n<section id=\"s14\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 14 · ACCEPTANCE<\/div><h2>테스트 · 인수 기준 · 일정<\/h2><h3>14.1 시나리오 라이브러리 (인수 테스트 케이스)<\/h3><div class=\"note gold\">프로토타입 상단 <b>🧪 시나리오<\/b>의 14종을 그대로 인수 케이스로 사용합니다. [전체 자동 검증]은 분류·마스킹·긴급·특이·폼 구성을 표로 출력하며, 운영 시스템의 <code>/api/ai/analyze<\/code> 결과가 이 표와 일치해야 합니다.<\/div><h3>14.1a 국내 지자체 심층 사례 라이브러리 (🧪 시나리오 › 🏛 국내 사례 탭)<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:200px\">기관 · 사례<\/th><th>무엇을 · 어떻게<\/th><th>우리 시스템 재현<\/th><\/tr><\/thead><tbody><tr><td>광주광역시 · AI 당지기 (2024.8~)<\/td><td>당직 전화 84% AI 처리, 직원 응대 60%↓, 당직 예산 93%↓ · 직원 당직제 폐지<\/td><td>야간 단순 문의 즉시 안내 + 문자 · 야간 긴급 119 우선 · A-14 시간대<\/td><\/tr><tr><td>경기 광주시 · GeniusGov (2025.12)<\/td><td>챗봇 담당 부서 자동 분류 · 빈발 민원(주정차·동물 사체) 신고→부서 전달 자동화 · 야간 콜봇 · AI 감사 검토<\/td><td>AI 자동 배정 §4⑨ · S-02 검수 · 담당자 미열람 팝업<\/td><\/tr><tr><td>서울 120다산콜 · 서울톡/보이는 ARS/채팅/STT<\/td><td>빈발 행정정보 50% 지식베이스화 · 120 상담 20% 처리 · 디지털 약자 전화 유지<\/td><td>FAQ 즉시 종결 · A-14 자주 하는→FAQ 보강 · 채널 동등성<\/td><\/tr><tr><td>서울 상수도 · 아리수톡 (2020)<\/td><td>전화 90% 구조를 챗봇으로 · 단순 민원 24h · 상담 비서봇 추천 답변 · 데이터 환류<\/td><td>문의형 AI 초안 회신 · S-04 추천 답변 · A-11 정책 환류<\/td><\/tr><tr><td>국민권익위 · 국민신문고 생성형 AI (2025~2026)<\/td><td>법령·사례 기반 답변 추천(식약처) · 빈발·중복민원 일괄처리(국토부·인천·시흥) · AI 민원분석 · 2029 대화형<\/td><td>S-04 근거 인용 초안 · S-06 유사 묶음 · A-06 환각 로그<\/td><\/tr><tr><td>행정안전부 · AI 통합민원플랫폼 추진단 (2026.3)<\/td><td>부처·지방정부 참여 원스톱 AI 민원 · 요구 분석→맞춤 해결→시스템 자동 연계<\/td><td>§4.0 접수 역전 · NONJUR 안내처 · A-12 정책 7단계<\/td><\/tr><tr><td>성남시 · 통합인증 원 로그인 · AI 당직 조례<\/td><td>한 번의 인증으로 정부24·국민신문고 연계 · 직원 자체 개발 자동화<\/td><td>C-10 등록 시점 1회 인증 · C-01 홈 간결화<\/td><\/tr><tr><td>경상북도 · 챗경북 (반면교사)<\/td><td>지식베이스 미갱신 → 이용률 급감<\/td><td>A-08 KB 갱신율 KPI · A-06 학습 환류 · 원칙② 근거 없는 답변 미렌더<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note blue\">각 사례는 프로토타입 🧪 시나리오 모달의 <b>🏛 국내 사례<\/b> 탭에 “무엇을·어떻게·출처·우리 시스템 매핑·실행 시나리오(기관별 입력 문장)”로 수록되어 있으며, [실행]은 시민 웹 접수 대화에 문장을 자동 입력합니다. 출처: 각 기관 보도자료·언론(2020~2026).<\/div><h3>14.2 인수 체크리스트<\/h3><ul class=\"chk\"><li>시민 접수 한 줄로 카드까지 화면 전환 0회, tip 말풍선이 분류에 맞게 출력된다<\/li><li>노선형 민원(“버스 배차 간격이 너무 길어요. 105번 증차해주세요”)의 폼에 위치·사진 항목이 없고 노선 미입력 시 접수가 차단된다<\/li><li>휴대폰·주민번호가 포함된 입력이 마스킹 고지와 함께 저장되고 민원과 화면에도 마스킹본만 보인다<\/li><li>신뢰도 ≥ 임계·후보 1개 민원은 민원과 개입 없이 담당자 D-01에 미열람으로 도착하고 민원과 큐에 ⚡태그가 붙는다<\/li><li>“○○로 갓길에 고라니 사체가 있어요”은 소관 검토로 분류되고 보좌관 배정 → 판단 → 주관·협조 재작성이 자동으로 이어진다<\/li><li>담당자 D-02에서 ①→⑦ 순서로 진행되며 필수 항목 미입력 시 다음 단계가 비활성화된다<\/li><li>담당자 반려 시 민원과 큐에 ⟲ 반려 반환으로 돌아오고 A-06 환류·정확도가 갱신된다<\/li><li>협조 요청이 협조 부서 D-01 수신함에 나타나고 회신이 요청 부서 상세에 기록된다<\/li><li>기한 연장은 민원과 승인 후에만 dd가 바뀌고 시민에게 사유가 문자로 간다<\/li><li>소관 외 안내 답변 등록 시 시민 목록에 “소관 외 안내” 태그와 답변서가 게시된다<\/li><li>특이민원 회부 → S-07 회부 배지 → S-08 상신 → A-13 목록에 “상신”으로 등록된다<\/li><li>전결 없이 어떤 답변도 시민에게 노출되지 않는다<\/li><li>A-09 임계치를 0.90으로 올리면 C-02 분기·S-02 배정 UI·자동 배정 조건이 즉시 바뀐다<\/li><li>A-14 11개 탭이 모두 렌더되고 자주 하는 민원 상세에서 정책 과제 등록이 A-11에 반영된다<\/li><\/ul><h3>14.3 개발 우선순위 · 8주 일정<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:70px\">주차<\/th><th>범위<\/th><th style=\"width:70px\">우선순위<\/th><\/tr><\/thead><tbody><tr><td>1~2주<\/td><td>데이터 모델 · 인증 · 시민 웹 C-00~C-05 · AI 파이프라인(마스킹·분류·tip·폼)<\/td><td>P0<\/td><\/tr><tr><td>3~4주<\/td><td>민원과 M-01/S-02 6상태 · 배정·보좌관·양식·자동 배정 · 담당자 D-01/D-02 ①~④<\/td><td>P0<\/td><\/tr><tr><td>5주<\/td><td>초안·결재·답변 게시 · 문의·소관 외 · 반려·협조·연장 · SMS<\/td><td>P0<\/td><\/tr><tr><td>6주<\/td><td>특이민원 S-07/S-08/A-13 · 감사 로그 · 관리자 A-01/A-06/A-09<\/td><td>P0<\/td><\/tr><tr><td>7주<\/td><td>A-10 통계 · A-14 분류 11탭 · A-11/A-12 정책 · 소식 발행<\/td><td>P1<\/td><\/tr><tr><td>8주<\/td><td>시나리오 14종 인수 · 접근성 · 성능(동시 500 세션) · 운영 이관<\/td><td>P0<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section>\n<section id=\"s15\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 15 · SERVER RUNTIME<\/div><h2>서버 프로세스 실행 규약 — 프롬프트가 아니라 상태 기계로<\/h2><p class=\"lede\">화면의 모든 버튼은 서버의 <b>상태 전이 명령<\/b>입니다. 이 절은 전이가 실패·중복·지연되어도 프로세스가 깨지지 않도록 하는 실행 규칙입니다.<\/p><h3>15.1 전이 실행 규칙<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:110px\">규칙<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>원자성<\/td><td>한 전이 = 한 트랜잭션: <code>cases<\/code> 갱신 + <code>events<\/code> 삽입 + (필요 시) <code>forms/questions/review/policies<\/code> 갱신 + <code>outbox<\/code>(SMS·SSE) 기록을 동일 트랜잭션으로 커밋. 커밋 후 outbox 워커가 발송<\/td><\/tr><tr><td>멱등성<\/td><td>쓰기 API는 <code>Idempotency-Key<\/code> 헤더 필수. 동일 키 재요청은 최초 응답을 재반환(인증 후 자동 재전송·네트워크 재시도 대비)<\/td><\/tr><tr><td>전이 가드<\/td><td>서버가 현재 상태를 검사해 허용된 전이만 수행. 예: <code>deptReject<\/code>는 <code>form.state∈{sent,opened}<\/code>에서만, <code>reviewRequest<\/code>는 <code>stage=5 && rated≤2<\/code>에서만, <code>pAgenda(pass)<\/code>는 <code>agenda.state=상신<\/code>에서만. 위반 시 409 + 현재 상태 반환<\/td><\/tr><tr><td>낙관적 잠금<\/td><td><code>Case.version<\/code>을 요청에 포함(If-Match). 충돌 시 409 — 클라이언트는 최신 상태를 다시 읽고 재시도<\/td><\/tr><tr><td>이벤트 순서<\/td><td><code>events.seq<\/code> 단조 증가. SSE는 <code>Last-Event-ID<\/code>로 재접속 시 누락분 재전송. 화면은 seq 역행 이벤트를 무시<\/td><\/tr><tr><td>가시성 필터<\/td><td>응답 직렬화 단계에서 역할별 필터 적용(§11). <code>cz<\/code>가 빈 이벤트는 시민 직렬화기에서 제거되며, 클라이언트 필터에 의존하지 않음<\/td><\/tr><\/tbody><\/table><\/div><h3>15.2 타이머 · 백그라운드 잡 (프로토타입 setTimeout의 운영 대응)<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:130px\">프로토타입<\/th><th style=\"width:170px\">운영 잡<\/th><th>규칙<\/th><\/tr><\/thead><tbody><tr><td>자동 열람 12초<\/td><td>없음 — 담당자 열람 이벤트로 대체<\/td><td><code>form.sent<\/code> 후 24h 미열람 시 <b>미열람 알림<\/b>(담당자·민원과) · 48h 시 A-01 경보<\/td><\/tr><tr><td>보좌관 판단 2.4초<\/td><td>판단 대기 큐<\/td><td>48h 미판단 시 민원과 재촉 · 72h 시 총괄 강제 배정 옵션<\/td><\/tr><tr><td>협의 회신 2.4초<\/td><td>부서 콘솔 회신 · SLA 3일<\/td><td>기한 초과 시 요청 부서·민원과 알림, 정책 협의는 7일<\/td><\/tr><tr><td>기한 D-day<\/td><td>일 1회 <code>dd<\/code> 재계산<\/td><td>D-3·D-1 알림 · D-0 A-01 경보 · 연장 승인 시 재계산<\/td><\/tr><tr><td>질문 답변 대기<\/td><td>7일 무응답<\/td><td>자동 종결 예고 알림 → 14일 시 “답변 없음 종결”(재접수 가능)<\/td><\/tr><tr><td>재검토 요청<\/td><td>30일 이내만 허용<\/td><td>기한 경과 시 버튼 비활성, 신규 접수 안내<\/td><\/tr><tr><td>정책 효과 추적<\/td><td>월 1회 집계<\/td><td>시행 후 3개월 감축률 &lt; 목표 시 <code>re-derive<\/code> 플래그 → A-11 목록 상단<\/td><\/tr><tr><td>통계·분류 집계<\/td><td>야간 배치 + 접수 시 증분<\/td><td>A-10/A-14는 집계 테이블 조회, 실시간 건수는 증분 카운터<\/td><\/tr><\/tbody><\/table><\/div><h3>15.3 실패 · 복구<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:170px\">상황<\/th><th>처리<\/th><\/tr><\/thead><tbody><tr><td>AI 호출 실패(분류·초안)<\/td><td>규칙 점수만으로 분류(LLM 보조 생략) · 초안은 “생성 대기”로 두고 담당자 수동 작성 허용 · 재시도 3회 지수 백오프<\/td><\/tr><tr><td>SMS 발송 실패<\/td><td>outbox 재시도 5회 · 최종 실패 시 트래커에 “문자 발송 실패 — 웹에서 확인” 배지, 민원과 알림<\/td><\/tr><tr><td>인증 콜백 유실<\/td><td>pendingForm은 24h 보관 · 시민 재로그인 시 “작성 중이던 접수가 있어요” 복원 배너<\/td><\/tr><tr><td>동시 배정 충돌<\/td><td>같은 건을 민원과 두 명이 배정 → version 충돌 409, 나중 요청자에게 현재 배정 표시<\/td><\/tr><tr><td>부서 조직 개편<\/td><td>TAXO·deptStaff·NONJUR 안내처는 버전 관리(유효기간). 과거 건은 당시 버전 참조<\/td><\/tr><\/tbody><\/table><\/div><h3>15.4 타사례 기반 확장 — 이번 버전에 반영<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:210px\">확장<\/th><th>참고 사례<\/th><th>반영<\/th><\/tr><\/thead><tbody><tr><td>접수 전 익명 AI 상담 · 등록 시점 인증<\/td><td>정부24 챗봇 / 서울 120 다산콜 1차 응대<\/td><td>§4.0 · C-02/C-03<\/td><\/tr><tr><td>배정 전 추가 질문 Q&A<\/td><td>국민신문고 “보완 요구” · 콜센터 확인 통화<\/td><td>M-01a · P9<\/td><\/tr><tr><td>재검토(이의) 루프<\/td><td>국민신문고 이의신청 · 재접수 통합<\/td><td>S-02r · P10<\/td><\/tr><tr><td>서류 발급 4단계 프로세스<\/td><td>정부24 발급 워크플로 · 무인민원발급기<\/td><td>M-02 · P11<\/td><\/tr><tr><td>AI 자동 배정 + 검수·반려 환류<\/td><td>챗경북 실패 교훈(지식베이스·배정 룰 갱신)<\/td><td>§4⑨ · A-06<\/td><\/tr><tr><td>정책 7단계 위저드 · 효과 추적<\/td><td>서울 스마트도시 데이터 기반 정책 · 국민제안 심의 절차<\/td><td>A-12 · P12<\/td><\/tr><tr><td>민원 분류 11축(시기·계절·지역·시간대)<\/td><td>민원 빅데이터 개방시스템 분석 축<\/td><td>A-14<\/td><\/tr><\/tbody><\/table><\/div><footer style=\"margin-top:40px\"><div class=\"wrap\"><b>PHAROS SOFT<\/b> — 청주시 AI 스마트 민원 · <b>개발 기획안 v4.0<\/b> (2026.09) · 참조 구현: 실동작 프로토타입 v4 · 서원대학교 앵커사업 산학공동프로젝트 2026.09.01~10.30 · 책임자 류 진 휘<\/div><\/footer><\/div><\/section><\/body><\/html>";

짜를 잡고 기준을 넘으면 개선을 요청합니다.\n\n측정 일정은 담당자가 확인하여 다시 안내드리겠습니다.\n\n추가로 궁금한 점이 있으시면 말씀해 주세요.","origin":"ai","origin_job_id":7,"based_on_version_id":null,"edited_by":null,"publish_state":"draft","published_by":null,"published_at":null,"retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":1,"created_at":"2026-10-29T17:12:05+09:00"},{"id":11,"message_id":7,"version_no":1,"body":"안녕하세요, 청주시 AI 민원 도우미입니다.\n\n죽은 동물을 발견하셨을 때는 장소에 따라 아래와 같이 신고해 주세요.\n- 일반도로의 동물 사체: 청주365민원콜센터(043-201-0001)로 전화해 주세요.\n- 개인 사유지의 동물 사체: 종량제봉투에 담아 배출해 주세요.\n- 고속도로의 동물 사체: 한국도로공사콜센터(1588-2504)로 전화해 주세요.\n\n산책길 옆 공공장소의 경우 담당 부서를 다시 확인한 뒤 안내드리겠습니다.","origin":"ai","origin_job_id":9,"based_on_version_id":null,"edited_by":null,"publish_state":"draft","published_by":null,"published_at":null,"retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":1,"created_at":"2026-10-29T13:31:50+09:00"},{"id":12,"message_id":8,"version_no":1,"body":"안녕하세요, 청주시 AI 민원 도우미입니다.\n\n오토바이 소음은 환경관리본부 기후대기과에서 확인합니다. 소음이 큰 이륜차는 관계 기관과 함께 단속하는 방법이 있습니다.\n\n담당자가 소관을 확인하여 다시 안내드리겠습니다.\n\n추가로 궁금한 점이 있으시면 말씀해 주세요.","origin":"ai","origin_job_id":10,"based_on_version_id":null,"edited_by":null,"publish_state":"draft","published_by":null,"published_at":null,"retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":1,"created_at":"2026-10-27T13:46:55+09:00"},{"id":13,"message_id":9,"version_no":1,"body":"안녕하세요, 주택국 공동주택과입니다.\n\n말씀하신 중학교 설립은 충청북도교육청 소관 사항으로, 청주시에서 직접 결정하거나 추진하기 어렵습니다. 민원 내용은 충청북도교육청으로 전달하였습니다.\n\n교육청에서 검토 결과를 안내할 예정입니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":31,"published_at":"2026-10-27T15:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2026-10-27T15:00:00+09:00"},{"id":14,"message_id":10,"version_no":1,"body":"1. 청주시 교통행정발전을 위한 귀하의 관심에 감사드립니다. 2. 저희 청원구청에서는 버스승강장 시설물 유지보수관리 업무를 하고 있습니다. 3. 이에, 민원주신 신흥고등학교 버스승강장(승강장번호: 1441)에 대해 현장 점검하여 보드 불량임을 확인했으며 빠른 시일 내에 보드 교체할 예정임을 알려드립니다. 4. 아울려, 교통불편으로 인해 추가 설명이 필요한 경우, 청원구 산업교통과(201-8392)로 연락주시면 성심성의껏 안내 해 드리도록 하겠습니다. 감사합니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":6,"published_at":"2025-01-11T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-01-11T14:00:00+09:00"},{"id":15,"message_id":11,"version_no":1,"body":"1. 안녕하세요 상당구청 산업교통과입니다. 귀하의 민원은 '영운동 한국병원 뒷편 양방향 주정차 단속요청'으로 검토결과는 다음과 같습니다. 가. 현재 상당구청은 영운동 한국병원 뒷편 구간의 주정차 단속을 위한 행정절차 진행 중에 있으며, 행정예고 기간임을 안내드립니다. 변동사항이 없는 한 2025.02.10.(월) 부터 고정형CCTV 및 주행형 CCTV를 통한 단속이 진행될 예정입니다. 나. 귀하께서 느끼시는 불편에 송구의 말씀을 드리며, 단속이 시행되는 2025.02.10.(월) 까지는 해당 구간 주정차 차량에 대하여 계도조치를 진행하도록 하겠습니다. 2. 청주시 교통안전에 기여해주시는 점 감사드리며, 추가적인 문의는 상당구청 산업교통과 교통지도팀(☎043-201-5213)으로 연락주시면 자세하게 안내해드리겠습니다. 감사합니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":7,"published_at":"2025-01-13T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-01-13T14:00:00+09:00"},{"id":16,"message_id":12,"version_no":1,"body":"1. 안녕하십니까? 귀하께서 신청하신 민원에 대한 처리 결과를 다음과 같이 알려드립니다. 2. 귀하의 민원내용은 '공사현장 소음 및 분진으로 인한 불편'에 관한 것으로 판단됩니다. 3. 귀하의 민원 사항에 대해 처리한 결과는 다음과 같습니다. 가. 현장관계자에게 작업시간 조정, 작업인부 교육 및 저소음 공법 사용 등 공사 기간 소음 발생 저감 및 분진으로 인한 피해를 최소화하기 위하여 공사차량 세륜 및 살수 조치 철저히 하도록 지도하였음을 알려드립니다. 나. 또한 지속적으로 점검하여 불편사항이 발생하지 않도록 노력하겠으니 이점 양해하여 주시면 감사하겠습니다. 4. 상기 답변 내용에 대하여 추가 설명이 필요한 경우 흥덕구청 환경위생과 (☏ 043-201-7347)로 연락주시면 친절히 안내해드리도록 하겠습니다. 감사합니다. 끝.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":8,"published_at":"2025-01-27T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-01-27T14:00:00+09:00"},{"id":17,"message_id":13,"version_no":1,"body":"귀 하께서 교통체계 개선을 요청하신 오송2단지~궁평1교차로 구간은 오송2단지 대규모 아파트 입주 이후 증가된 교통량을 감안하여 유관기관(충북경찰청, 한국도로교통공단 충북지부)과 함께 현재 신호체계를 개선하여 운영중임을 알려드리며, 향후 지속적인 모니터링을 통하여 합리적인 신호운영이 될 수 있도록 노력하겠습니다. ※(개선사항) 오송2단지~궁평1교차로 구간 신호주기 상향, 오송2단지~궁평1교차로 구간 신호연동체계 재구축, 오송바이오폴리스지하차도 신호시간 연장, 새장터삼거리 신호시간 연장, 오송2교차로 보행자 앞버튼 설치 등","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":9,"published_at":"2025-02-08T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-02-08T14:00:00+09:00"},{"id":18,"message_id":14,"version_no":1,"body":"1. 평소 시정 발전에 적극 협조하여 주심에 감사드립니다. 2. 귀하께서 요청하신 문암생태공원 입구 횡당보도 보행자 안전을 위한 고원식 횡단보도 설치요청에 대하여 검토한 결과를 아래와 같이 답변드립니다. - 도로 현황 상 문암생태공원 입구 횡단보도에서 대략 40m 떨어진 곳에 과속방지턱 한개소 설치되어 있음에 따라 차량 속도 저감을 위한 고원식 횡단보도 설치보단 과속방지턱 추가 설치를 하는것이 적합할것으로 판단됩니다. - 이에 관련부서(흥덕구 건설과)에 과속방지턱 설치 건의하였음을 알려드립니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":10,"published_at":"2025-03-20T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-03-20T14:00:00+09:00"},{"id":19,"message_id":15,"version_no":1,"body":"1. 평소 구정 발전에 적극 협조해 주심에 깊은 감사를 드립니다. 2. 민원제기하신 청원구 오창읍 2산단4로 55 불법노점상 정비 요청에 대해서는 6월 9일 현장 방문하였으나, 해당 불법노점상을 발견하지 못 하였음을 알려드립니다. 지속적으로 계도 및 순찰하여 불편하신 사항이 없도록 하겠습니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":11,"published_at":"2025-06-09T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-06-09T14:00:00+09:00"},{"id":20,"message_id":16,"version_no":1,"body":"1. 귀하께서 시민생활전망대를 통해 신청하신 민원에 대한 검토 결과를 다음과 같이 알려드립니다. 2. 귀하께서 제출하신 민원내용은 \"미호강파크골프장 벽시계 설치 요청\"에 관한 것으로 이해됩니다. 3. 벽시계 설치의 경우 현재 예산상의 문제로 당장 설치는 어려우나 추후 관련 예산 편성 시 설치하도록 하겠습니다. 현재 시각 확인은 청주시파크골프협회 사무실 위에 위치한 전광판 등을 통하여 가능함을 알려드립니다. 4. 귀하에게 만족스러운 답변이 되었기를 바라며, 답변 내용에 대한 추가 설명이 필요한 경우 청주시 체육시설과(☎043-201-2374)으로 연락주시면 친절히 안내해 드리도록 하겠습니다. 감사합니다. 끝.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":12,"published_at":"2025-06-17T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-06-17T14:00:00+09:00"},{"id":21,"message_id":17,"version_no":1,"body":"1. 안녕하십니까. 귀하께서 신청하신 민원에 대하여 아래와 같이 안내드립니다. 2. 귀하의 민원 내용은 ‘야간 비행훈련으로 인한 소음 불편’으로 이해되며, 민원 발생일에 공군에서 실시한 야간 비행훈련 과정에서 발생한 것으로 유선 상 안내드린 바와 같습니다. 3. 공군 제17전투비행단의 야간 비행훈련의 경우 주민들의 정온한 생활환경을 위하여 일정을 전달받아 매주 월요일 청주시 홈페이지에 게시하고 있으니 참고하여 주시기 바라며, 4. 군용항공기의 소음, 비행고도 및 경로 등 비행 관련 문의사항은 국민신문고를 통해 접수하시면 국방부의 답변을 받을 수 있음을 추가로 알려드립니다. 감사합니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":13,"published_at":"2025-06-22T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-06-22T14:00:00+09:00"},{"id":22,"message_id":18,"version_no":1,"body":"1. 시정 발전에 관심가져 주심에 감사드립니다. 2. 귀하의 민원사항은 송절동 행복주택 앞 도로(대신로 146번길)의 일방통행에 관한 사항으로 판단됩니다. 3. 해당 도로는 도로교통법에 따라 관할 경찰서와 협의하고 교통영향평가 심의를 거쳐 일방통행 도로로 결정된 사항으로 요청하신 일부 구간 양방행 통행으로의 전환은 어려움을 알려드립니다. 4. 다소 불편하시더라도 원활한 교통흐름과 안전사고 예방등을 종합적으로 검토하여 결정된 사항이므로 넓은 이해와 양해를 부탁드립니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":14,"published_at":"2025-07-25T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-07-25T14:00:00+09:00"},{"id":23,"message_id":19,"version_no":1,"body":"1. 청주시정과 청주사랑상품권(청주페이)에 대해 가져주신 관심에 감사드립니다. 2. 귀하께서 문의하신 사항은 청주페이 충전금액 취소에 대한 것으로 이해됩니다. 3. 충전금액 취소는 청주사랑상품권 발행 및 운영 조례 제7조에 근거하여, 충전시점 이후 결제이력이 없을 때 7일 이내에 청주페이 앱 내에서 처리 가능하며, 아래 경로를 통해 취소 가능합니다. 단, 충전시점 이후 결제 이력이 있으신 경우 최종 충전 잔액의 60%이상 사용하였을 경우 환불신청이 가능합니다. ※ 접속경로 : 청주페이 - [내지갑] - [이용내역] - 이용내역 중 충전한 건을 선택 - 화면 하단에 '충전 취소' 선택 4. 추가 문의사항이 있으신 경우 청주시 경제일자리과(043-201-1024)로 전화주시면 답변드리도록 하겠습니다. 감사합니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":15,"published_at":"2025-07-30T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-07-30T14:00:00+09:00"},{"id":24,"message_id":20,"version_no":1,"body":"1. 안녕하십니까? 귀하께서 시민생활전망대를 통해 신청하신 민원에 대한 검토 결과를 다음과 같이 알려드립니다. 2. 귀하께서 제출하신 민원의 내용은 \"흥덕구 오송 연제리 874 단속요청\"에 관한 것으로 판단됩니다. 3. 해당 구간은 주행형 차량 단속반이 단속 중인 구간입니다. 출퇴근 시간 단속요청 또한 전달하였습니다. 귀하께서 신청하신 민원 건에 대하여 불편 사항 개선될 수 있도록 지속적으로 단속 및 계도 조치하도록 하겠습니다. 4. 귀하에게 만족스러운 답변이 되었기를 바라며, 답변 내용에 대한 추가 설명이 필요한 경우 청주시 흥덕구청 산업교통과 교통지도팀(☎043-201-7403)으로 연락주시면 친절히 안내해 드리도록 하겠습니다. 감사합니다. 끝.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":16,"published_at":"2025-09-21T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-09-21T14:00:00+09:00"},{"id":25,"message_id":21,"version_no":1,"body":"안녕하세요. 상수도사업본부 시설과 송해창입니다. 귀하께서 요청하신 청주시 상당구 금천동 양지아파트 부스터펌프 수리 및 이물질 개선 요청건에 대하여 확인한 결과를 아래와 같이 알려드립니다. 부스터펌프는 아파트 내부에 설치된 시설로서, 해당 장비의 관리 책임은 아파트 측에 있으며 본 본부에서 관리할 수 있는 대상이 아님을 알려드립니다. 또한 이물질 발생 원인은 아파트 내부 배관의 노후화에 따른 것으로 판단되오니, 정확한 조치와 개선을 위해 아파트 관리사무소로 문의하여 주시기 바랍니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":17,"published_at":"2025-09-29T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-09-29T14:00:00+09:00"},{"id":26,"message_id":22,"version_no":1,"body":"안녕하세요 청원구 환경위생과입니다. 귀하께서 요청하신 민원 발생지인 율량 3지구 식당 및 유흥업소 일대 음식물쓰레기통 및 쓰레기봉투 방치로 인한 통행 불편 및 도시미관 저해와 관련하여 해당 구역은 사유지로 구에서 일부 구역을 지정하여 쓰레기 배출구역으로 만들 수 없는 곳입니다. 하지만 상업지구 특성상 유흥업소 및 음식점이 밀집되어 있다 보니 쓰레기 배출시의 규정인 “내집앞 내 점포앞에 배출하기”가 어려운 실정입니다. 따라서 저희 구에서 해당 구역 유흥업소 및 음식점 일대를 여러 차례 방문하여 음식물쓰레기 올바른 배출방법을 안내하고 계도를 하여 점차 나아지고 있다고 생각합니다. 지속적으로 사업장을 방문하여 계도 할 예정이며 아울러 유흥업소 전단지 및 담배꽁초 무단투기를 해결하기 위해 경찰과 협약식을 맺어 무단투기에 대한 합동단속을 시행하였으며 담배꽁초 수거함을 배치하는 등의 활동을 하였습니다. 하루 아침에 바로 좋아질 수 없음을 인지하고 있어 율량3지구의 청결거리를 조성하기 위해 지속적으로 신경 쓸 예정입니다. 감사합니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":18,"published_at":"2025-10-28T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-10-28T14:00:00+09:00"},{"id":27,"message_id":23,"version_no":1,"body":"안녕하세요 상수도사업본부 정수과입니다. 귀하가 제기하신 수돗물 민원과 관련하여 금일 오후 수질 확인을 위하여 해당 사업장에서 채수를 실시하였으며, 6개 항목에 대한 수질검사가 진행중입니다. 수돗수질검사 결과는 우편으로 발송 예정이오니 양지하시기 바라며, 기타 문의사항이 있을 경우 상수도사업본부 정수과 (043-201-4585)로 연락주시기 바랍니다. 감사합니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":19,"published_at":"2025-11-19T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2025-11-19T14:00:00+09:00"},{"id":28,"message_id":24,"version_no":1,"body":"청주 시정에 관심가져 주셔서 감사합니다. 요청하신 민원(제안)건에 대하여 검토한 내용을 알려드립니다. 우선 종이팩(우유팩 및 멸균팩) 분리수거 방안에 대하여 제안하여 주심에 감사드립니다. 청주시에서는 종이팩 분리수거 활성화 사업으로 아래와 같이 관련 사업을 이미 시행 및 추진하고 있음을 알려드립니다. 1. 재활용자원 교환사업 연중 추진 (종이팩 등 수집, 제출 시 교환기준에 의거 앱 포인트(청주페이 전환가능) 등 다양한 인센티브 지급) 2. 종이팩 자원순환체계 구축 시범사업 확대 (현 250세대 이상 공동주택 中 152개소 참여 / 전용 수거함 제작지원 및 수거업체 매칭) 그 외 재활용자원 무인회수기(투명페트병, 캔)를 11개소 총 14대를 운영하고 있으나 무인회수기의 경우, 충청북도 보조사업으로써 투명페트병 분리배출 의무화에 따른 집중수거 등 중앙부처 중점사업 방향에 따라 투명페트병 회수에 집중하고 있음을 알려드립니다. 아울러 현 정부(기후에너지환경부) 기조에 따르면 투명페트병과 마찬가지로 빠르면 연내 종이팩 분리배출 의무화가 실시될 예정입니다. 종이팩 분리배출 의무화 정책 시행 시 단독주택지역 원룸 등 소규모 공동주택을 대상으로 종이팩 전용수거함 제작지원 사업 시행도 고려중에 있으니 참고하시기 바랍니다. 감사합니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":20,"published_at":"2026-01-09T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2026-01-09T14:00:00+09:00"},{"id":29,"message_id":25,"version_no":1,"body":"1. 안녕하십니까? 귀하께서 신청하신 민원에 대한 검토 결과를 다음과 같이 알려드립니다. 2. 귀하께서 제출하신 민원의 내용은 \"오창중고등학교 등교시간 대중교통 이용문제\"에 관한 것으로 이해됩니다. 3. 귀하의 민원에 대한 검토결과는 다음과 같습니다. 가. 2023년 12월 노선개편시 일부 노선들의 통폐합 및 증회를 시행한 바 있으며, 오창중고등학교 학생들의 통학 등을 고려하여 722번, 723번 노선의 운행시간표를 조정해서 운영하고 있습니다. 오창에서 오창중고등학교를 직결하는 노선은 712번, 722번, 723번 노선이 있으며, 731번, 53번 노선을 이용할 경우 오창종점에서 711번 노선으로 환승할 수 있습니다. 나. 723번 노선의 경우 오창프라자를 07:30경에 통과하여, 오창중고등학교는 07:53경 통과하고 있으며, 722번 노선은 오창프라자를 07:33경 통과하고, 오창중고등학교는 07:56경 통과하고 있습니다. 또한, 731번 노선을 이용할 경우 오창프라자를 07:22경 통과하여 오창종점에 07:39경 도착하며, 약 6분 뒤 711번 노선으로 환승할 경우 오창중고등학교를 07:49에 도착하고 있습니다. 731번 노선을 이용할 경우 오창프라자를 07:43경 통과하고 오창종점에 08:03경 도착하며, 약 9분 뒤 711번 노선으로 환승할 경우 오창중고등학교를 08:12에 도착하고 있습니다. 다. 또한, 하교시간을 고려해서 북부권환승센터 출발시간은 723번은 15:00, 722번은 16:22에 출발하고 있습니다. 라. 앞으로도 시민들의 대중교통 이용편의 확대를 위해 지속적으로 노력하겠습니다. 4. 답변 내용에 대한 추가 설명이 필요한 경우 대중교통과(☏043-201-2868)로 연락주시면 친절히 안내해 드리도록 하겠습니다. 감사합니다. 끝.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":21,"published_at":"2026-04-04T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2026-04-04T14:00:00+09:00"},{"id":30,"message_id":26,"version_no":1,"body":"1. 평소 시정발전에 관심가져 주심에 감사드립니다. 2. 한성아파트 인근 계단 추가 설치에 대해 현장 점검 후 검토하도록 하겠으며, 정상부 운동기구에 대해 점검하여 조치하도록 하겠습니다. 또한 공원등의 경우 공원 야간에 시민이 이용할 경우 안전하게 이용할 수 있도록 설치한 사항으로 일반적인 공원등의 밝기로 설치되어 있음을 양해하여 주시기 바랍니다. 감사합니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":22,"published_at":"2026-04-11T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2026-04-11T14:00:00+09:00"},{"id":31,"message_id":27,"version_no":1,"body":"안녕하십니까? 흥덕구 건설과 도로보수팀 입니다. 요청하신 '흥덕구 Lg로 사거리 청주국제공항쪽에서 lg로 비보호 좌회전하는곳 진입하기전 도로 구간 포트홀 보수요청 건'은 조속한 시일내에 완료 예정임을 알려드립니다. 다만, 다수의 민원 대상지에 대하여 순차적으로 처리중으로 시일이 소요될 수 있음을 양해부탁드립니다. 감사합니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":23,"published_at":"2026-05-26T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2026-05-26T14:00:00+09:00"},{"id":32,"message_id":28,"version_no":1,"body":"안녕하십니까? 귀하께서 제출하신 민원에 대한 검토 결과를 다음과 같이 알려드립니다. 귀하의 민원은 「무심천 자전거길 210 인근 우수토실 및 율량천 우수토실에서 발생하는 악취로 인한 불편사항」에 관한 것으로 판단됩니다. 먼저, 악취로 인해 불편을 겪으신 점에 대해 송구스럽게 생각합니다. 무심천 자전거길 210 인근 우수토실 및 율량천 우수토실은 주변 지역에서 발생하는 오수와 우수를 함께 처리하는 합류식 관로 시설입니다. 평상시에는 오수가 차집관로를 통해 하수처리장으로 이송되나, 강우 시에는 관로 용량을 초과하는 유량이 하천으로 방류될 수 있는 구조입니다. 이러한 시설 특성상 장기간 강우가 없을 경우 관로 내 퇴적물 및 정체된 오수로 인해 악취가 발생할 수 있습니다. 현재 해당 지역에 대한 분류식 하수관로 정비사업은 관련 부서에서 검토 중에 있으나, 사업 추진 시기는 아직 확정되지 않은 상태입니다. 또한 악취 저감을 위해 일부 시설에는 악취차단시설(가림막)을 설치하였으나, 배수펌프장과 인접한 일부 구간은 현장 여건상 설치가 어려운 실정입니다. 앞으로도 관로 내 퇴적물 및 협잡물 제거 등 유지관리 작업을 지속적으로 실시하여 악취로 인한 주민 불편을 최소화할 수 있도록 노력하겠습니다. 감사합니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":24,"published_at":"2026-06-12T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2026-06-12T14:00:00+09:00"},{"id":33,"message_id":29,"version_no":1,"body":"1. 안녕하십니까? 시정발전에 관심을 가져주셔서 감사드리며, 신청하신 민원에 대한 검토 결과를 다음과 같이 안내드립니다. 2. 귀하의 민원내용은 '해당 구간의 환경정비 및 청결관리 요청'으로 이해됩니다. 3. 귀하께서 제기하신 민원사항에 대하여 현장을 확인한 결과, 해당 구간은 다수의 시민이 통행 및 이용하는 공공도로(국유지)로 확인되었습니다. 해당 도로는 특정 업체의 소유 또는 전용 사용 공간이 아니므로, 도로상 발생한 쓰레기에 대하여 특정 업체에 청소 의무를 부과하기는 어려움을 알려드립니다. 4. 다만, 민원 제기 구간에 대하여 현장 점검을 실시하였으며, 도로 이용자가 발생시키는 쓰레기의 수거를 유도하기 위하여 공공용 마대를 비치하였습니다. 또한 동 행정복지센터와 협조하여 주변 환경정비를 실시하였습니다. 아울러 현장에 설치된 주차 관련 시설물 중 노후·파손된 시설물에 대하여는 관계자에게 정비 또는 교체를 요청하였음을 알려드립니다. 5. 기타 문의사항이 있으신 경우 서원구 환경위생과 청소팀(043-201-6303)으로 연락주시면 성실히 안내해 드리겠습니다. 감사합니다. 끝.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":25,"published_at":"2026-06-14T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2026-06-14T14:00:00+09:00"},{"id":34,"message_id":30,"version_no":1,"body":"1. 우리도서관의 도서정보서비스에 대한 의견을 주신데 대하여 감사드리며, 귀하께서 문의하신 사항에 대하여 다음과 같이 안내를 드립니다. ▶ 홈페이지 서버 확장 및 방법 모색 요청 ∙ 최근 지속적인 사이버위협으로 인해 홈페이지 접속 지연 및 일시적인 서비스 장애 현상이 발생하였습니다. ∙ 이에 대응하기 위해 다각도로 기술적 검토를 진행하였으나, 현재 발생하고 있는 장애는 단순히 이용자 환경의 브라우저 보안 업데이트나 단순한 서버 확장(용량 증설)만으로는 근본적인 해결이 어려운 구조적 한계가 있음을 확인하였습니다. ∙ 따라서 도서관에서는 보다 근본적이고 강력한 보안 및 안정성 확보를 위해, 외부 악성 트래픽을 차단할 수 있는 디도스(DDoS) 방어 장비 도입 등 다각적인 고도화 방안을 적극적으로 검토하고 있습니다. ∙ 현재 시스템 용량 일부 확장 및 최적화를 통해 서비스가 정상 운영되고 있습니다. 다만, 장애 발생 시점에 접속하였던 일부 이용자의 경우 브라우저에 저장된 접속 정보(쿠키 및 캐시 등)로 인해 접속 오류가 지속될 수 있으므로, 도서관 홈페이지 공지사항에서 안내드린 바와 같이 인터넷 사용기록(쿠키 및 캐시)을 삭제 후, 다시 접속하여 주시면 감사하겠습니다. 2. 도서관 이용에 불편을 드린 점 대하여 사과의 말씀을 드리며, 향후에도 안정적인 시스템 운영ㆍ관리에 만전을 기하도록 하겠습니다. 또한, 답변 내용에 대한 추가 설명이 필요한 경우, 청주시립도서관 정보팀(☎043-201-4043) 으로 연락주시면 친절히 안내드리겠습니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":26,"published_at":"2026-07-05T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2026-07-05T14:00:00+09:00"},{"id":35,"message_id":31,"version_no":1,"body":"1. 구정 발전에 대한 관심과 협조에 감사드립니다. 2. 귀하께서 요청하신 해당 폐기물 수거요청을 처리하였습니다. 또한 수거 관련한 별도의 안내사항 참고 부탁드리겠습니다. 3. 관련 문의사항은 상당구청 환경위생과(043-201-5307)로 연락주시면 성심껏 답변드리도록 하겠습니다. 감사합니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":27,"published_at":"2026-07-17T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2026-07-17T14:00:00+09:00"},{"id":36,"message_id":32,"version_no":1,"body":"1. 귀하의 무궁한 발전을 기원합니다. 2. 귀하께서 제출하신 '수곡처리구역 분류식화 하수관로 정비사업 관련한 임시포장 구간의 통행불편'에 대하여 검토한 결과를 아래와 같이 답변드립니다. ㅇ (답변) - 먼저, 본 공사 오수관로 매설에 따른 임시 아스콘포장구간의 상태불량 등으로 차량통행에 불편을 드린 점 대단히 죄송하다는 말씀을 드립니다. - 우선, 귀하께서 제기하신 민원과 관련하여, 현장관리 및 공정관리를 시행하고 있는 건설사업관리단 및 시공사 측에 즉시 민원내용(개인정보 제외) 검토와 대책마련을 지시하였으며, - 현장확인한 결과, 임시아스콘 포장구간 중 상태가 불량한 구간을 확인하였으며, 아스콘 수급 상황에 따라 보완시공을 실시(7월 마지막주 계획)하도록 하여, 본포장 전까지 차량통행에 지장이 없도록 최선을 다하겠습니다. - 아울러, 주기적인 예찰 및 실제 운행을 통해, 차량통행 불편이 최소화 될수 있도록 지속적인 점검과 관심을 기울이도록 하겠습니다. - 다시한번, 공사로 인해 불편사항을 드린 점 죄송하다는 말씀드리며, 향후에도 공사 현장 주변의 원활하고 안전한 교통 흐름이 조성될 수 있도록 노력하겠음을 깊이 양해하여 주시기 바랍니다. 끝.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":28,"published_at":"2026-07-17T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2026-07-17T14:00:00+09:00"},{"id":37,"message_id":33,"version_no":1,"body":"1. 시정발전에 협조해 주심에 감사합니다. 2. 귀하께서 민원 내용은 \"대농어린이공원 조합놀이대 계단 보수 요청\"으로 이해됩니다. 3. 해당 조합놀이대는 현재 교체 예정으로, 조속한 시일 내에 추진하여 이용에 불편이 없도록 하겠습니다. 4. 추가로 궁금하신 사항은 청주시 공원관리과(☎ 043-201-4433)로 문의하여 주시면 친절히 안내해 드리겠습니다. 감사합니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","published_by":29,"published_at":"2026-07-20T14:00:00+09:00","retracted_at":null,"retract_reason":null,"evidence_snapshot":null,"context_version":null,"created_at":"2026-07-20T14:00:00+09:00"},{"id":38,"message_id":34,"version_no":1,"body":"1. 시정발전에 관심을 가져주셔서 감사합니다. 2. 귀하께서 요청하신 봉명동 새마을금고 앞 가로수 제거 후 깨끗한 뒷정리 요청건에 대하여 처리완료하였습니다. 추후 동일한 민원이 발생하지 않도록 신경쓰도록 하겠습니다. 궁금하신 사항은 공원산림본부 산림관리과(201-2904)로 문의주시면 성심성의껏 답변드리겠습니다.","origin":"staff","origin_job_id":null,"based_on_version_id":null,"edited_by":null,"publish_state":"published","publis /* 원칙④ — 입력 시점 마스킹(수집 통제): 원본은 저장하지 않는다 */
function maskPII(t){
  const hits=[]; let o=t;
  o=o.replace(/(\d{6})[-\s]?[1-4]\d{6}/g,function(){hits.push('주민등록번호');return '$1-*******'.replace('$1',arguments[1]);});
  o=o.replace(/\b(01[016789])[-\s]?(\d{3,4})[-\s]?(\d{4})\b/g,function(a,b,c,d){hits.push('휴대폰 번호');return b+'-****-'+d;});
  o=o.replace(/\b\d{4}[-\s]\d{4}[-\s]\d{4}[-\s]\d{4}\b/g,function(){hits.push('카드번호');return '****-****-****-****';});
  o=o.replace(/\b\d{2,3}-\d{2,6}-\d{4,7}\b/g,function(a){ if(/^01/.test(a))return a; hits.push('계좌번호'); return '***-****-*****';});
  o=o.replace(/[\w.\-]+@[\w.\-]+\.[a-zA-Z]{2,}/g,function(){hits.push('이메일');return '****@****';});
  return {text:o, hits:[...new Set(hits)]};
}
/* 중복 접수 후보 탐지 — 임베딩 유사도의 프로토타입 근사 */
function bigrams(t){
  const h=(t.match(/[가-힣]+/g)||[]).join(' '); const out=new Set();
  for(let i=0;i<h.length-1;i++){ const g=h.slice(i,i+2); if(!/\s/.test(g)) out.add(g); }
  return out;
}
function findDupe(t){
  const a=bigrams(t); if(a.size<2) return null;
  let best=null,bs=0;
  S.cases.filter(function(c){return c.stage<5;}).forEach(function(c){
    const b=bigrams(c.title+' '+(c.raw||''));
    let hit=0; a.forEach(function(g){ if(b.has(g)) hit++; });
    if(hit>bs){bs=hit;best=c;}
  });
  return bs>=4?best:null;   // 어절이 달라도 표현이 겹치면 유사 접수로 판단
}

    (list.length?list.map(listCard).join('')

function listCard(c){
  const pct=Math.round(c.stage/5*100), done=c.stage===5;
  const st = c.status==='보완요청'?'<span class="tag t-amber">보완 요청</span>'

    : '<span class="tag t-blue">'+esc(c.status==='AI검토'?'접수 완료':'처리 중')+'</span>';

  const dots='<div class="stepdots">'+[1,2,3,4,5].map(function(n){
      const cls = n<c.stage?'done' : n===c.stage?(done?'done':'now') : '';
      return '<div class="sd '+cls+'"><b></b>'+(n<5?'<u></u>':'')+'</div>';}).join('')+'</div>';
  const label='<div class="steplabel"><span>접수</span><span>AI 검토</span><span>배정</span><span>처리</span>'+
    '<b class="'+(done?'g':'')+'">'+(done?'완료':'답변')+'</b></div>';
  return '<div class="mcard" onclick="'+dest+'">'+
    '<div class="top"><span class="no">'+c.id+'</span>'+st+'</div>'+
    '<div class="row"><div class="ringwrap">'+ring(pct, done)+'</div>'+
      '<div style="flex:1;min-width:0"><h4>'+esc(c.title)+'</h4>'+
      '<div class="meta">'+
      (c.status==='보완요청'?'<b>'+esc(c.needFile||'추가 자료')+'</b> · <span class="act">제출하기 \u203a</span>'
        : done?(c.nonJur?'소관 기관 안내 ('+esc(c.nonJur)+')':c.aiClosed?'AI 즉시 답변':'담당자 답변')+' · <b style="color:#2F6FED">답변서 보기 \u203a</b>'
        : esc(c.dept)+' · 예상 완료 <b>'+eta(c)+'</b>')+'</div></div></div>'+
    dots+label+'</div>';
}

/* C-04 트래커 */
function cTrack(){
  const c=getCase(S.activeCase); if(!c) return HB('진행상황','','list')+'<div class="p-body"><div class="empty">민원을 선택해 주세요</div></div>';
  const pub=c.ev.filter(e=>e.vis!=='int'&&e.cz);
  const low=(c.conf!=null&&c.conf<S.thresholds.assign);
  const steps=STAGE_NAMES.map((nm,i)=>{
    const n=i+1, cls=n<c.stage?'done':n===c.stage?'now':'wait';
    let sub='', extra='';
    if(n===1) sub=(c.ev[0]?c.ev[0].t:'07.09 09:12')+(c.files?' · 사진 '+c.files+'장 첨부':'')+(c.addr?' · 📍 '+esc(c.addr):'');
    if(n===2) sub=(c.cat||'민원 분류')+' 완료';
    if(n===3){
      if(low){ sub='적합한 부서를 검토 중입니다'; extra='<div class="why" style="border-color:#F2C9C6"><div class="in" style="padding-top:10px;color:#8E241D">'+
        '신뢰도 '+cfs(c.conf)+'이 임계 '+S.thresholds.assign.toFixed(2)+'에 미달하여 자동 배정을 하지 않았습니다. 담당자가 직접 확인 후 배정합니다.</div></div>'; }
      else { sub='담당 부서 배정 — '+c.dept;
        extra='<details class="why"><summary>왜 이 부서인가요? · 신뢰도 '+cfs(c.conf)+' <span>▾</span></summary><div class="in">'+
        '<div class="gauge"><i style="width:'+((c.conf||0)*100)+'%"></i><u style="left:'+(S.thresholds.assign*100)+'%"></u></div>'+
        '· “'+esc((c.cat||'해당 업무').split(' ')[0])+'” 업무분장 일치<br>· 위치가 해당 부서 관리구역에 포함<br>· 유사 민원 83%가 동일 부서에서 처리<br>'+
        '<a style="color:#2F6FED;display:inline-block;margin-top:7px;cursor:pointer" onclick="objection()">배정 이의/수정 요청 ›</a></div></details>'; }
    }
    if(n===4){
      const p4=pub.filter(e=>/현장|협의|검토|자료|재개/.test(e.cz));
      sub = p4.length? p4.map(e=>esc(e.cz)+'<span class="zt">⚡ 담당자 업무에서 자동 반영</span>').join('<br>') : '담당자 배정 후 처리 예정';
    }
    if(n===5) sub = c.stage===5? '답변이 등록되었습니다' : '대기 · 지연 시 사유가 함께 안내됩니다';
    return '<div class="step '+cls+'"><div class="line"></div><div class="dot">'+(cls==='done'?'✓':cls==='now'?'●':'')+'</div>'+
      '<div style="flex:1"><h5>'+nm+'</h5><div class="sub">'+sub+'</div>'+extra+'</div></div>';
  }).join('');
  return HB(c.title.slice(0,16),'','list')+'<div class="p-body">'+
    '<div class="tracker-head"><div class="no">'+c.id+'</div><h3>'+esc(c.title)+'</h3>'+
    '<div class="eta"><div><span>예상 완료일</span><br><b>'+eta(c)+'</b></div>'+
    '<div style="text-align:right"><span>현재 단계</span><br><b>'+esc(STAGE_NAMES[c.stage-1])+' · '+c.stage+'/5</b></div></div></div>'+
    '<div class="steps">'+steps+'</div>'+
    ((c.questions||[]).some(function(q){return !q.a;})?'<div class="ans" style="border-color:#F0D2A3;background:#FDF8EE"><h4 style="color:#8A4E04">💬 담당자 추가 질문</h4><div style="font-size:13.5px;line-height:1.7">'+esc(c.questions.filter(function(q){return !q.a;})[0].q)+'</div><textarea id="qans" placeholder="답변을 적어주세요" style="width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;min-height:70px;outline:none;font-family:inherit"></textarea><button class="btn btn-blue sm" style="margin-top:8px" onclick="answerQuestion(\''+c.id+'\')">답변 보내기</button></div>':'')+
    '<div class="callbox"><div><p>담당 부서</p><b>'+esc(c.dept)+'</b></div><div class="num">☎ 043-201-0000</div></div>'+
    '<div class="notice-sms">📱 단계가 바뀔 때마다 <b>문자(SMS)</b>로 자동 안내되어 확인 전화가 필요 없어요. 담당자 개인 연락처는 표시하지 않습니다.</div></div>';
}

  if(t.inq) return '<b>'+t.mi+'</b> 문의로 보여요. '+(t.tip||'담당자가 확인한 정확한 답변을 바로 안내드릴게요.')+' 부서 배정 없이 <b>'+ORG.general+'</b>에서 확인 후 회신됩니다.';
  var need=(t.form&&t.form.need)||['text','addr','file'];
  var want=need.filter(function(k){return k!=='text';}).map(function(k){return {addr:'위치',file:'사진',time:'발생 시간대',route:'노선 번호',period:'기간',vehicle:'차량번호'}[k]||k;}).join(' · ');
  var days=t.days||5;
  return '<b>'+t.ma+' › '+t.mi+'</b> 민원으로 보여요. '+(t.tip||'')+
    (t.amb?' 소관 부서가 갈릴 수 있어 <b>'+ORG.minwonLabel+'</b>가 확인 후 배정합니다 (후보 '+[t.d].concat(t.alt||[]).join(' · ')+').'
          :' 예상 처리 부서는 <b>'+t.d+'</b>이며 보통 <b>'+days+'일</b> 안에 처리돼요.')+
    (t.urg?' <b style="color:#D5453C">우선 처리 대상</b>입니다.':'')+
    (want?'<div style="margin-top:7px;padding:8px 10px;background:#F3F6FB;border-radius:9px;font-size:12px;color:#4C6DA8">함께 주시면 빨라요: <b>'+want+'</b></div>':'');
}

function analyze(text, forceFile){
  if(!forceFile && FAQ_K.some(function(k){return text.includes(k);})) return {type:'faq'};
  if(BLOCK.some(function(k){return text.includes(k);})) return {type:'escalate', dept:ESCALATE_DEPT};
  /* 키워드 특이도 점수: 일치한 키워드 길이의 합 — '재활용'(3) < '배출 요일'(5), '지방도'(3) < '고라니'+'사체'(5) */
  var best=null, bs=0;
  for(var i=0;i<TAXO.length;i++){ var t=TAXO[i]; var sc=0;
    t.kw.forEach(function(k){ if(text.includes(k)) sc+=k.replace(/\s/g,'').length; });
    if(sc>0 && t.inq){ sc+=1; if(/언제|어디서|몇 시|어떻게|인가요|나요\?|알려주|궁금/.test(text)) sc+=3; }
    if(sc>bs){ bs=sc; best=t; }
  }
  if(best){ var t=best; var tip=buildTip(t,text);
    if(t.inq) return {type:'inquiry', dept:ORG.general, conf:t.c||.9, cat:t.ma+' › '+t.mi, major:t.ma, minor:t.mi, ans:t.ans, cands:[], ambiguous:false, urgent:false, tip:tip};
    var cands=[t.d].concat(t.alt||[]);
    return {type:'file', dept:t.d, conf:t.c, cat:t.ma+' › '+t.mi, major:t.ma, minor:t.mi, cands:cands,
            ambiguous:!!t.amb || (t.c<S.thresholds.assign), urgent:!!t.urg, why:t.why||'', tip:tip};
  }
  return {type:'file', dept:ORG.general, conf:.62, cat:'미분류 › 분류 검토 필요', major:'미분류', minor:'분류 검토 필요',
          cands:ORG.fallbackCands, ambiguous:true, urgent:false, why:'등록된 키워드와 일치하지 않아 사람의 소관 판단이 필요',
          tip:'말씀하신 내용은 <b>어느 부서 소관인지 바로 판단하기 어려운</b> 사안이에요. 접수하시면 <b>'+ORG.minwonLabel+'</b>가 내용을 확인해 담당 부서를 정하고, 진행 상황은 문자로 알려드려요.<div style="margin-top:7px;padding:8px 10px;background:#F3F6FB;border-radius:9px;font-size:12px;color:#4C6DA8">함께 주시면 빨라요: <b>위치 · 사진</b></div>'};
}

/* ══════ 차트 헬퍼 v2 — 부드러운 곡선 · 영역 그라데이션 · 현재월 밴드 · 값 라벨 ══════ */
function _smooth(pts){
  if(pts.length<3) return pts.map(function(p,i){return (i?'L':'M')+p[0]+','+p[1];}).join(' ');
  var d='M'+pts[0][0]+','+pts[0][1];
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6, c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0]+','+p2[1];
  }
  return d;
}
function lineChart(series, w, h, labels, opt){
  opt=opt||{}; var P={l:42,r:52,t:18,b:30}, W=w-P.l-P.r, H=h-P.t-P.b, n=labels.length, cur=(opt.cur==null?6:opt.cur);
  var mx=Math.max.apply(null, series.reduce(function(a,s){return a.concat(s[1]);},[1]))*1.1;
  var x=function(i){return +(P.l+i*(W/(n-1))).toFixed(1);}, y=function(v){return +(P.t+H-(v/mx)*H).toFixed(1);};
  var uid='g'+Math.random().toString(36).slice(2,7);
  var defs='<defs>'+series.map(function(s,i){return '<linearGradient id="'+uid+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+s[2]+'" stop-opacity=".22"/><stop offset="1" stop-color="'+s[2]+'" stop-opacity="0"/></linearGradient>';}).join('')+'</defs>';
  var band=cur>=0?'<rect x="'+(x(cur)-W/(n-1)/2)+'" y="'+P.t+'" width="'+(W/(n-1))+'" height="'+H+'" fill="#2F6FED" opacity=".05" rx="6"/>':'';
  var grid=[0,.25,.5,.75,1].map(function(g){ var yy=y(mx*g/1.1*1.1); return '<line x1="'+P.l+'" x2="'+(P.l+W)+'" y1="'+yy+'" y2="'+yy+'" stroke="#E9EDF3" stroke-dasharray="2,4"/><text x="'+(P.l-8)+'" y="'+(yy+3.5)+'" font-size="9.5" fill="#A6AEBD" text-anchor="end">'+Math.round(mx*g)+'</text>';}).join('');
  var body=series.map(function(s,i){
    var pts=s[1].map(function(v,j){return [x(j),y(v)];});
    var d=_smooth(pts);
    var area=d+' L'+x(n-1)+','+y(0)+' L'+x(0)+','+y(0)+' Z';
    var last=s[1][n-1], prev=s[1][cur-1]||s[1][cur], curv=s[1][cur];
    return '<path d="'+area+'" fill="url(#'+uid+i+')"/>'+
      '<path d="'+d+'" fill="none" stroke="'+s[2]+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
      pts.map(function(p,j){ return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="transparent"><title>'+s[0]+' · '+labels[j]+': '+s[1][j]+'건</title></circle>'+
        (j===cur?'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="'+s[2]+'" stroke="#fff" stroke-width="2"/>':''); }).join('')+
      (i<3?'<text x="'+(x(n-1)+6)+'" y="'+(y(last)+3.5)+'" font-size="10" font-weight="700" fill="'+s[2]+'">'+last+'</text>':'');
  }).join('');
  var lab=labels.map(function(l,i){return '<text x="'+x(i)+'" y="'+(h-8)+'" font-size="10" fill="'+(i===cur?'#2F6FED':'#8A93A6')+'" text-anchor="middle" font-weight="'+(i===cur?'700':'500')+'">'+l+'</text>';}).join('');
  var axis='<line x1="'+P.l+'" x2="'+(P.l+W)+'" y1="'+(P.t+H)+'" y2="'+(P.t+H)+'" stroke="#D7DEE9"/>';
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block;font-family:var(--mono);overflow:visible">'+defs+band+grid+axis+body+lab+'</svg>';
}
function radarChart(axes, series, size, opt){
  opt=opt||{}; var cx=size/2, cy=size/2+4, R=size/2-44, n=axes.length;
  var pt=function(i,r){var a=-Math.PI/2+i*2*Math.PI/n; return [+(cx+r*Math.cos(a)).toFixed(1), +(cy+r*Math.sin(a)).toFixed(1)];};
  var mx=Math.max.apply(null, series.reduce(function(a,s){return a.concat(s[1]);},[1]))*1.05;
  var rings=[1,.75,.5,.25].map(function(g,k){return '<polygon points="'+axes.map(function(_,i){return pt(i,R*g).join(',');}).join(' ')+'" fill="'+(k%2?'#fff':'#F6F8FB')+'" stroke="#E3E7EE"/>';}).join('');
  var spokes=axes.map(function(a,i){var p=pt(i,R); return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#E3E7EE"/>';}).join('');
  var uid='r'+Math.random().toString(36).slice(2,7);
  var defs='<defs>'+series.map(function(s,i){return '<radialGradient id="'+uid+i+'"><stop offset="0" stop-color="'+s[2]+'" stop-opacity=".05"/><stop offset="1" stop-color="'+s[2]+'" stop-opacity=".28"/></radialGradient>';}).join('')+'</defs>';
  var polys=series.map(function(s,i){return '<polygon points="'+s[1].map(function(v,j){return pt(j,R*v/mx).join(',');}).join(' ')+'" fill="url(#'+uid+i+')" stroke="'+s[2]+'" stroke-width="2.2" stroke-linejoin="round"/>'+
    s[1].map(function(v,j){var p=pt(j,R*v/mx); return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.4" fill="'+s[2]+'" stroke="#fff" stroke-width="1.6"><title>'+s[0]+' · '+axes[j]+': '+v+'</title></circle>';}).join('');}).join('');
  var main=series[series.length-1];
  var labels=axes.map(function(a,i){var l=pt(i,R+22); var anchor=Math.abs(l[0]-cx)<8?'middle':(l[0]<cx?'end':'start');
    return '<text x="'+l[0]+'" y="'+(l[1]+1)+'" font-size="10.5" fill="#1B2233" text-anchor="'+anchor+'" font-weight="700">'+a+'</text>'+
      '<text x="'+l[0]+'" y="'+(l[1]+13)+'" font-size="9.5" fill="'+main[2]+'" text-anchor="'+anchor+'" font-family="var(--mono)" font-weight="700">'+main[1][i]+'</text>';}).join('');
  return '<svg viewBox="0 0 '+size+' '+(size+14)+'" width="100%" style="display:block;font-family:var(--sans);overflow:visible">'+defs+rings+spokes+polys+labels+'</svg>';
}
function legend(series, cur){
  return '<div class="lgd" style="flex-wrap:wrap;gap:10px 16px">'+series.map(function(s){
    var v=(s[1]&&s[1].length)?s[1][cur==null?6:cur]:null, p=(s[1]&&s[1].length)?s[1][(cur==null?6:cur)-1]:null;
    var d=(v!=null&&p!=null)?(v-p):null;
    return '<span style="display:inline-flex;align-items:center;gap:5px"><i style="background:'+s[2]+';width:10px;height:10px;border-radius:50%"></i>'+s[0]+
      (v!=null?' <b style="font-family:var(--mono);color:var(--ink)">'+v+'</b>'+(d!=null?'<em style="font-style:normal;font-family:var(--mono);font-size:10px;color:'+(d>0?'var(--red)':d<0?'var(--green)':'var(--ink-4)')+'">'+(d>0?'▲':d<0?'▼':'—')+Math.abs(d)+'</em>':''):'')+'</span>';}).join('')+'</div>';
}
function barsChart(rows, w, h, color){
  var P={l:8,r:8,t:14,b:26}, W=w-P.l-P.r, H=h-P.t-P.b, n=rows.length, mx=Math.max.apply(null,rows.map(function(r){return r[1];}))*1.15, bw=W/n*0.62;
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block;font-family:var(--mono)">'+rows.map(function(r,i){
    var x=P.l+i*(W/n)+(W/n-bw)/2, bh=r[1]/mx*H, y=P.t+H-bh;
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="5" fill="'+(r[2]||color||'#2F6FED')+'"><title>'+r[0]+': '+r[1]+'</title></rect>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9.5" text-anchor="middle" fill="var(--ink-2)" font-weight="700">'+r[1]+'</text>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-8)+'" font-size="9.5" text-anchor="middle" fill="#8A93A6">'+r[0]+'</text>';}).join('')+'</svg>';
}
function hourMatrix(){
  var days=['월','화','수','목','금','토','일'];
  return days.map(function(d,di){ return HOURS.map(function(v,hi){ var f=WEEKF_RAW[di]; var night=(hi>=22||hi<6)?1.35:1; var w=(di>=5&&hi>=10&&hi<=16)?1.6:1; return Math.round(v*f*(di>=5?night*w:1)*(1+(((hi*7+di*3)%5)-2)*0.04)); }); });
}

    '<div style="font-size:11.5px;color:var(--ink-3);margin-bottom:6px">'+esc(T[1])+' · 안내처 선택</div>'+
    '<div class="chips" style="margin-bottom:12px">'+T[3].map(function(o,i){return '<button class="chip" data-on="'+(S._nj.org===i?1:0)+'" onclick="S._nj.org='+i+';renderNonJur(\''+id+'\')" title="'+esc(o[1])+'">'+esc(o[0])+'</button>';}).join('')+'</div>'+

function nonJurAnswer(id){
  var c=getCase(id); if(!c) return; closeModal();
  var T=NONJUR[S._nj.tpl];
  var txt=(S._nj.text||'').replace(/<[^>]+>/g,'');
  c.answer=txt; c.nonJur=T[0]; c.stage=5; c.status='소관외 종결'; c.isNew=false; c.dept=ORG.general;
  c.proc=(c.proc||[]).concat([{k:'답변',t:now(),v:'소관 외 안내 답변 — '+T[0]}]);
  S.metrics.nonJur=(S.metrics.nonJur||0)+1;
  fire(id, ORG.minwonStaff+' 소관 외 안내 답변 등록 — '+T[0], '답변 완료 — 소관 기관 안내', {stage:5,status:'소관외 종결',sms:1});

function sAppr(){
  const c=getCase(S.activeStaffCase); const st=c.appr||0;
  const line=[['기안','박주무관',1],['검토','이팀장',2],['전결','김과장',3]];
  return mh('결재 상신','S-05','<span class="sid">#'+short(c.id)+'</span>')+

   '<div class="panel"><header><h3>결재선</h3><div class="r">전결 규정 3단</div></header>'+
     line.map(l=>{ const cls= st>l[2]?'done': st===l[2]?'now':'';
       return '<div class="appr '+cls+'"><span class="st">'+(st>l[2]?'✓':l[2])+'</span>'+
       '<div><b>'+l[0]+'</b> <span>'+l[1]+'</span></div>'+

       : st===1?'<button class="b pri" onclick="apprStep(\''+c.id+'\',2)">검토 승인 (이팀장)</button>'
       : st===2?'<button class="b green" onclick="apprStep(\''+c.id+'\',3)">전결 처리 (김과장) — 시민 답변 게시</button>'

function apprStep(id,n){
  const c=getCase(id); c.appr=n;
  if(n===2){ fire(id,'이팀장 검토 승인','답변 검토 중'); }
  else{ c.answer=(c.draft||''); c.dproc=(c.dproc||[]).concat([{k:'전달',t:now(),v:'전결 완료 — '+ORG.citizen+' 답변 전달'}]); 
    fire(id,'김과장 전결 완료','답변 완료 — 처리기간 5일',{stage:5,status:'답변완료',sms:1});
    S.metrics.draftUse=+(S.metrics.draftUse+0.4).toFixed(1);
    toast('📄','답변서 게시','시민 C-05 답변서에 출처 칩과 함께 게시되었습니다');
  }
}

function aStats(){
  const P=S.statP||'day', D=STAT[P];
  const recv=D.recv.slice(), done=D.done.slice();
  if(S.filed){ recv[recv.length-1]+=S.filed; }          // 프로토타입에서 접수한 건 실시간 반영
  const mx=Math.max.apply(null,recv)||1;
  const sum=recv.reduce(function(a,b){return a+b;},0);
  const dsum=done.reduce(function(a,b){return a+b;},0);
  const last=recv[recv.length-1], prev=recv[recv.length-2]||last;
  const chg=prev?(((last-prev)/prev)*100):0;
  const avg=Math.round(sum/recv.length);
  const label={day:'최근 14일',week:'최근 8주',month:'최근 12개월'}[P];

  const cats=CATS.map(function(c){
    let extra=0;
    Object.keys(S.filedCats||{}).forEach(function(k){
      if(c.k.some(function(w){return k.indexOf(w)>=0;})) extra+=S.filedCats[k];
    });
    return {n:c.n,d:c.d,avg:c.avg,delta:c.delta,c:c.c+extra};
  }).sort(function(a,b){return b.c-a.c;});
  const ctot=cats.reduce(function(a,c){return a+c.c;},0);

function freqRows(){
  var cnt={}; S.cases.forEach(function(c){ if(c.minor){ cnt[c.minor]=(cnt[c.minor]||0)+1; } });
  var list=TAXO.filter(function(t){return !t.inq;}).map(function(t,i){
    var n=(cnt[t.mi]||0)+Math.max(3,120-i*4);
    var up=+((((i*37)%41)-12)).toFixed(1);
    var pol=POLICIES.filter(function(p){ return p.cat===t.ma || p.t.indexOf(t.mi.split('·')[0].split(' ')[0])>=0; })[0]||null;
    return {t:t,n:n,up:up,pol:pol};
  }).sort(function(a,b){return b.n-a.n;}).slice(0,12);
  var mx=list[0].n;
  list.forEach(function(r){ r.score=Math.min(100, Math.round(r.n/mx*62 + Math.max(0,r.up)*0.9 + (r.t.amb?8:0) + (r.t.urg?12:0))); });
  return list;
}

/* ══════ 민원과 추가 질문 → 시민 답변 (Q&A 루프) ══════ */

  S._q=tpl[0];
  modal('추가 질문 — #'+short(c.id),'배정 전에 확인이 필요한 내용을 '+ORG.citizen+'에게 묻습니다. 질문은 트래커·문자로 전달되고, 답변이 오면 이 건이 <b>💬 답변 도착</b>으로 큐 상단에 올라옵니다.'+
    '<div class="chips" style="margin-top:12px">'+tpl.map(function(q,i){return '<button class="chip" data-on="'+(i===0?1:0)+'" onclick="S._q=this.textContent;this.closest(\'.modal\').querySelectorAll(\'.chip\').forEach(function(x){x.dataset.on=0});this.dataset.on=1">'+esc(q)+'</button>';}).join('')+'</div>'+
    '<input id="qcustom" placeholder="직접 입력 (선택)" style="width:100%;margin-top:11px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;outline:none">',
    '<button class="b" onclick="closeModal()">취소</button><button class="b pri" onclick="sendQuestion(\''+id+'\')">질문 보내기</button>');
}
function sendQuestion(id){
  var c=getCase(id); if(!c) return; var i=document.getElementById('qcustom'); var q=(i&&i.value.trim())||S._q; closeModal();
  c.questions=(c.questions||[]).concat([{q:q,t:now(),a:null,at:null}]); c.status='질문대기'; c.isNew=false;
  c.proc=(c.proc||[]).concat([{k:'질문',t:now(),v:'추가 질문 — '+q}]);

}
function answerQuestion(id){
  var c=getCase(id); if(!c) return; var el=document.getElementById('qans'); var a=(el&&el.value.trim())||'';
  if(!a){ toast('✎','답변을 입력해 주세요',''); return; }

    fire(id, ORG.minwonStaff+' 재검토 — 원 답변 유지 안내', '재검토 결과가 등록되었습니다', {stage:5,status:'답변완료',sms:1}); c.isNew=false; }

/* ══════ 정책 수립 7단계 위저드 ══════ */
var PSTEPS=[['근거 분석','군집·추이·대상'],['원인 진단','AI 원인 후보 확정'],['정책 초안','문서 작성·확정'],['부서 협의','소관·협조 회신'],['예산·일정','추정·재원·요구서'],['안건 상신·심의','정책조정회의'],['시행·효과 추적','KPI · 근거 민원 감축']];
function pobj(id){ return POLICIES.filter(function(x){return x.id===id;})[0]; }
function pdone(p,k){ return (p.plog||[]).some(function(l){return l.k===k;}); }
function pFirst(p){ for(var k=1;k<=7;k++){ if(!pdone(p,k)) return k; } return 7; }
function pLog(p,k,v){ p.plog=(p.plog||[]).filter(function(l){return l.k!==k;}).concat([{k:k,t:now(),v:v}]); }
function pGo(n){ S.pstep=n; window.scrollTo(0,0); render(); }
function pNext(){ pGo(Math.min(7,(S.pstep||1)+1)); }
function pBar(p){ var n=S.pstep||pFirst(p); return '<div class="hproc">'+PSTEPS.map(function(s,i){var k=i+1; var cls=pdone(p,k)?'done':(k===pFirst(p)?'now':'');
  return '<div class="hp '+cls+' clk'+(n===k?' cur':'')+'" onclick="pGo('+k+')"><i>'+(pdone(p,k)?'✓':k)+'</i><b>'+s[0]+'</b><span>'+esc((p.plog||[]).filter(function(l){return l.k===k;}).map(function(l){return l.v;})[0]||s[1])+'</span></div>'+(i<6?'<em></em>':'');}).join('')+'</div>'; }
function pConfirm(id,k,v){ var p=pobj(id); pLog(p,k,v); if(k===2&&!p.cause) p.cause=v; toast('✓',PSTEPS[k-1][0]+' 확정',v); S.pstep=Math.min(7,k+1); render(); }
function pConsult(id,dept){ var p=pobj(id); p.consult=(p.consult||[]); var c=p.consult.filter(function(x){return x.dept===dept;})[0]; if(c) return;

function render(){
  const vkey=S.role+'|'+S.cv+'|'+S.sv+'|'+S.av;          // 같은 화면이면 스크롤 유지
  const same=(S._vkey===vkey);
  const pb=document.querySelector('.p-body');
  const keepBody=same&&pb?pb.scrollTop:0;
  const keepWin=same?(window.scrollY||0):0;
  S._vkey=vkey;
  const roles=[['doc','AI민원 도입'],['spec','AI민원 개발 기획'],['citizen','시민 웹'],['minwon',ORG.minwonLabel],['staff','담당자 워크스테이션'],['admin','관리자 대시보드']];
  const nNew=S.cases.filter(c=>c.isNew).length;
  const nAsg=S.cases.filter(function(c){return c.form&&c.form.purpose==='transfer'&&c.form.state==='sent';}).length;
  $('#roleswitch').innerHTML=roles.map(r=>'<button data-on="'+(S.role===r[0]?1:0)+'" onclick="setRole(\''+r[0]+'\')">'+r[1]+
    (r[0]==='minwon'&&nNew?'<em class="nb">'+nNew+'</em>':'')+(r[0]==='staff'&&nAsg?'<em class="nb" style="background:var(--amber)">'+nAsg+'</em>':'')+'</button>').join('');
  const st=$('#stage'); st.dataset.role=S.role;
  st.innerHTML = (S.role==='doc'||S.role==='spec')?docView(): S.role==='citizen'?citizen(): S.role==='minwon'?staff(): S.role==='staff'?dept():admin();
  const pb2=document.querySelector('.p-body');
  if(pb2&&keepBody) pb2.scrollTop=keepBody;
  if(keepWin) window.scrollTo(0,keepWin);
  if(S.role==='minwon' && !S.newPopSeen && S.cases.some(function(c){return c.isNew;})){ S.newPopSeen=true; setTimeout(showNewPopup,180); }
  if(S.role==='staff' && !S.asgPopSeen && transfers().some(function(c){return c.stage<5;})){ S.asgPopSeen=true; setTimeout(showAssignedPopup,180); }
  if(S.role==='doc'||S.role==='spec') setTimeout(mountDoc,0);
}
