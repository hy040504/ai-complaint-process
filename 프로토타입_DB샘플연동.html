254 148 H298\" stroke=\"#2f6fed\" stroke-width=\"2.4\" marker-end=\"url(#nasArrBlue)\"/>\n              <text x=\"276\" y=\"134\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2f6fed\">접수<\/text>\n              <path d=\"M302 214 H258\" stroke=\"#5b6478\" stroke-width=\"2.2\" marker-end=\"url(#nasArr)\"/>\n              <text x=\"280\" y=\"235\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5b6478\">공개상태<\/text>\n              <path d=\"M754 146 H798\" stroke=\"#b8902a\" stroke-width=\"2.4\" marker-end=\"url(#nasArrGold)\"/>\n              <text x=\"776\" y=\"132\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#b8902a\">요약/배정<\/text>\n              <path d=\"M798 222 H758\" stroke=\"#5b6478\" stroke-width=\"2.2\" marker-end=\"url(#nasArr)\"/>\n              <text x=\"778\" y=\"244\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5b6478\">승인/업무이벤트<\/text>\n\n              <rect x=\"320\" y=\"356\" width=\"200\" height=\"46\" rx=\"12\" fill=\"#e9f6ee\" stroke=\"#b9dfc8\"/>\n              <text x=\"420\" y=\"376\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1f6f42\">자동 백업 · 버전관리<\/text>\n              <text x=\"420\" y=\"392\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#4a7a5d\">삭제파일 복구 · 장애 대응<\/text>\n              <rect x=\"540\" y=\"356\" width=\"200\" height=\"46\" rx=\"12\" fill=\"#fdf3e2\" stroke=\"#f0d2a1\"/>\n              <text x=\"640\" y=\"376\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#9b5a06\">중앙 통합관리<\/text>\n              <text x=\"640\" y=\"392\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#7a6a3c\">정책 배포 · 사용통계 · 장애현황<\/text>\n              <path d=\"M420 336 V352\" stroke=\"#1f9d55\" stroke-width=\"2\" marker-end=\"url(#nasArr)\"/>\n              <path d=\"M640 336 V352\" stroke=\"#d97b06\" stroke-width=\"2\" marker-end=\"url(#nasArr)\"/>\n            <\/g>\n          <\/svg>\n          <div class=\"cap\"><b>구조 해석<\/b> — 시민 접점은 공개망에서 동작하지만, 원문 민원·개인정보·업무자료·AI 근거문서는 청내망 Smart-NAS에 머뭅니다. AI 결과가 시민에게 나가기 전에는 권한, 공개범위, 마스킹, 감사 로그를 통과합니다.<\/div>\n        <\/div>\n        <div class=\"nas-diagram\">\n          <div class=\"nas-node\">\n            <div class=\"code\">CITY CONTROL<\/div>\n            <h5>청내 중앙관리시스템<\/h5>\n            <p>학교형 Smart-NAS의 교육청 중앙관리 기능을 청내 운영센터로 치환합니다.<\/p>\n            <ul class=\"nas-list\">\n              <li>부서별 장비 상태·저장공간·접속현황 모니터링<\/li>\n              <li>AI 사용정책, 금칙어, 보안정책, 권한정책 일괄 배포<\/li>\n              <li>패치·업데이트·백업정책·장애/유지보수 현황 관리<\/li>\n              <li>민원 AI 사용량, 질의 이력, 처리 리포트 확인<\/li>\n            <\/ul>\n          <\/div>\n          <div class=\"nas-node core\">\n            <div class=\"code\">SMART-NAS + AI CORE<\/div>\n            <h5>청내망 AI 지식저장소<\/h5>\n            <p>NAS는 단순 저장장치가 아니라 민원 업무 지식, 권한, 감사, AI 추론을 연결하는 내부 AI 인프라 노드입니다.<\/p>\n            <ul class=\"nas-list\">\n              <li>조례·규칙, 업무분장표, 매뉴얼, FAQ, 서식, 과거 답변, GIS, 콜센터 STT 저장<\/li>\n              <li>문서 색인·벡터DB·RAG 검색·요약·답변 초안·배정 추천<\/li>\n              <li>내부자료/시민 공개자료/개인정보 영역 분리<\/li>\n              <li>접속 로그, 파일 열람 로그, AI 질의 로그, 관리자 변경 이력 보존<\/li>\n            <\/ul>\n          <\/div>\n          <div class=\"nas-node\">\n            <div class=\"code\">PUBLIC WEB<\/div>\n            <h5>○○시 민원 웹 공개 영역<\/h5>\n            <p>시민은 별도 앱 설치 없이 웹으로 접수·조회하고, 공개 승인된 정보만 확인합니다.<\/p>\n            <ul class=\"nas-list\">\n              <li>AI 즉시 안내, 민원 접수, 나의 민원 조회, 보완자료 제출<\/li>\n              <li>담당 부서, 예상 완료일, 처리 단계 트래커 제공<\/li>\n              <li>상태 변경은 문자(SMS)로 발송<\/li>\n              <li>내부 검토 메모, 담당자 개인정보, 비공개 문서는 차단<\/li>\n            <\/ul>\n          <\/div>\n        <\/div>\n        <div class=\"nas-arrow\" aria-label=\"온프레미스 AI 처리 흐름\">\n          <div class=\"nas-flow\"><b>01 수집<\/b><span>기존 민원문서·FAQ·업무분장·법령·과거 답변 적재<\/span><\/div>\n          <div class=\"nas-flow\"><b>02 승인<\/b><span>부서 담당자가 공개/내부/민감자료 등급 지정<\/span><\/div>\n          <div class=\"nas-flow\"><b>03 색인<\/b><span>문서 파싱·마스킹·벡터화·RAG 지식베이스 구성<\/span><\/div>\n          <div class=\"nas-flow\"><b>04 추론<\/b><span>AI가 권한 범위 안에서 요약·분류·초안·추천 수행<\/span><\/div>\n          <div class=\"nas-flow\"><b>05 감사<\/b><span>질의·근거문서·답변·승인 이력을 로그로 보존<\/span><\/div>\n        <\/div>\n        <div class=\"nas-controls\">\n          <div class=\"nas-control\"><b>온프레미스<\/b><span>민원 원문과 개인정보는 청내망에 보관<\/span><\/div>\n          <div class=\"nas-control\"><b>자료 분리<\/b><span>내부자료·공개자료·개인정보·감사자료 영역 분리<\/span><\/div>\n          <div class=\"nas-control\"><b>권한관리<\/b><span>부서·직급·업무별 접근권한과 공개범위 제어<\/span><\/div>\n          <div class=\"nas-control\"><b>AI 사용통제<\/b><span>금칙어, 개인정보 입력 제한, 금지응답 정책 적용<\/span><\/div>\n          <div class=\"nas-control\"><b>로그·감사<\/b><span>접속, 파일열람, AI 질의, 답변생성 이력 추적<\/span><\/div>\n          <div class=\"nas-control\"><b>백업·복구<\/b><span>자동 백업, 버전관리, 장애 발생 시 복구 지원<\/span><\/div>\n        <\/div>\n        <div class=\"nas-note\"><b>적용 원칙<\/b> — Smart-NAS는 민원 데이터를 클라우드로 올리는 방식이 아니라,\n        청내에 AI가 읽을 수 있는 승인 지식 저장소를 만들고, 시민에게는 검증된 답변과 진행상황만 웹·문자 채널로 제공하는 구조입니다.<\/div>\n      <\/div>\n    <\/div>\n\n    <h3>처리 삼단 분기 — AI 자동화의 책임 경계<\/h3>\n    <div class=\"tbl-outer tbl-wrap\">\n    <table>\n      <thead><tr><th style=\"width:20%\">분기<\/th><th style=\"width:34%\">대상<\/th><th>처리 방식<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td><b>① 즉시 종결형<\/b><\/td><td>FAQ, 절차·구비서류 안내, 서식 제공, 예약·일정 안내, 상태 조회, 단순 생활불편 신고 접수 확인<\/td><td>AI가 24시간 즉시 답변·종결합니다. 만족도 수집 후 미해결 시 원클릭으로 정식 접수 전환합니다.<\/td><\/tr>\n        <tr><td><b>② AI 보조 배정형<\/b><\/td><td>생활불편·복합 민원 일반<\/td><td>AI 요약 카드와 부서 추천을 담당자가 승인합니다. 이후 제로터치 상태 동기화로 처리 과정이 자동 공개됩니다.<\/td><\/tr>\n        <tr><td><b>③ 전문가 즉시 이관형<\/b><\/td><td>고충·분쟁, 법령해석·재량 판단, 인허가·보상·과태료·행정처분, 안전·위험 긴급, 개인정보 민감, 악성·특이민원<\/td><td><b>AI 자동 종결 금지.<\/b> 분류·요약·플래그만 수행하고 담당자/총괄부서로 즉시 이관합니다. 악성민원은 증적 보존과 보호 절차를 연동합니다.<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    <\/div>\n\n    <h3>민원인 여정 — 접수부터 완료까지<\/h3>\n    <div class=\"flow-panel\">\n      <div class=\"f-title\">민원 처리 프로세스 플로우 (민원인 관점)<\/div>\n      <div class=\"f-sub\">단순 민원은 수 초 내 종결, 복합 민원은 자동 배정 후 전 과정이 트래커에 실시간 반영됩니다.<\/div>\n      <svg viewBox=\"0 0 920 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"민원인 프로세스 플로우 다이어그램\">\n        <defs><marker id=\"fa\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6.5\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#5b6478\"/><\/marker><\/defs>\n        <\!-- row 1 -->\n        <rect x=\"14\" y=\"60\" width=\"150\" height=\"66\" rx=\"12\" fill=\"#e8effd\" stroke=\"#bcd0f7\"/>\n        <text x=\"89\" y=\"88\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#16203a\" font-family=\"Pretendard,sans-serif\">자연어 접수<\/text>\n        <text x=\"89\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6478\" font-family=\"Pretendard,sans-serif\">웹·문자·콜봇<\/text>\n        <rect x=\"214\" y=\"60\" width=\"160\" height=\"66\" rx=\"12\" fill=\"#16203a\"/>\n        <text x=\"294\" y=\"88\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"Pretendard,sans-serif\">AI 의도 분석<\/text>\n        <text x=\"294\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" fill=\"#9aa6c8\" font-family=\"Pretendard,sans-serif\">유형·위치·긴급도·감정<\/text>\n        <path d=\"M164 93 H210\" stroke=\"#5b6478\" stroke-width=\"2\" marker-end=\"url(#fa)\"/>\n        <\!-- decision -->\n        <polygon points=\"470,58 560,93 470,128 380,93\" fill=\"#fbf7ec\" stroke=\"#b8902a\" stroke-width=\"1.5\"/>\n        <text x=\"470\" y=\"89\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#16203a\" font-family=\"Pretendard,sans-serif\">단순 안내형?<\/text>\n        <text x=\"470\" y=\"106\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5b6478\" font-family=\"Pretendard,sans-serif\">FAQ·절차·서류·조회<\/text>\n        <path d=\"M374 93 H378\" stroke=\"#5b6478\" stroke-width=\"2\" marker-end=\"url(#fa)\"/>\n        <\!-- yes: instant -->\n        <rect x=\"620\" y=\"24\" width=\"170\" height=\"60\" rx=\"12\" fill=\"#e9f6ee\" stroke=\"#9bd8b4\"/>\n        <text x=\"705\" y=\"49\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1f9d55\" font-family=\"Pretendard,sans-serif\">즉시 답변·종결<\/text>\n        <text x=\"705\" y=\"68\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#4a7a5d\" font-family=\"Pretendard,sans-serif\">24시간 · 약 15% 물량 흡수<\/text>\n        <path d=\"M545 78 C580 60 590 54 616 54\" stroke=\"#1f9d55\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#fa)\"/>\n        <text x=\"586\" y=\"46\" font-size=\"11\" font-weight=\"700\" fill=\"#1f9d55\" font-family=\"Pretendard,sans-serif\">YES<\/text>\n        <\!-- unsolved loop -->\n        <path d=\"M705 88 C705 108 660 112 620 112\" stroke=\"#9aa3ba\" stroke-width=\"1.6\" stroke-dasharray=\"4 4\" fill=\"none\" marker-end=\"url(#fa)\"/>\n        <text x=\"712\" y=\"108\" font-size=\"10\" fill=\"#5b6478\" font-family=\"Pretendard,sans-serif\">미해결 시 원클릭 정식 접수<\/text>\n        <\!-- no: routing -->\n        <rect x=\"380\" y=\"170\" width=\"180\" height=\"66\" rx=\"12\" fill=\"#16203a\"/>\n        <text x=\"470\" y=\"196\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#fff\" font-family=\"Pretendard,sans-serif\">스마트 라우팅<\/text>\n        <text x=\"470\" y=\"216\" text-anchor=\"middle\" font-size=\"11\" fill=\"#9aa6c8\" font-family=\"Pretendard,sans-serif\">요약 카드 + 부서 자동 배정<\/text>\n        <path d=\"M470 128 V166\" stroke=\"#5b6478\" stroke-width=\"2\" marker-end=\"url(#fa)\"/>\n        <text x=\"486\" y=\"152\" font-size=\"11\" font-weight=\"700\" fill=\"#d5453c\" font-family=\"Pretendard,sans-serif\">NO · 복합/고충<\/text>\n        <\!-- special filter branch -->\n        <rect x=\"120\" y=\"170\" width=\"180\" height=\"66\" rx=\"12\" fill=\"#fdeceb\" stroke=\"#eeb3af\"/>\n        <text x=\"210\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#d5453c\" font-family=\"Pretendard,sans-serif\">악성·특이민원 필터<\/text>\n        <text x=\"210\" y=\"216\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a5a56\" font-family=\"Pretendard,sans-serif\">증적 보존 → 보호 절차 이관<\/text>\n        <path d=\"M380 203 H304\" stroke=\"#d5453c\" stroke-width=\"1.8\" stroke-dasharray=\"5 4\" marker-end=\"url(#fa)\"/>\n        <\!-- dept work -->\n        <rect x=\"620\" y=\"170\" width=\"170\" height=\"66\" rx=\"12\" fill=\"#f4ecd8\" stroke=\"#e2cf9d\"/>\n        <text x=\"705\" y=\"196\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#16203a\" font-family=\"Pretendard,sans-serif\">담당 부서 처리<\/text>\n        <text x=\"705\" y=\"216\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a6a3c\" font-family=\"Pretendard,sans-serif\">AI 답변 초안 + 기한 관리<\/text>\n        <path d=\"M560 203 H616\" stroke=\"#5b6478\" stroke-width=\"2\" marker-end=\"url(#fa)\"/>\n        <\!-- tracker band -->\n        <rect x=\"120\" y=\"272\" width=\"670\" height=\"44\" rx=\"10\" fill=\"#2f6fed\"/>\n        <text x=\"455\" y=\"299\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\" font-family=\"Pretendard,sans-serif\">진행상황 트래커 — 접수 · 배정 · 처리 · 완료가 실시간 자동 반영 + 단계별 문자(SMS)<\/text>\n        <path d=\"M470 236 V268\" stroke=\"#2f6fed\" stroke-width=\"2\" marker-end=\"url(#fa)\"/>\n        <path d=\"M705 236 V268\" stroke=\"#2f6fed\" stroke-width=\"2\" marker-end=\"url(#fa)\"/>\n        <path d=\"M294 126 C294 150 294 240 260 272\" stroke=\"#2f6fed\" stroke-width=\"1.6\" stroke-dasharray=\"4 4\" fill=\"none\" marker-end=\"url(#fa)\"/>\n      <\/svg>\n      <div class=\"legend\">\n        <span><i style=\"background:#e8effd;border:1px solid #bcd0f7\"><\/i>민원인 접점<\/span>\n        <span><i style=\"background:#16203a\"><\/i>AI 자동 처리<\/span>\n        <span><i style=\"background:#f4ecd8;border:1px solid #e2cf9d\"><\/i>담당자 업무<\/span>\n        <span><i style=\"background:#fdeceb;border:1px solid #eeb3af\"><\/i>보호·필터 경로<\/span>\n        <span><i style=\"background:#2f6fed\"><\/i>시각화 계층<\/span>\n      <\/div>\n    <\/div>\n\n    <h3>담당자 업무 — Before / After<\/h3>\n    <div class=\"flow-panel\">\n      <div class=\"f-title\">담당자 처리 프로세스 변화<\/div>\n      <div class=\"f-sub\">회색(AS-IS)에서 사람이 수행하던 단계가, 골드(TO-BE)에서는 AI로 이관되거나 자동화됩니다.<\/div>\n      <svg viewBox=\"0 0 920 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"담당자 업무 Before After 비교 다이어그램\">\n        <defs><marker id=\"fa2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6.5\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#9aa3ba\"/><\/marker><\/defs>\n        <text x=\"14\" y=\"30\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"2\" fill=\"#9aa3ba\" font-family=\"'JetBrains Mono',monospace\">AS-IS<\/text>\n        <g font-family=\"Pretendard,sans-serif\">\n          <rect x=\"14\" y=\"44\" width=\"128\" height=\"52\" rx=\"10\" fill=\"#eceae3\" stroke=\"#d5d0c2\"/><text x=\"78\" y=\"66\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#5b6478\">전문 정독<\/text><text x=\"78\" y=\"84\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a8f9e\">폭언 원문 직접 노출<\/text>\n          <rect x=\"172\" y=\"44\" width=\"128\" height=\"52\" rx=\"10\" fill=\"#eceae3\" stroke=\"#d5d0c2\"/><text x=\"236\" y=\"66\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#5b6478\">소관 판단·배정<\/text><text x=\"236\" y=\"84\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a8f9e\">경험 의존 · 핑퐁 이관<\/text>\n          <rect x=\"330\" y=\"44\" width=\"128\" height=\"52\" rx=\"10\" fill=\"#eceae3\" stroke=\"#d5d0c2\"/><text x=\"394\" y=\"66\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#5b6478\">백지 답변 작성<\/text><text x=\"394\" y=\"84\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a8f9e\">법령·사례 직접 검색<\/text>\n          <rect x=\"488\" y=\"44\" width=\"128\" height=\"52\" rx=\"10\" fill=\"#eceae3\" stroke=\"#d5d0c2\"/><text x=\"552\" y=\"66\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#5b6478\">진행 문의 응대<\/text><text x=\"552\" y=\"84\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a8f9e\">확인 전화에 업무 중단<\/text>\n          <rect x=\"646\" y=\"44\" width=\"128\" height=\"52\" rx=\"10\" fill=\"#eceae3\" stroke=\"#d5d0c2\"/><text x=\"710\" y=\"66\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#5b6478\">상태 수기 입력<\/text><text x=\"710\" y=\"84\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a8f9e\">별도 정리 업무<\/text>\n          <path d=\"M142 70 H168\" stroke=\"#9aa3ba\" stroke-width=\"1.8\" marker-end=\"url(#fa2)\"/><path d=\"M300 70 H326\" stroke=\"#9aa3ba\" stroke-width=\"1.8\" marker-end=\"url(#fa2)\"/><path d=\"M458 70 H484\" stroke=\"#9aa3ba\" stroke-width=\"1.8\" marker-end=\"url(#fa2)\"/><path d=\"M616 70 H642\" stroke=\"#9aa3ba\" stroke-width=\"1.8\" marker-end=\"url(#fa2)\"/>\n        <\/g>\n        <text x=\"14\" y=\"150\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"2\" fill=\"#b8902a\" font-family=\"'JetBrains Mono',monospace\">TO-BE<\/text>\n        <g font-family=\"Pretendard,sans-serif\">\n          <rect x=\"14\" y=\"164\" width=\"128\" height=\"56\" rx=\"10\" fill=\"#16203a\"/><text x=\"78\" y=\"186\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#ffd98a\">AI 요약 카드<\/text><text x=\"78\" y=\"205\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#9aa6c8\">폭언은 경고태그·순화본<\/text>\n          <rect x=\"172\" y=\"164\" width=\"128\" height=\"56\" rx=\"10\" fill=\"#16203a\"/><text x=\"236\" y=\"186\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#ffd98a\">배정 승인만<\/text><text x=\"236\" y=\"205\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#9aa6c8\">추천+신뢰도 검증<\/text>\n          <rect x=\"330\" y=\"164\" width=\"128\" height=\"56\" rx=\"10\" fill=\"#f4ecd8\" stroke=\"#e2cf9d\"/><text x=\"394\" y=\"186\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#16203a\">초안 검토·확정<\/text><text x=\"394\" y=\"205\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#7a6a3c\">RAG 초안 → 판단에 집중<\/text>\n          <rect x=\"488\" y=\"164\" width=\"128\" height=\"56\" rx=\"10\" fill=\"#16203a\"/><text x=\"552\" y=\"186\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#ffd98a\">문의 응대 소멸<\/text><text x=\"552\" y=\"205\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#9aa6c8\">트래커가 대체<\/text>\n          <rect x=\"646\" y=\"164\" width=\"128\" height=\"56\" rx=\"10\" fill=\"#16203a\"/><text x=\"710\" y=\"186\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#ffd98a\">입력 제로<\/text><text x=\"710\" y=\"205\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#9aa6c8\">제로터치 자동 동기화<\/text>\n          <path d=\"M142 192 H168\" stroke=\"#b8902a\" stroke-width=\"1.8\" marker-end=\"url(#fa2)\"/><path d=\"M300 192 H326\" stroke=\"#b8902a\" stroke-width=\"1.8\" marker-end=\"url(#fa2)\"/><path d=\"M458 192 H484\" stroke=\"#b8902a\" stroke-width=\"1.8\" marker-end=\"url(#fa2)\"/><path d=\"M616 192 H642\" stroke=\"#b8902a\" stroke-width=\"1.8\" marker-end=\"url(#fa2)\"/>\n        <\/g>\n        <g font-family=\"Pretendard,sans-serif\">\n          <rect x=\"800\" y=\"44\" width=\"106\" height=\"52\" rx=\"10\" fill=\"#fdeceb\" stroke=\"#eeb3af\"/><text x=\"853\" y=\"70\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#d5453c\">감정노동<\/text><text x=\"853\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a5a56\">스트레스 90.8%<\/text>\n          <rect x=\"800\" y=\"164\" width=\"106\" height=\"56\" rx=\"10\" fill=\"#e9f6ee\" stroke=\"#9bd8b4\"/><text x=\"853\" y=\"188\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1f9d55\">판단 업무로<\/text><text x=\"853\" y=\"206\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1f9d55\">역량 회수<\/text>\n        <\/g>\n      <\/svg>\n    <\/div>\n\n    <h3>핵심 차별점 — 제로터치 상태 동기화<\/h3>\n    <p class=\"sec-lede\">\"진행상황 공개\"가 담당자의 <b>또 하나의 입력 업무<\/b>가 되는 순간 시스템은 형해화됩니다.\n    본 시스템은 반대로 — 담당자는 평소처럼 일만 하고, AI가 업무 행위에서 상태를 추출해 시민 언어로 번역합니다.<\/p>\n    <div class=\"zt\">\n      <div class=\"zt-col left\">\n        <h5>담당자의 일상 업무 행위 <span style=\"font-weight:400;color:var(--sub);font-size:12px\">(별도 입력 없음)<\/span><\/h5>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>배정 민원 열람<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>현장 확인 일정 등록 · 출장 결재 상신<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>타 부서 협조전 발송<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>답변 초안 작성 시작<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>결재 완료<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>보완자료 요청 발송<\/div>\n      <\/div>\n      <div class=\"zt-mid\"><span class=\"ai\">AI 상태 추출 · 시민 언어 번역 · 공개범위 필터<\/span>\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 12h14M13 6l6 6-6 6\" stroke=\"#d9b45c\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n      <\/div>\n      <div class=\"zt-col right\">\n        <h5>민원인 트래커에 자동 표시<\/h5>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>\"담당자가 검토를 시작했습니다\"<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>\"현장 확인 중 (7/10 예정)\"<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>\"관련 부서와 협의 중\"<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>\"답변 검토 중\"<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>\"답변 완료 — 처리기간 6일\"<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>\"추가 자료가 필요합니다\" + 알림 발송<\/div>\n        <p class=\"zt-cap\">내부 검토 내용·담당자 개인정보는 공개범위 필터로 차단, 행정 용어는 시민 언어로 자동 변환됩니다.<\/p>\n      <\/div>\n    <\/div>\n\n    <h3>운영 4대 원칙 — 모든 기능이 지켜야 할 제약<\/h3>\n    <p class=\"sec-lede\">아래 네 가지는 기능 명세가 아니라 <b>기능이 지켜야 할 제약<\/b>입니다.\n    이후 PART 05의 처리 로직, PART 06의 보호 프로세스, PART 11의 발주 요구사항이 모두 이 원칙에서 파생됩니다.<\/p>\n    <div class=\"shield-steps\">\n      <div class=\"sstep l1\"><div class=\"no\">1<\/div><b>AI 1차 + 사람 최종<\/b><p>AI가 먼저 받되 처분성·재량 판단은 반드시 담당부서 검토를 거칩니다. AI는 최종 답변자가 아니라 초안 작성자·분류 보조자입니다.<\/p><span class=\"layer\">PRINCIPLE · 책임<\/span><\/div>\n      <div class=\"sstep l2\"><div class=\"no\">2<\/div><b>근거 기반 답변<\/b><p>조례·민원편람·고시·공지 등 공식 문서에서 근거를 찾아 답하고, 출처와 문서 최종수정일을 답변에 함께 표기합니다.<\/p><span class=\"layer\">PRINCIPLE · 신뢰<\/span><\/div>\n      <div class=\"sstep l3\"><div class=\"no\">3<\/div><b>모르면 넘긴다<\/b><p>근거가 없거나 신뢰도가 임계값에 못 미치면 임의로 답하지 않고 안전하게 이관합니다. 그럴듯한 답변보다 정확한 이관이 낫습니다.<\/p><span class=\"layer\">PRINCIPLE · 안전<\/span><\/div>\n      <div class=\"sstep l4\"><div class=\"no\">4<\/div><b>개인정보·보안 통제<\/b><p>민감정보 마스킹, 접근권한 차등, 로그 분리 저장, 외부 LLM 계약 조건(미저장·미학습·국외이전)을 기획 단계에 못박습니다.<\/p><span class=\"layer\">PRINCIPLE · 보호<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ═══════════════ PART 05 구축 아키텍처 및 처리 로직 ═══════════════ -->\n<section id=\"p5\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">PART 05 · 구축 아키텍처 및 처리 로직<\/div>\n    <h2>대화만 잘하는 챗봇이 아니라,<br>대화 이후의 행정 흐름까지 잇는 엔진<\/h2>\n    <p class=\"sec-lede\">이 장은 \"무엇을 만드는가\"가 아니라 <b>\"어떤 순서로 어떻게 동작하는가\"<\/b>를 정의합니다.\n    민원 한 건의 생애주기 → 시나리오별 자동화 경계 → 4계층 아키텍처 → RAG 파이프라인 → 지식베이스 정비 → 시스템 연계 → 보안 통제 순으로,\n    발주 시 그대로 요구사항이 되는 수준까지 내려갑니다.<\/p>\n\n    <h3>민원 생애주기 — 8단계<\/h3>\n    <p class=\"sec-lede\">유입부터 종결까지, 어디까지가 AI 자동 처리이고 어디가 사람 전환 분기인지를 단계로 못박습니다.<\/p>\n    <div class=\"shield-steps\">\n      <div class=\"sstep man\"><div class=\"no\">1<\/div><b>유입<\/b><p>웹·모바일·메신저·전화 콜봇·키오스크의 모든 접점을 단일 큐로 수집.<\/p><span class=\"layer\">CHANNEL<\/span><\/div>\n      <div class=\"sstep ai\"><div class=\"no\">2<\/div><b>개인정보 탐지<\/b><p>주민번호·계좌·건강정보 등 민감정보를 입력 시점에 탐지하고 1차 마스킹.<\/p><span class=\"layer\">AI 자동<\/span><\/div>\n      <div class=\"sstep ai\"><div class=\"no\">3<\/div><b>의도·유형 분류<\/b><p>1·2차 카테고리, 긴급도, 감정 상태, 지역을 구조화된 속성으로 추출.<\/p><span class=\"layer\">AI 자동<\/span><\/div>\n      <div class=\"sstep ai\"><div class=\"no\">4<\/div><b>근거 검색 (RAG)<\/b><p>민원편람·조례·FAQ·업무분장에서 관련 근거를 벡터 검색으로 확보.<\/p><span class=\"layer\">AI 자동<\/span><\/div>\n      <div class=\"sstep ai\"><div class=\"no\">5<\/div><b>답변 / 접수 생성<\/b><p>근거 범위 안에서 답변 초안 또는 접수 정보를 생성하고 출처를 부착.<\/p><span class=\"layer\">AI 자동<\/span><\/div>\n      <div class=\"sstep gate\"><div class=\"no\">6<\/div><b>신뢰도 판단<\/b><p>근거 일치도·위험 유형·감정 상태에 따라 자동 응답과 사람 전환을 분기.<\/p><span class=\"layer\">GATE · 분기<\/span><\/div>\n      <div class=\"sstep man\"><div class=\"no\">7<\/div><b>처리 · 이관<\/b><p>접수번호 발급, 담당부서 배정, 기존 민원시스템 이관, 담당자 처리.<\/p><span class=\"layer\">행정 처리<\/span><\/div>\n      <div class=\"sstep man\"><div class=\"no\">8<\/div><b>알림 · 종결<\/b><p>단계 변경 시 자동 알림, 처리 로그와 피드백을 사후학습 계층에 적재.<\/p><span class=\"layer\">행정 처리<\/span><\/div>\n    <\/div>\n    <p class=\"proto-cap\">2~5단계가 AI 자동 구간, <b>6단계가 유일한 분기점<\/b>, 7~8단계가 행정 처리 구간입니다.\n    자동화 범위를 넓히는 논의는 항상 6단계의 임계값 조정 문제로 귀결되며, 그 값은 운영 데이터로만 조정합니다.<\/p>\n\n    <h3>3대 시나리오 — 자동화와 사람 전환의 경계<\/h3>\n    <div class=\"scens\">\n      <div class=\"scen a\">\n        <div class=\"sc-head\"><b>단순 문의<\/b><span>완전 자동<\/span><\/div>\n        <div class=\"sc-flow\">\n          <span class=\"s\">질문 입력<\/span><span class=\"ar\">↓<\/span>\n          <span class=\"s\">RAG 근거 검색<\/span><span class=\"ar\">↓<\/span>\n          <span class=\"s\">답변 + 출처 + 신청링크<\/span><span class=\"ar\">↓<\/span>\n          <span class=\"s end\">즉시 종결 · 피드백 수집<\/span>\n        <\/div>\n        <p class=\"sc-note\">\"대형폐기물 스티커는 어디서 사나요?\" — 절차·수수료·링크·담당부서를 한 번에. 담당자 개입 0건.<\/p>\n      <\/div>\n      <div class=\"scen b\">\n        <div class=\"sc-head\"><b>신고 접수<\/b><span>접수 자동 · 처리 사람<\/span><\/div>\n        <div class=\"sc-flow\">\n          <span class=\"s\">신고 입력<\/span><span class=\"ar\">↓<\/span>\n          <span class=\"s\">위치·사진·유형 보완<\/span><span class=\"ar\">↓<\/span>\n          <span class=\"s\">부서 자동추천 + 접수번호<\/span><span class=\"ar\">↓<\/span>\n          <span class=\"s\">기존 민원시스템 이관<\/span><span class=\"ar\">↓<\/span>\n          <span class=\"s hand\">담당자 현장 처리 · 알림<\/span>\n        <\/div>\n        <p class=\"sc-note\">\"가로등이 고장 났어요\" — AI가 접수·분류·이관까지, 실제 조치는 담당부서. 진행 단계는 트래커로 자동 노출.<\/p>\n      <\/div>\n      <div class=\"scen c\">\n        <div class=\"sc-head\"><b>복합 민원<\/b><span>안내만 · 즉시 전환<\/span><\/div>\n        <div class=\"sc-flow\">\n          <span class=\"s\">질문 입력<\/span><span class=\"ar\">↓<\/span>\n          <span class=\"s\">재량·처분성 판단 감지<\/span><span class=\"ar\">↓<\/span>\n          <span class=\"s\">일반 절차·담당부서 안내<\/span><span class=\"ar\">↓<\/span>\n          <span class=\"s hand\">확정성 답변 보류<\/span><span class=\"ar\">↓<\/span>\n          <span class=\"s tr\">사람 상담 전환 · 콜백<\/span>\n        <\/div>\n        <p class=\"sc-note\">\"공사 피해를 보상받을 수 있나요?\" — 그럴듯한 답변보다 안전한 이관을 우선합니다.<\/p>\n      <\/div>\n    <\/div>\n\n    <h3>자동분류 · 부서추천 의사결정 흐름<\/h3>\n    <div class=\"decflow\">\n      <div class=\"dfnode start\">민원 문장 입력<s>오탈자 · 구어체 · 복합 의도 포함<\/s><\/div>\n      <div class=\"dfarrow\">→<\/div>\n      <div class=\"dfstack\">\n        <div class=\"dfnode ai\">의미 임베딩<s>키워드 매칭이 아닌 문맥 이해<\/s><\/div>\n        <div class=\"dfnode ai\">다차원 속성 분류<s>유형 · 긴급도 · 감정 · 지역<\/s><\/div>\n      <\/div>\n      <div class=\"dfarrow\">→<\/div>\n      <div class=\"dfnode score\">부서 추천 점수화<s>업무분장 + 과거이력 + 위치 + 키워드 + 조례근거<\/s><\/div>\n      <div class=\"dfarrow\">→<\/div>\n      <div class=\"dfgate\">신뢰도 ≥ 임계값?<\/div>\n      <div class=\"dfbranch\">\n        <div class=\"dfyes\">예 → 추천부서 + 추천 사유 제시 → 담당자 확정<\/div>\n        <div class=\"dfno\">아니오 → 후보 부서 2~3개 + 사람 검토 요청<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"callout\">\n      <div class=\"mark\">\"<\/div>\n      <p><b>설계 포인트<\/b> — AI는 부서명을 \"맞히는\" 데서 그치지 않고 <b>왜 그 부서인지<\/b>를 함께 제시합니다.\n      \"도로 유지보수는 건설과 도로관리팀\", \"유사 민원 83%가 환경과에서 처리\". 추천 사유가 보여야 담당자가 신뢰하고,\n      틀렸을 때 반려가 곧 학습 데이터가 됩니다. 사유 없는 추천은 결국 쓰이지 않습니다.<\/p>\n    <\/div>\n\n    <h3>시스템 아키텍처 — 4계층<\/h3>\n    <p class=\"sec-lede\">PART 04의 흐름 아키텍처가 \"민원이 어디로 가는가\"를 보여준다면, 이 계층 구조는 <b>\"각 기능이 어디에 속하는가\"<\/b>를 정의합니다. 발주 시 구현 범위를 계층 단위로 끊어 명시할 수 있습니다.<\/p>\n    <div class=\"arch\">\n      <div class=\"alayer\" data-l=\"채널 계층 · CHANNEL\">\n        <span class=\"acomp\">홈페이지 위젯<\/span><span class=\"acomp\">모바일 웹<\/span><span class=\"acomp\">메신저·문자<\/span><span class=\"acomp\">AI 콜봇(음성)<\/span><span class=\"acomp\">민원실 키오스크<\/span>\n        <div class=\"arole\">시민 접점 — 자연어 입력 수집, 응답·버튼·음성 출력<\/div>\n      <\/div>\n      <div class=\"aflow\">▼ 질의 / 음성 STT<\/div>\n      <div class=\"alayer gold\" data-l=\"이해·검색 계층 · NLU + RAG\">\n        <span class=\"acomp\">개인정보 탐지·마스킹<\/span><span class=\"acomp\">의도분석·엔터티 추출<\/span><span class=\"acomp\">민원 유형 분류기<\/span><span class=\"acomp\">임베딩·벡터검색<\/span><span class=\"acomp\">리랭킹<\/span><span class=\"acomp\">LLM 답변생성<\/span>\n        <div class=\"arole\">질문 해석 + 공식 문서 근거 검색 + 출처 포함 답변 생성<\/div>\n      <\/div>\n      <div class=\"aflow\">▼ 구조화된 의도 / 근거 / 신뢰도<\/div>\n      <div class=\"alayer blue\" data-l=\"업무처리 계층 · WORKFLOW\">\n        <span class=\"acomp\">민원 접수·번호생성<\/span><span class=\"acomp\">부서 자동분류<\/span><span class=\"acomp\">기존 민원시스템 연계<\/span><span class=\"acomp\">RPA 자동화<\/span><span class=\"acomp\">알림톡·문자<\/span><span class=\"acomp\">전자결재 연계<\/span>\n        <div class=\"arole\">실제 행정 처리 연결 — 접수·배정·이관·알림·승인 · 제로터치 동기화의 이벤트 소스<\/div>\n      <\/div>\n      <div class=\"aflow\">▼ 로그 / 피드백 / 처리결과<\/div>\n      <div class=\"alayer green\" data-l=\"사후학습 계층 · LEARNING\">\n        <span class=\"acomp\">대화·오답 로그 분석<\/span><span class=\"acomp\">현업 피드백 반영<\/span><span class=\"acomp\">지식베이스 갱신<\/span><span class=\"acomp\">KPI·품질 모니터링<\/span><span class=\"acomp\">유사민원 군집·토픽분석<\/span>\n        <div class=\"arole\">품질 개선 루프 — 정답셋·근거문서 최신화, 분류 룰·임계값 조정<\/div>\n      <\/div>\n    <\/div>\n\n    <h3>RAG 응답 파이프라인 — 10단계<\/h3>\n    <p class=\"sec-lede\">범용 LLM에 질문을 그대로 던지지 않습니다. 공식 문서 검색 결과에 답변을 그라운딩해 환각을 줄이고, 근거를 인용하며,\n    <b>근거가 없으면 \"모른다\"고 말하게<\/b> 합니다. PART 03의 실패 사례를 피하는 핵심 장치입니다.<\/p>\n    <div class=\"steps5\">\n      <div class=\"sstep ai\"><div class=\"no\">01<\/div><b>질의 정규화<\/b><p>오탈자 교정·약어 확장·의도 명세화. 필요 시 가상답변 임베딩으로 검색 정확도 보정.<\/p><\/div>\n      <div class=\"sstep gate\"><div class=\"no\">02<\/div><b>안전 필터<\/b><p>주민번호·계좌·건강정보 탐지 시 입력 차단·마스킹. 악의적 프롬프트 인젝션 탐지.<\/p><\/div>\n      <div class=\"sstep ai\"><div class=\"no\">03<\/div><b>라우팅<\/b><p>의미 기반 1차 + LLM 2차 라우팅으로 FAQ·문서검색·신고접수·상담전환 경로 결정.<\/p><\/div>\n      <div class=\"sstep ai\"><div class=\"no\">04<\/div><b>벡터 검색<\/b><p>질의 임베딩으로 상위 K개 후보 검색 + 메타데이터 필터(지역·부서·유효기간).<\/p><\/div>\n      <div class=\"sstep ai\"><div class=\"no\">05<\/div><b>리랭킹<\/b><p>교차 인코더 재정렬로 상위 근거 정밀 선별. 최신순·공식문서 우선 가중.<\/p><\/div>\n      <div class=\"sstep ai\"><div class=\"no\">06<\/div><b>증강 생성<\/b><p>\"근거 안에서만 답하라 + 출처 인용 강제\" 시스템 프롬프트로 답변 초안 생성.<\/p><\/div>\n      <div class=\"sstep gate\"><div class=\"no\">07<\/div><b>충실도 검증<\/b><p>생성 답변이 검색 근거와 일치하는지 점수화. 근거 밖 문장은 자동 제거.<\/p><\/div>\n      <div class=\"sstep gate\"><div class=\"no\">08<\/div><b>신뢰도 분기<\/b><p>임계값 미달·근거 부재·고위험 유형은 임의 답변 금지, 사람 상담 전환.<\/p><\/div>\n      <div class=\"sstep man\"><div class=\"no\">09<\/div><b>출처 표시<\/b><p>답변 하단에 조례·편람·공지 출처 + 담당부서 + 문서 최종수정일 표기.<\/p><\/div>\n      <div class=\"sstep man\"><div class=\"no\">10<\/div><b>로그 · 학습<\/b><p>질의·근거·응답·피드백 저장 후 사후학습 계층으로 환류. 개인정보는 비식별 분리.<\/p><\/div>\n    <\/div>\n\n    <h3>지식베이스 데이터 파이프라인<\/h3>\n    <p class=\"sec-lede\">성능은 모델보다 <b>데이터 정비 상태<\/b>에 좌우됩니다. PDF·한글 파일을 그대로 넣는 수준에서 멈추면 검색이 되지 않습니다.\n    검색 가능한 단위로 쪼개고 메타데이터를 부여하는 것까지가 구축 범위입니다.<\/p>\n    <div class=\"nas-arrow\">\n      <div class=\"nas-flow\"><b>01 수집<\/b><span>민원편람·조례·FAQ·과거답변·공지·업무분장·시설데이터<\/span><\/div>\n      <div class=\"nas-flow\"><b>02 정규화·비식별<\/b><span>표·머리말 정리, 개인정보 가명·익명 처리<\/span><\/div>\n      <div class=\"nas-flow\"><b>03 청킹<\/b><span>편람=사무 1건 / 조례=조·항 / FAQ=문답 1쌍 단위 분할<\/span><\/div>\n      <div class=\"nas-flow\"><b>04 메타데이터<\/b><span>부서·적용기간·지역·유형·법령·공개여부·보안등급·수정일<\/span><\/div>\n      <div class=\"nas-flow\"><b>05 임베딩·색인<\/b><span>한국어 임베딩 모델로 벡터 변환 후 유사도 인덱스 구성·정기 갱신<\/span><\/div>\n    <\/div>\n    <p class=\"proto-cap\">이 파이프라인의 산출물이 곧 PART 11의 <b>지식베이스 구축 명세<\/b>이며, 갱신율은 품질 KPI로 상시 관리됩니다.<\/p>\n\n    <h3>기존 행정시스템 연계와 자동화 우선순위<\/h3>\n    <div class=\"zt\">\n      <div class=\"zt-col left\">\n        <h5>연계 대상 시스템<\/h5>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span><b style=\"min-width:112px;display:inline-block\">민원접수 시스템<\/b>접수번호 생성 · 처리상태 조회<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span><b style=\"min-width:112px;display:inline-block\">행정정보·내부망<\/b>부서 배정 · 담당자 확인<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span><b style=\"min-width:112px;display:inline-block\">홈페이지 CMS<\/b>공지 · FAQ 자동 갱신<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span><b style=\"min-width:112px;display:inline-block\">문자·알림톡<\/b>접수 · 처리 · 보완 알림<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span><b style=\"min-width:112px;display:inline-block\">전자결재<\/b>답변 초안 검토 · 승인<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span><b style=\"min-width:112px;display:inline-block\">GIS · 주소<\/b>위치 기반 현장민원 분류<\/div>\n        <div class=\"zt-cap\">연계는 API를 원칙으로 하되, 불가한 구간은 RPA·파일 연계로 대체하고 예외 처리 기준을 함께 정의합니다.<\/div>\n      <\/div>\n      <div class=\"zt-mid\"><div class=\"ai\">AUTOMATION ORDER<\/div><\/div>\n      <div class=\"zt-col right\">\n        <h5>자동화 착수 우선순위<\/h5>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>1 · 유형 분류 · 부서 추천<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>2 · 반복 FAQ 자동응답<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>3 · 현장민원 접수 → 부서 이관<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>4 · 근거 기반 답변 초안 생성<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>5 · 유사민원 묶음 일괄 처리<\/div>\n        <div class=\"zt-row\"><span class=\"ic\"><\/span>6 · 주간 민원 동향 보고서 자동 생성<\/div>\n        <div class=\"zt-cap\">앞 순위일수록 효과가 크고 위험이 낮습니다. 순서를 뒤집으면 검증되지 않은 자동화가 먼저 노출됩니다.<\/div>\n      <\/div>\n    <\/div>\n\n    <h3>보안 · 개인정보 · 환각 통제<\/h3>\n    <p class=\"sec-lede\">개인정보보호위원회 「생성형 AI 개발·활용을 위한 개인정보 처리 안내서」(2025.8)는 학습데이터 복원, 개인정보 추론 생성,\n    프롬프트 인젝션을 신규 위험으로 지목하고, 외부 LLM 사용 시 <b>입출력값 미저장·자체학습 미활용·국외이전 여부<\/b>를 계약 단계에서 검토하도록 권고합니다.\n    아래 6개 통제는 그 기준을 구현 요건으로 옮긴 것입니다.<\/p>\n    <div class=\"cases\">\n      <div class=\"case\"><span class=\"tag kr\">수집 통제<\/span><h4>최소수집 · 민감정보 차단<\/h4><p>민원 처리에 필요한 정보만 입력받고, 주민번호·계좌·건강정보는 입력 시점에 자동 탐지·마스킹합니다.<\/p><\/div>\n      <div class=\"case\"><span class=\"tag kr\">저장 통제<\/span><h4>저장소 분리<\/h4><p>대화로그·접수정보·개인정보를 분리 저장하고, 학습용 데이터는 비식별 처리 후 별도 보관합니다.<\/p><\/div>\n      <div class=\"case\"><span class=\"tag kr\">접근 통제<\/span><h4>권한 차등 · 보존기간<\/h4><p>부서·역할별 조회 권한을 차등 부여하고, 보존기간과 파기 절차는 법정 기준을 준수합니다.<\/p><\/div>\n      <div class=\"case\"><span class=\"tag gov\">환각 통제<\/span><h4>근거 없는 답변 금지<\/h4><p>RAG 근거 기반 답변에 출처를 강제 표기하고, 신뢰도 미달 시 임의 답변을 차단해 상담으로 전환합니다.<\/p><\/div>\n      <div class=\"case\"><span class=\"tag gov\">공격 방어<\/span><h4>프롬프트 인젝션 대응<\/h4><p>악의적 입력을 탐지하고 시스템 지침을 보호하며, 학습데이터 복원 위험을 정기 점검합니다.<\/p><\/div>\n      <div class=\"case\"><span class=\"tag gov\">고지 의무<\/span><h4>자동처분 오해 방지<\/h4><p>모든 AI 답변에 \"최종 판단은 담당부서 검토 후 확정\"을 고지해 처분으로 오인될 여지를 없앱니다.<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ═══════════════ PART 06 공무원 보호 프로세스 ═══════════════ -->\n<section id=\"p6\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">PART 06 · 공무원 보호 프로세스 · CORE<\/div>\n    <h2>악성 민원이 담당자에게 도달하기까지,<br>AI가 4중 차단막을 설계합니다<\/h2>\n    <p class=\"sec-lede\">법적 보호 수단은 확보됐지만 현장은 여전히 담당자 1인이 모든 민원을 1차로 받아내는 구조입니다.\n    본 시스템의 핵심 가치는 <b>담당자에게 도달하기 전 단계에서 단순·반복·욕설·협박 민원을 사전에 거르는 '0단계 차단막'<\/b>을 추가해,\n    공무원이 실제로 처리해야 할 행정 사안에만 집중하게 만드는 데 있습니다.<\/p>\n\n    <div class=\"twin\">\n      <div class=\"twin-col before\">\n        <span class=\"label\">BEFORE · AI 미도입<\/span>\n        <div class=\"t-head\"><div class=\"big\">직통<\/div><span>시민 → 담당 공무원<\/span><\/div>\n        <p>조례·신청 양식·증명서 같은 단순 문의도 담당자 직통 전화로 전달됩니다. 욕설·협박·반복 민원도 같은 채널로 들어오기 때문에 담당자는 사실상 상시 정서적 부담 상태가 됩니다.<\/p>\n        <ul class=\"sh-list\">\n          <li>야간·휴일 전화가 당직 또는 다음 근무일 담당자에게 그대로 도달<\/li>\n          <li>업무시간 중 욕설·협박 전화로 정상 행정업무 중단<\/li>\n          <li>반복·집착성 민원이 사전 필터 없이 동일 담당자에게 누적<\/li>\n          <li>답변 작성·녹음·전담부서 보고까지 개인이 전담<\/li>\n          <li>법적 위협·고소 위협 시 담당자가 단독 대응<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"twin-col after\">\n        <span class=\"label\">AFTER · AI 1차 응대층<\/span>\n        <div class=\"t-head\"><div class=\"big\">완충<\/div><span>시민 → AI → 분류 → 담당자(선택적)<\/span><\/div>\n        <p>모든 민원이 AI 채널로 먼저 들어옵니다. 단순 문의는 자동 응답으로 종결되고, 신고 민원은 접수번호와 함께 담당부서로 라우팅되며, 악성 민원은 통화 전체 녹음과 함께 전담부서로 자동 이관됩니다.<\/p>\n        <ul class=\"sh-list\">\n          <li>조례·증명서·신청 등 반복 문의는 자동 응대로 종결<\/li>\n          <li>업무시간 외 콜봇이 1차 응대 후 접수번호 발급<\/li>\n          <li>욕설·협박·반복 민원 자동 탐지 후 전담부서 검토 대상으로 분리<\/li>\n          <li>AI가 민원 요약·녹음 보전·답변 초안을 자동 생성<\/li>\n          <li>법적 위협 민원은 즉시 법무·전담부서 이관 + 시행령상 종결권 활용<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <h3>공무원 보호 7단계 — '도달 차단'의 단계적 설계<\/h3>\n    <p class=\"sec-lede\">민원 한 건이 들어와 담당자에게 도달하지 않거나, 도달하더라도 충분히 분류·검토·녹음 보전된 상태로 전달되기까지의 표준 처리 흐름입니다.<\/p>\n    <div class=\"shield-steps\">\n      <div class=\"sstep l1\"><div class=\"no\">1<\/div><b>채널 통합 접수<\/b><p>웹·카카오톡·문자·전화 콜봇·키오스크로 들어온 모든 민원을 단일 큐로 통합.<\/p><span class=\"layer\">LAYER 1 · AI 응대<\/span><\/div>\n      <div class=\"sstep l1\"><div class=\"no\">2<\/div><b>발화 분석 · 위험도 스코어링<\/b><p>욕설·협박·모욕·성희롱·반복·장시간 통화·법적 위협·개인정보 요구 등 8개 위험 시그널 자동 탐지.<\/p><span class=\"layer\">LAYER 1 · AI 응대<\/span><\/div>\n      <div class=\"sstep l2\"><div class=\"no\">3<\/div><b>저위험 자동 응대<\/b><p>조례·증명서·신청·생활민원 등 반복 문의는 출처와 함께 답변 후 종결. 담당자 미도달.<\/p><span class=\"layer\">LAYER 2 · 자동 종결<\/span><\/div>\n      <div class=\"sstep l2\"><div class=\"no\">4<\/div><b>신고·접수 자동 생성<\/b><p>생활불편 신고는 위치·사진과 함께 접수번호 발급, 담당부서 자동 라우팅. AI가 사전 요약을 함께 정리.<\/p><span class=\"layer\">LAYER 2 · 접수 처리<\/span><\/div>\n      <div class=\"sstep l3\"><div class=\"no\">5<\/div><b>고위험 전담부서 이관<\/b><p>위험 점수 임계치 초과 시 담당자에게 알리지 않고 전담부서로 직접 이관. 통화 전체 녹음 자동 보전.<\/p><span class=\"layer\">LAYER 3 · 기관 대응<\/span><\/div>\n      <div class=\"sstep l3\"><div class=\"no\">6<\/div><b>문서민원 종결권 행사<\/b><p>욕설·협박·모욕·성희롱이 상당 부분 포함된 문서민원은 시행령상 종결 처리. 담당자 답변 의무 없음.<\/p><span class=\"layer\">LAYER 3 · 법적 종결<\/span><\/div>\n      <div class=\"sstep l4\"><div class=\"no\">7<\/div><b>법적 대응 · 치유 연계<\/b><p>법적 위협 민원은 기관 차원 대응 절차로 전환, 위법행위 시 고발 검토, 담당자에게 심리상담·치유 프로그램 자동 안내.<\/p><span class=\"layer\">LAYER 4 · 법적 보호<\/span><\/div>\n    <\/div>\n\n    <h3>악성 민원 유형별 자동 차단 · 분류 매트릭스<\/h3>\n    <div class=\"tbl-outer tbl-wrap\">\n    <table>\n      <thead><tr><th style=\"width:20%\">위험 시그널<\/th><th style=\"width:34%\">탐지 기준<\/th><th style=\"width:28%\">처리 경로<\/th><th>담당자 도달<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td>반복·집착성 민원<\/td><td>동일 발신자 7일 내 3회 초과 · 동일 사안 반복 제기<\/td><td><span class=\"pill-tag team\">담당부서 통합 응대<\/span><\/td><td><span class=\"blocked\">차단<\/span><\/td><\/tr>\n        <tr><td>욕설·협박·모욕<\/td><td>언어 모델 기반 욕설·협박·모욕 표현 자동 탐지<\/td><td><span class=\"pill-tag office\">위법행위 전담부서<\/span><\/td><td><span class=\"blocked\">차단 + 녹음 보전<\/span><\/td><\/tr>\n        <tr><td>성희롱·언어성폭력<\/td><td>성적 발언·언어성폭력 표현 1회 이상 탐지<\/td><td><span class=\"pill-tag office\">전담부서<\/span> <span class=\"pill-tag legal\">법적 대응<\/span><\/td><td><span class=\"blocked\">즉시 종료 + 형사 검토<\/span><\/td><\/tr>\n        <tr><td>장시간 통화·면담<\/td><td>통화 30분 초과 시 자동 안내 → 60분 초과 시 종결권 행사<\/td><td><span class=\"pill-tag auto\">AI 자동 종결<\/span><\/td><td><span class=\"blocked\">시행령상 종결<\/span><\/td><\/tr>\n        <tr><td>법적 위협·고소 위협<\/td><td>\"고소하겠다\", \"소송하겠다\" 등 법적 위협 발화 탐지<\/td><td><span class=\"pill-tag office\">법무부서<\/span> <span class=\"pill-tag legal\">기관 법적 대응<\/span><\/td><td><span class=\"blocked\">차단 + 즉시 보고<\/span><\/td><\/tr>\n        <tr><td>재난·긴급 사안<\/td><td>화재·홍수·붕괴·인명피해 등 긴급 키워드<\/td><td><span class=\"pill-tag legal\">119 · 112 · 재난당직<\/span><\/td><td><span class=\"ok\">담당 절차 직접 연결<\/span><\/td><\/tr>\n        <tr><td>개인정보 요구<\/td><td>담당자 개인 휴대폰·주소·SNS 등 직무 외 정보 요구<\/td><td><span class=\"pill-tag auto\">AI 자동 거절<\/span> <span class=\"pill-tag team\">전담부서<\/span><\/td><td><span class=\"blocked\">차단 (정중 거절)<\/span><\/td><\/tr>\n        <tr><td>처분성·재량성 민원<\/td><td>인허가·보상·법적 판단 등 AI 단독 답변 불가 사안<\/td><td><span class=\"pill-tag team\">담당자 검토<\/span><\/td><td><span class=\"ok\">요약 첨부 후 전달<\/span><\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    <\/div>\n\n    <h3>증거 보전과 담당자 통제권<\/h3>\n    <div class=\"grid2\">\n      <div class=\"panel\">\n        <div class=\"p-title\">모든 민원의 자동 로그 + 통화 전체 녹음<\/div>\n        <div class=\"p-sub\">증거 보전 · 법적 방어<\/div>\n        <p style=\"font-size:13.5px;color:var(--sub)\">AI 채널을 거친 모든 민원은 발신자·시각·내용·처리 경로가 자동 기록됩니다. 시행령 개정으로 <b>폭언 발생 여부와 무관하게 시작부터 종료까지 전체 녹음<\/b>이 가능해졌고, 시스템은 이를 자동화해 기관 차원 법적 대응의 객관적 증거를 확보합니다.<\/p>\n        <div class=\"p-note\">통화 전체 녹음 + STT 자동 텍스트화 + 위험도 점수 동시 보관 · 접근권한 통제와 감사로그 · 법정 보존기간 준수 · 위법행위 발생 시 고발/청구 자료 자동 첨부<\/div>\n      <\/div>\n      <div class=\"panel\">\n        <div class=\"p-title\">담당자가 직접 조정하는 보호 설정<\/div>\n        <div class=\"p-sub\">공무원 통제권 · 치유 연계<\/div>\n        <p style=\"font-size:13.5px;color:var(--sub)\">담당자는 자신에게 도달하는 민원의 범위를 부서장·전담부서와 협의해 직접 조정할 수 있습니다. <b>'점심시간 차단', '특정 발신자 직접 응대 차단', '예약된 면담 외 연락 차단'<\/b> 등을 본인 단위에서 켜고 끌 수 있습니다.<\/p>\n        <div class=\"p-note\">개별 보호 설정 패널(웹·모바일) · 주간/월간 담당자별 보호 효과 리포트(차단 건수·유형·시간대) · 심리상담·치유 프로그램 원터치 신청 연계<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"callout\">\n      <div class=\"mark\">\"<\/div>\n      <p>AI가 0단계 응대층을 맡으면 담당자는 실제 행정 처리가 필요한 사안에만 집중할 수 있습니다.\n      결과적으로 <b>담당자가 마주하는 민원의 총량과 정서적 강도가 동시에 줄어들고, 통화 녹음·종결권·법적 대응 등 법적 보호조치도 시스템이 자동 실행<\/b>합니다.\n      이것이 본 시스템이 추구하는 본질적 가치입니다.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ═══════════════ PART 07 화면 구성 ═══════════════ -->\n<section id=\"p7\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">PART 07 · 화면 구성<\/div>\n    <h2>세 개의 역할, 하나의 데이터 —<br>실제로 동작하는 화면으로 확인하십시오<\/h2>\n    <p class=\"sec-lede\">시민이 보는 화면, 담당자가 쓰는 화면, 관리자가 읽는 화면은 서로 다른 시스템이 아니라\n    <b>같은 민원 레코드를 각자의 관점에서 비추는 세 개의 창<\/b>입니다. 담당자가 결재를 올리면 시민 트래커의 단계가 자동으로 넘어가고,\n    그 처리 시각은 그대로 관리자 대시보드의 병목 지표가 됩니다. 아래는 그 흐름을 그대로 구현한 프로토타입입니다.<\/p>\n\n    <div class=\"screen-system\">\n      <div class=\"system-map\">\n        <h4>하나의 레코드가 흐르는 경로<\/h4>\n        <div class=\"flow-chips\">\n          <span class=\"flow-chip core\">시민 접수<\/span>\n          <span class=\"flow-chip\">AI 분류·요약<\/span>\n          <span class=\"flow-chip\">부서 자동 배정<\/span>\n          <span class=\"flow-chip core\">담당자 업무 큐<\/span>\n          <span class=\"flow-chip\">AI 답변 초안<\/span>\n          <span class=\"flow-chip\">결재 상신<\/span>\n          <span class=\"flow-chip core\">시민 트래커 자동 갱신<\/span>\n          <span class=\"flow-chip\">문자(SMS) 알림<\/span>\n          <span class=\"flow-chip\">답변서 · 만족도<\/span>\n          <span class=\"flow-chip core\">관리자 성과 지표<\/span>\n        <\/div>\n        <p class=\"mock-note\">담당자가 별도로 상태를 입력하는 단계가 없습니다. 결재·열람·협조전 같은 <b>기존 업무 행위 자체가 이벤트<\/b>가 되어 시민 화면과 관리자 지표로 동시에 반영됩니다 — 제로터치 동기화.<\/p>\n      <\/div>\n      <div class=\"screen-matrix\">\n        <h4>역할별 화면 구성 — 총 24개<\/h4>\n        <div class=\"matrix-row\"><b>CITIZEN<\/b><span>홈 · 대화형 접수 · 나의 민원 · 상세 트래커 · 답변서/만족도 · 보완자료 제출 · 문자 알림 · 내 정보 · 휴대폰 본인인증 <b style=\"color:var(--navy);font-family:var(--sans);font-size:12.5px;letter-spacing:0\">(9)<\/b><\/span><\/div>\n        <div class=\"matrix-row\"><b>STAFF<\/b><span>업무 큐 · 민원 상세 · AI 답변 초안 · 결재 상신 · 유사민원 묶음 · 특이민원 보호 · 발생보고서 · 기한 관리 <b style=\"color:var(--navy);font-family:var(--sans);font-size:12.5px;letter-spacing:0\">(8)<\/b><\/span><\/div>\n        <div class=\"matrix-row\"><b>ADMIN<\/b><span>종합 현황 · 부서별 성과 · 부서 상세 · 이슈 감지 · 키워드 상세 · AI 성능 · 담당자 보호 현황 <b style=\"color:var(--navy);font-family:var(--sans);font-size:12.5px;letter-spacing:0\">(7)<\/b><\/span><\/div>\n        <div class=\"matrix-row\"><b>DEVICE<\/b><span>시민 화면은 별도 앱 설치 없이 모바일 웹으로 동작하며, 담당자·관리자 화면은 데스크톱 콘솔로 제공됩니다<\/span><\/div>\n      <\/div>\n    <\/div>\n\n    <h3>인터랙티브 UI<\/h3>\n    <div class=\"proto-shell\">\n      <div class=\"proto-bar\">\n        <span class=\"dots\"><i style=\"background:#e9857e\"><\/i><i style=\"background:#e8c56a\"><\/i><i style=\"background:#7fc79a\"><\/i><\/span>\n        <span class=\"addr\">minwon.example.go.kr / 스마트 민원<\/span>\n        <span class=\"hint\"><b>TIP<\/b> 상단 역할 탭으로 시민 · 담당자 · 관리자 화면을 전환합니다<\/span>\n      <\/div>\n      <iframe class=\"proto-frame\" id=\"protoFrame\" title=\"AI 스마트 민원 솔루션 프로토타입 v3\" loading=\"lazy\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;ko&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;CIVIC OS — AI 스마트 민원 솔루션 프로토타입 v3&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;link rel=&quot;stylesheet&quot; href=&quot;https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css&quot;&gt;\n&lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js&quot;&gt;&lt;/script&gt;\n&lt;style&gt;\n:root{\n  --navy:#16203a; --navy-2:#1e2b4d; --navy-3:#0f1729;\n  --gold:#b8902a; --gold-soft:#d9b45c; --gold-tint:#fbf7ec;\n  --paper:#f7f5f0; --card:#fff; --line:#e4dfd4; --line2:#efece4;\n  --ink:#1c2333; --sub:#5b6478;\n  --blue:#2f6fed; --blue-d:#1f56c9; --blue-soft:#e8effd;\n  --green:#1f9d55; --green-soft:#e9f6ee;\n  --amber:#d97b06; --amber-soft:#fdf3e2;\n  --red:#d5453c; --red-soft:#fdeceb;\n  --serif:&#x27;Noto Serif KR&#x27;,serif;\n  --sans:&#x27;Pretendard&#x27;,&#x27;Noto Sans KR&#x27;,-apple-system,sans-serif;\n  --mono:&#x27;JetBrains Mono&#x27;,monospace;\n}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml,body{height:auto;min-height:0}\nbody{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6}\nbutton{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}\ninput,select,textarea{font-family:inherit}\nbutton:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}\n\n/* ═══════ SHELL ═══════ */\n.shell-top{background:var(--navy-3);color:#e8ebf5;position:relative;z-index:100;border-bottom:1px solid #22335c}\n.shell-in{max-width:100%;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:18px;height:58px}\n.shell-brand{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--gold-soft)}\n.shell-brand small{display:block;font-size:9px;letter-spacing:.14em;color:#8f99b6;font-weight:500}\n.role-tabs{display:flex;gap:6px;margin-left:auto}\n.role-tab{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:100px;font-size:13px;font-weight:600;color:#9aa6c8;border:1px solid transparent;transition:.2s}\n.role-tab .rdot{width:7px;height:7px;border-radius:50%;background:#3a486b}\n.role-tab:hover{color:#fff}\n.role-tab.on{color:#fff;background:rgba(184,144,42,.16);border-color:rgba(217,180,92,.5)}\n.role-tab.on .rdot{background:var(--gold-soft);box-shadow:0 0 8px rgba(217,180,92,.9)}\n.proto-badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:#8f99b6;border:1px solid #2a3a63;border-radius:6px;padding:3px 8px}\n.view{display:none}\n.view.on{display:block;animation:fadein .25s ease}\n@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:reduce){.view.on,.mpage.on,.wspage.on{animation:none!important}}\n\n#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-size:13.5px;padding:12px 22px;border-radius:100px;box-shadow:0 14px 40px -10px rgba(15,23,41,.55);opacity:0;pointer-events:none;transition:.3s;z-index:999;max-width:92vw}\n#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}\n#toast b{color:var(--gold-soft)}\n\n/* ═══════ LIGHT CONSOLE SHELL (staff + admin 공통) ═══════ */\n.ws-shell{display:grid;grid-template-columns:224px 1fr;min-height:640px}\n.ws-side{background:#fff;border-right:1px solid var(--line);padding:20px 0;display:flex;flex-direction:column;position:static;height:auto;overflow:visible}\n.ws-side .brand{padding:0 20px 16px;border-bottom:1px solid var(--line2)}\n.ws-side .brand .b1{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.2em;color:var(--gold)}\n.ws-side .brand .b2{font-size:11.5px;color:var(--sub);margin-top:3px}\n.ws-nav{padding:12px 10px;flex:1}\n.ws-nav .grp{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:#a8a08c;padding:14px 12px 6px}\n.ws-nav button{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--sub);text-align:left;transition:.15s}\n.ws-nav button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}\n.ws-nav button:hover{background:#f6f3ea;color:var(--navy)}\n.ws-nav button.on{background:linear-gradient(90deg,rgba(184,144,42,.14),rgba(184,144,42,.02));color:var(--navy);box-shadow:inset 3px 0 0 var(--gold)}\n.ws-nav .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--line2);color:var(--sub);border-radius:100px;padding:1px 8px}\n.ws-nav button.on .cnt{background:var(--gold);color:#fff;font-weight:700}\n.ws-user{border-top:1px solid var(--line2);padding:14px 20px;display:flex;gap:10px;align-items:center}\n.ws-user .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,var(--gold),var(--gold-soft));display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}\n.ws-user .un{font-size:12.5px;font-weight:700;color:var(--navy)}\n.ws-user .ur{font-size:10.5px;color:var(--sub)}\n.ws-main{padding:24px 26px 40px;min-width:0}\n.ws-topline{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}\n.ws-topline h2{font-size:19px;font-weight:800;color:var(--navy)}\n.ws-topline .sub{font-size:12px;color:var(--sub)}\n.ws-topline .sync{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--sub);display:flex;gap:8px;align-items:center}\n.ws-topline .sync b{color:var(--green);animation:blink 2.4s infinite}\n@keyframes blink{50%{opacity:.35}}\n.ws-topline .backlink{font-size:12.5px;font-weight:700;color:var(--gold);display:inline-flex;gap:5px;align-items:center}\n.wspage{display:none}\n.wspage.on{display:block;animation:fadein .22s ease}\n\n/* summary cards */\n.ws-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}\n.ws-cards.five{grid-template-columns:repeat(5,1fr)}\n.ws-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 17px;position:relative;overflow:hidden}\n.ws-card::before{content:&quot;&quot;;position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}\n.ws-card.blue::before{background:var(--blue)}\n.ws-card.red::before{background:var(--red)}\n.ws-card.green::before{background:var(--green)}\n.ws-card .k{font-size:11.5px;color:var(--sub);font-weight:700}\n.ws-card .v{font-family:var(--mono);font-size:25px;font-weight:700;color:var(--navy);margin-top:5px}\n.ws-card .d{font-size:11px;margin-top:4px;color:var(--sub)}\n.ws-card .d.warn{color:var(--amber)}.ws-card .d.ok{color:var(--green)}.ws-card .d.bad{color:var(--red)}\n\n/* panels */\n.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}\n.panel + .panel{margin-top:14px}\n.panel .bh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.panel .bh b{font-size:13.5px;color:var(--navy)}\n.panel .bh .mono{font-family:var(--mono);font-size:10px;color:#a8a08c;letter-spacing:.1em}\n.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}\n.grid2 + .grid2,.grid2 + .panel,.panel + .grid2{margin-top:14px}\n.grid2 &gt; div &gt; .panel + .panel{margin-top:14px}\n\n/* queue table */\n.q-panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}\n.q-tools{display:flex;gap:8px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}\n.q-tools .f{font-size:11.5px;font-weight:700;color:var(--sub);background:var(--paper);border:1px solid var(--line);border-radius:100px;padding:6px 14px}\n.q-tools .f.on{color:#fff;background:var(--navy);border-color:var(--navy)}\n.q-tools .srch{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:#a8a08c;border:1px solid var(--line);border-radius:8px;padding:6px 12px}\n.qt{width:100%;border-collapse:collapse;font-size:12.5px}\n.qt th{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:#a8a08c;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line2);font-weight:700}\n.qt td{padding:13px 16px;border-bottom:1px solid #f4f1e9;vertical-align:middle}\n.qt tr.row{cursor:pointer;transition:.15s}\n.qt tr.row:hover{background:#faf8f2}\n.qt .qid{font-family:var(--mono);font-size:11px;color:var(--sub)}\n.qt .qtt{font-weight:700;color:var(--ink);font-size:13px}\n.qt .qtt small{display:block;font-weight:400;font-size:11px;color:var(--sub);margin-top:2px}\n.dpill{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:100px;padding:4px 11px;display:inline-block}\n.dpill.g{background:var(--green-soft);color:var(--green)}\n.dpill.a{background:var(--amber-soft);color:var(--amber)}\n.dpill.r{background:var(--red-soft);color:var(--red)}\n.fl{font-family:var(--mono);font-size:9.5px;font-weight:700;border-radius:6px;padding:4px 9px;display:inline-block}\n.fl.urgent{background:var(--blue-soft);color:var(--blue-d)}\n.fl.spec{background:var(--red-soft);color:var(--red)}\n.fl.grp{background:var(--gold-tint);color:var(--gold);border:1px solid #ecdcb2}\n.fl.none{color:#c9c2b2}\n.qst{font-size:11px;font-weight:600;color:var(--sub)}\n.qst::before{content:&quot;●&quot;;font-size:8px;margin-right:5px;vertical-align:1px}\n.qst.s1::before{color:var(--blue)}.qst.s2::before{color:var(--amber)}.qst.s3::before{color:var(--green)}\n\n/* detail parts */\n.spec-banner{display:flex;gap:12px;align-items:flex-start;background:var(--red-soft);border:1px solid #f0b9b4;border-radius:14px;padding:14px 16px;margin-bottom:16px}\n.spec-banner .si{flex:none;width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--red);font-size:16px}\n.spec-banner .st1{font-size:13px;font-weight:700;color:var(--red)}\n.spec-banner .st2{font-size:12px;color:#8a5a56;margin-top:2px}\n.orig-toggle{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}\n.orig-toggle button{font-size:11px;font-weight:700;color:var(--sub);padding:7px 14px}\n.orig-toggle button.on{background:var(--navy);color:#fff}\n.origin-text{font-size:13px;line-height:1.75;color:var(--ink);background:#fbfaf6;border:1px solid var(--line2);border-radius:12px;padding:15px 17px}\n.origin-text mark{background:var(--red-soft);color:var(--red);border-radius:4px;padding:0 3px}\n.kv{display:grid;gap:9px}\n.kv .row{display:flex;gap:10px;font-size:12.5px}\n.kv .k{flex:none;width:64px;font-family:var(--mono);font-size:10px;color:#a8a08c;padding-top:2px;letter-spacing:.06em}\n.kv .v{color:var(--ink)}\n.kv .v b{color:var(--gold)}\n.conf2 .bar{height:7px;background:var(--line2);border-radius:5px;overflow:hidden}\n.conf2 .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft))}\n.conf2 .n{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--sub);margin-top:6px}\n.conf2 .n b{color:var(--gold)}\n.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n.abtn{font-size:12.5px;font-weight:700;text-align:center;border-radius:10px; t=0;\n  function measure(){\n    /* documentElement.scrollHeight 는 뷰포트보다 작아지지 않으므로\n       실제 콘텐츠(활성 view)의 렌더 높이를 직접 잰다. */\n    var view=document.querySelector(&#x27;.view.on&#x27;);\n    var top=document.querySelector(&#x27;.shell-top&#x27;);\n    var h=0;\n    if(view){\n      h=Math.ceil(view.getBoundingClientRect().height)\n        + (top?Math.ceil(top.getBoundingClientRect().height):0);\n    }\n    if(!h&amp;&amp;document.body) h=Math.ceil(document.body.getBoundingClientRect().height);\n    return h;\n  }\n  function send(){\n    var h=measure();\n    if(!h||Math.abs(h-last)&lt;3) return;\n    last=h;\n    try{window.parent.postMessage({civicos:&#x27;height&#x27;,h:h},&#x27;*&#x27;);}catch(e){}\n  }\n  window.addEventListener(&#x27;load&#x27;,function(){send();setTimeout(send,120);setTimeout(send,600);});\n  window.addEventListener(&#x27;resize&#x27;,send);\n  document.addEventListener(&#x27;click&#x27;,function(){\n    [30,140,360,700].forEach(function(t){setTimeout(send,t);});\n  },true);\n  if(window.ResizeObserver){\n    try{var ro=new ResizeObserver(send);ro.observe(document.body);\n        var v0=document.querySelector(&#x27;.view.on&#x27;);if(v0)ro.observe(v0);}catch(e){}\n  }else{\n    setInterval(send,700);\n  }\n  send();\n})();\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\"><\/iframe>\n    <\/div>\n    <p class=\"proto-cap\"><b>조작 안내<\/b> — 시민 화면은 하단 탭바와 카드 클릭으로 9개 화면을 이동합니다(내 정보 → 휴대폰 본인인증 시연 인증번호 <b>482913<\/b>).\n    담당자·관리자 화면은 좌측 메뉴로 전환합니다. 프레임 높이는 화면 전환에 맞춰 자동으로 조정되며, 문서 스크롤 하나로 그대로 이어집니다.<\/p>\n\n    <div class=\"handoff\">\n      <h4>화면과 화면 사이 — 이 문서가 제안하는 핵심 연결<\/h4>\n      <div class=\"handoff-grid\">\n        <div class=\"handoff-step\"><b>STEP 01<\/b><span>시민이 말하듯 접수 → AI가 유형·부서·긴급도를 판정하고 접수번호를 즉시 발급<\/span><\/div>\n        <div class=\"handoff-step\"><b>STEP 02<\/b><span>담당자 큐에 요약·근거·추천 부서가 붙은 상태로 도착 → 읽기 전에 판단 가능<\/span><\/div>\n        <div class=\"handoff-step\"><b>STEP 03<\/b><span>결재·협조전·보완요청 등 업무 행위가 그대로 시민 트래커 단계로 자동 반영<\/span><\/div>\n        <div class=\"handoff-step\"><b>STEP 04<\/b><span>처리 시각·이관 이력이 관리자 병목 히트맵과 AI 성능 지표로 누적<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ═══════════════ PART 08 기대 효과 ═══════════════ -->\n<section id=\"p8\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">PART 08 · 기대 효과<\/div>\n    <h2>문제 · 기능 · 효과의 1:1 매핑<\/h2>\n    <p class=\"sec-lede\">목표치는 PoC 단계에서 자체 데이터로 보정하는 것을 전제로 한 관리 목표입니다.\n    각 목표는 제1부에서 검증한 실태 수치에 근거를 둡니다.<\/p>\n    <div class=\"tbl-outer tbl-wrap\">\n    <table class=\"effects\">\n      <thead><tr><th>검증된 실태<\/th><th>적용 기능<\/th><th>정량 목표<\/th><th>정성 효과<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td>단순·반복 민원 ~15%<br>안내형 이용목적 상위<\/td><td>AI 24시간 1차 응답<\/td><td><span class=\"target good\">30~40%<\/span> 즉시 처리<br><span class=\"target\">~30%<\/span> 응대량 경감<\/td><td>야간·주말 공백 해소, 반복 응대 피로 해소<\/td><\/tr>\n        <tr><td>수작업 분류·배정<br>오배정 핑퐁<\/td><td>스마트 라우팅<br>(하이브리드 배정)<\/td><td>배정 <span class=\"target good\">50~70%↓<\/span> (수 분 내)<br>오배정 <span class=\"target good\">30~50%↓<\/span><\/td><td>책임 공방 감소, 반려 환류로 정확도 지속 상승<\/td><\/tr>\n        <tr><td>깜깜이 처리<br>→ 확인 전화 반복<\/td><td>제로터치 동기화<br>+ 트래커<\/td><td>진행 문의 전화 <span class=\"target good\">20~30%↓<\/span><\/td><td>\"택배 조회 수준\"의 투명성 체감, 행정 신뢰 회복<\/td><\/tr>\n        <tr><td>특이민원 경험 86%<br>업무지연 87.9% · 스트레스 90.8%<\/td><td>악성발언 필터<br>증적·보호절차 연동<\/td><td>특이민원 점유 시간 감축<br>법적 대응 준비 단축<\/td><td><b>담당자 보호<\/b> — 민원부서 기피 완화, 일반 민원 처리속도 회수<\/td><\/tr>\n        <tr><td>답변 품질의 개인 편차<\/td><td>RAG 답변 초안<\/td><td>초안 작성 <span class=\"target good\">30~50%↓<\/span><\/td><td>답변 표준화, 인사이동에도 지식 연속성<\/td><\/tr>\n        <tr><td>민원 데이터 정책 활용 미흡<\/td><td>병목 히트맵<br>급증 키워드 감지<\/td><td>정책 과제 발굴 건수<br>(신규 KPI)<\/td><td>사후 대응 → <b>선제 행정<\/b> 전환<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    <\/div>\n\n    <h3>KPI 체계 — 처음부터 측정 가능하게<\/h3>\n    <p class=\"sec-lede\">1차 해결률·이관률·오답률 같은 핵심 지표는 기관마다 공개 수준이 제각각입니다.\n    그래서 사업 착수 시점에 지표 정의와 산식을 먼저 확정하고, 시범 운영 데이터로 목표치를 보정합니다.\n    아래 수치는 <b>앞의 기대 효과 표와 동일한 기준<\/b>으로 설정한 관리 목표 예시입니다.<\/p>\n    <div class=\"grid3\">\n      <div class=\"panel\">\n        <div class=\"p-title\">시민 편의 지표<\/div>\n        <div class=\"p-sub\">단계별 목표 추이 · %<\/div>\n        <canvas id=\"chKpiCitizen\" role=\"img\" aria-label=\"시민 편의 지표 추이 그래프\"><\/canvas>\n      <\/div>\n      <div class=\"panel\">\n        <div class=\"p-title\">행정 효율 지표<\/div>\n        <div class=\"p-sub\">도입 전 대비 1년차 목표 · %<\/div>\n        <canvas id=\"chKpiAdmin\" role=\"img\" aria-label=\"행정 효율 지표 막대 그래프\"><\/canvas>\n      <\/div>\n      <div class=\"panel\">\n        <div class=\"p-title\">품질 · 안전 지표<\/div>\n        <div class=\"p-sub\">현재 수준 vs 목표 · %<\/div>\n        <canvas id=\"chKpiQuality\" role=\"img\" aria-label=\"품질 안전 지표 방사형 그래프\"><\/canvas>\n      <\/div>\n    <\/div>\n    <div class=\"cases\" style=\"margin-top:20px\">\n      <div class=\"case\"><span class=\"tag kr\">시민 편의<\/span><h4>체감 지표<\/h4><p>AI 1차 응답률 · 1차 해결률 · 평균 응답시간 · 상담 전환율 · 만족도 · 재문의율<\/p><\/div>\n      <div class=\"case\"><span class=\"tag gov\">행정 효율<\/span><h4>업무 지표<\/h4><p>자동분류 정확도 · 답변 초안 활용률 · 처리시간 단축률 · 반복민원 감축률 · 재이관 감소율 · 자동화 절감시간<\/p><\/div>\n      <div class=\"case\"><span class=\"tag intl\">품질 · 안전<\/span><h4>신뢰 지표<\/h4><p>오답률 · 근거문서 첨부율 · 개인정보 탐지율 · 장애 건수 · 지식베이스 갱신율<\/p><\/div>\n    <\/div>\n    <p class=\"proto-cap\">지표는 <b>월간 품질 리포트<\/b>로 고정 보고하고, 목표 미달 항목은 지식베이스 갱신·임계값 조정·정답셋 보완 중\n    어느 조치로 대응할지를 함께 기록합니다. 지표만 보고하고 조치를 기록하지 않으면 개선 루프가 끊깁니다.<\/p>\n  <\/div>\n<\/section>\n\n<\!-- ═══════════════ PART 09 지역 맞춤 설계 ═══════════════ -->\n<section id=\"p9\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">PART 09 · 지역 맞춤 설계 · REGIONAL FIT<\/div>\n    <h2>같은 엔진, 다른 지역 —<br>도입 기관의 특성에 맞춰 조정합니다<\/h2>\n    <p class=\"sec-lede\">민원의 구성은 지역마다 다릅니다. 대도시는 주정차·소음·재개발 민원이, 농어촌은 도로·상하수도·농지 민원이 상위를 차지하고,\n    이용 채널도 도시권은 웹·메신저, 군 단위는 전화가 우세합니다. 본 시스템은 <b>공통 엔진은 그대로 두고 지역 변수만 교체<\/b>하는 구조로 설계되어,\n    조례·업무분장·채널 가중치·위험도 임계치를 기관별로 커스터마이징할 수 있습니다. 아래는 조정 가능한 5개 축입니다.<\/p>\n\n    <h3>지역 특성에 따라 조정되는 5개 축<\/h3>\n    <ul class=\"cbf\">\n      <li><span class=\"ico\">01<\/span><div><b>채널 가중치 — 도시권 vs 군 단위<\/b><small>도시권은 웹·모바일·메신저 채널에 무게를 두고, 고령 인구 비중이 높은 군 단위는 전화 콜봇·문자 중심으로 응대 경로를 재배치합니다. 채널별 운영 시간과 상담원 연결 임계치도 지역별로 다르게 설정합니다.<\/small><\/div><\/li>\n      <li><span class=\"ico\">02<\/span><div><b>담당자 보호 임계치 — 조직 규모 반영<\/b><small>1인이 여러 분야를 겸하는 소규모 기관은 악성 민원 1건의 영향이 큽니다. 이런 기관은 위험도 임계치를 낮춰 더 이른 단계에서 전담부서로 이관하고, 개별 보호 설정의 기본값을 강하게 잡습니다.<\/small><\/div><\/li>\n      <li><span class=\"ico\">03<\/span><div><b>공통 엔진 + 기관별 분리형 지식베이스<\/b><small>상위 기관이 공통 엔진·공통 정답셋을 운영하고, 하위 기관은 자체 조례·업무분장·FAQ만 별도 지식베이스로 관리합니다. 기관이 늘어도 엔진은 하나이므로 확산 비용이 선형으로 증가하지 않습니다.<\/small><\/div><\/li>\n      <li><span class=\"ico\">04<\/span><div><b>재난·긴급 분기 규칙 — 지역 위험 프로파일<\/b><small>침수·산불·산사태·해안 등 지역별 위험 유형에 맞춰 긴급 키워드 사전과 분기 규칙을 다르게 구성합니다. 긴급 건은 일반 상담 경로를 건너뛰고 당직·재난 부서로 즉시 연결됩니다.<\/small><\/div><\/li>\n      <li><span class=\"ico\">05<\/span><div><b>지역 데이터·정책 연계<\/b><small>해당 기관의 조례·고시·공고·홈페이지 FAQ·부서 업무분장·과거 답변을 정기 색인하고, 기관 AI 정책·정보화 기본계획의 과제 체계에 맞춰 KPI를 정의합니다.<\/small><\/div><\/li>\n    <\/ul>\n\n    <h3>커스터마이징 대상 파라미터 — 무엇을 바꾸고, 무엇을 고정하는가<\/h3>\n    <div class=\"tbl-outer tbl-wrap\">\n    <table>\n      <thead><tr><th style=\"width:22%\">영역<\/th><th style=\"width:39%\">기관별로 조정하는 항목<\/th><th>공통으로 고정하는 항목<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td>지식베이스<\/td><td>조례·규칙·업무분장·FAQ·과거 답변, 색인 주기<\/td><td>청킹 규칙, 메타데이터 스키마, 버전관리 체계<\/td><\/tr>\n        <tr><td>분류 체계<\/td><td>민원 유형 코드, 부서 매핑표, 긴급 키워드 사전<\/td><td>분류 모델 구조, 신뢰도 3중 검증 임계값 로직<\/td><\/tr>\n        <tr><td>채널<\/td><td>운영 채널 조합, 채널별 가중치·운영 시간<\/td><td>단일 큐 통합 구조, 접수번호 체계<\/td><\/tr>\n        <tr><td>보호 정책<\/td><td>위험도 임계치, 전담부서 이관 기준, 개별 보호 기본값<\/td><td>8개 위험 시그널 정의, 녹음·증적 보전 절차<\/td><\/tr>\n        <tr><td>시민 화면<\/td><td>기관명·표기·안내 문구, 처리 단계 명칭<\/td><td>트래커 UX, 제로터치 동기화 이벤트 규격<\/td><\/tr>\n        <tr><td>성과 지표<\/td><td>목표 수치, 보고 주기, 부서별 가중치<\/td><td>KPI 산식, 병목 히트맵 산출 방식<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    <\/div>\n    <p class=\"proto-cap\">고정 영역이 공통이기 때문에 기관이 늘어도 <b>운영 매뉴얼·검수 체계·산출물 규격은 재사용<\/b>되고, 조정 영역만 신규 기관 온보딩 작업으로 남습니다.<\/p>\n\n    <h3>도입 1년차 관리 목표<\/h3>\n    <div class=\"stats\">\n      <div class=\"stat\"><div class=\"num\">~30<small>%↓<\/small><\/div><div class=\"lab\">담당자 직접 응대량<\/div><div class=\"src\">PART 08 기대 효과와 동일 기준 · PoC 보정 전제<\/div><\/div>\n      <div class=\"stat\"><div class=\"num\">24/7<small><\/small><\/div><div class=\"lab\">야간·휴일 자동 응대 체계<\/div><div class=\"src\">콜봇 1차 응대 + 접수번호 발급<\/div><\/div>\n      <div class=\"stat\"><div class=\"num\">4<small>중 차단<\/small><\/div><div class=\"lab\">담당자 보호 계층<\/div><div class=\"src\">AI → 담당부서 → 전담부서 → 법적 대응<\/div><\/div>\n      <div class=\"stat\"><div class=\"num\">전수<small><\/small><\/div><div class=\"lab\">민원 유형·트렌드 데이터 축적<\/div><div class=\"src\">정책 과제 발굴용 빅데이터 자산화<\/div><\/div>\n    <\/div>\n    <p class=\"proto-cap\" style=\"border-top:none;padding-top:6px\">위 수치는 서울 120다산콜(챗봇 처리율 16.7%, 응대율 1.5%p↑)·세종 AI충녕의 단순 반복 민원 자동 응대 등 기존 운영 사례를 근거로 보수적으로 설정한 <b>1년차 관리 목표<\/b>이며, 기관 규모와 민원 구성에 따라 시범 운영 결과로 보정합니다.<\/p>\n  <\/div>\n<\/section>\n\n<\!-- ═══════════════ PART 10 추진 로드맵 ═══════════════ -->\n<section id=\"p10\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">PART 10 · 추진 로드맵<\/div>\n    <h2>작게 검증하고, 크게 확산합니다<\/h2>\n    <div class=\"road\">\n      <div class=\"ph\">\n        <div class=\"p-no\">PHASE 1<\/div><h4>시범 도입 · PoC<\/h4><div class=\"term\">0 – 4개월<\/div>\n        <ul>\n          <li>민원 다발 2~3개 부서 시범 (교통·환경·도로)<\/li>\n          <li>최근 3년 민원 데이터 정비 · 업무분장 구조화<\/li>\n          <li>AI 분류·요약·배정 + 시민 트래커 MVP<\/li>\n          <li>제로터치 동기화 — 열람·결재 2개 이벤트부터<\/li>\n        <\/ul>\n        <div class=\"kpi-line\"><b>검증<\/b> 분류 정확도 80%↑ · 자동응답 만족도 70점↑ · 배정시간 50%↑ 단축<\/div>\n      <\/div>\n      <div class=\"ph\">\n        <div class=\"p-no\">PHASE 2<\/div><h4>확산 · 시스템 연동<\/h4><div class=\"term\">5 – 12개월<\/div>\n        <ul>\n          <li>전 부서 확대 · 국민신문고/새올/콜센터(STT) 연계<\/li>\n          <li>문자(SMS) 연동 · 악성민원 필터 정식 가동<\/li>\n          <li>특이민원 대응 절차(시행령) 연계<\/li>\n          <li>제로터치 이벤트 확대 (협조전·일정·보완요청)<\/li>\n        <\/ul>\n        <div class=\"kpi-line\"><b>검증<\/b> 오배정률 30%↓ · 자동 처리율 30%↑ · 진행 문의 전화 20%↓<\/div>\n      <\/div>\n      <div class=\"ph\">\n        <div class=\"p-no\">PHASE 3<\/div><h4>고도화 · 확산 모델<\/h4><div class=\"term\">13 – 24개월<\/div>\n        <ul>\n          <li>계절·이벤트 기반 민원 급증 예측<\/li>\n          <li>다기관 협업 라우팅 · 다국어 대응<\/li>\n          <li>정책 인사이트 리포트 자동화<\/li>\n          <li>타 기관 확산 표준모델 수립<\/li>\n        <\/ul>\n        <div class=\"kpi-line\"><b>검증<\/b> 반복 민원 감소 · 장기 미해결률 감소 · 정책 과제 발굴 건수<\/div>\n      <\/div>\n    <\/div>\n\n    <h3>리스크 관리 원칙<\/h3>\n    <div class=\"tbl-outer tbl-wrap\">\n    <table>\n      <thead><tr><th style=\"width:22%\">리스크<\/th><th>관리 방안<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td>개인정보<\/td><td>탐지·마스킹 자동화, 개인정보 영향평가(PIA) 선행, 접근권한 분리·로그 관리<\/td><\/tr>\n        <tr><td>AI 오분류 · 환각<\/td><td>신뢰도 3중 검증(0.85/0.70 기준) + 반려 환류 학습 · RAG 한정 생성, 출처 표시, 금지응답 룰<\/td><\/tr>\n        <tr><td>책임 소재<\/td><td>AI는 초안·추천 한정, 최종 결정·발송은 담당자 승인(Human-in-the-loop)을 규정에 명문화<\/td><\/tr>\n        <tr><td>디지털 취약계층<\/td><td>콜봇+상담원 연결·방문 채널 병행, 트래커 정보의 문자 알림 병행 제공<\/td><\/tr>\n        <tr><td>조직 저항<\/td><td>\"AI는 보조 도구\" 원칙 · 부서별 슈퍼유저 — 특히 제로터치 설계 자체가 입력 부담을 없애 저항을 구조적으로 낮춤<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<\!-- ═══════════════ PART 10 사업 범위 및 운영 기준 ═══════════════ -->\n<section id=\"p11\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">PART 11 · 사업 범위 및 시스템 확장<\/div>\n    <h2>어디까지 구축하고,<br>어디까지 확장할 것인가<\/h2>\n    <p class=\"sec-lede\">사업 범위는 <b>1차 구축 범위<\/b>와 <b>이후 확장 범위<\/b>를 분리해 정의할 때 예산·검수·책임 소재가 명확해집니다.\n    아래 6개 항목은 1차 사업에서 확정해야 할 구축·운영 범위이고, 이어지는 확장 모듈은 동일 엔진 위에 단계적으로 얹는 후속 범위입니다.<\/p>\n\n    <h3>1차 사업 구축·운영 범위<\/h3>\n    <div class=\"road\">\n      <div class=\"ph\"><div class=\"p-no\">SCOPE 01<\/div><h4>서비스 기능 범위<\/h4><div class=\"term\">구축 대상 정의<\/div>\n        <ul>\n          <li>시민용 챗봇, 담당자 콘솔, 부서 분류, 답변 초안, 신고 접수<\/li>\n          <li>웹·모바일·카카오톡·전화 콜봇·키오스크 채널별 확장 구조<\/li>\n          <li>근거 문서 출처·담당부서·최종수정일 표시<\/li>\n          <li>신뢰도 미달·고위험·개인정보 포함 질의의 담당자 검토 전환<\/li>\n        <\/ul>\n        <div class=\"kpi-line\"><b>산출<\/b> 요구사항정의서 · 화면설계서<\/div>\n      <\/div>\n      <div class=\"ph\"><div class=\"p-no\">SCOPE 02<\/div><h4>데이터·지식베이스<\/h4><div class=\"term\">RAG 구축 범위<\/div>\n        <ul>\n          <li>조례·민원편람·FAQ·공지·업무분장·과거 답변의 수집·정제 기준<\/li>\n          <li>문서 청킹, 메타데이터, 버전관리, 유효기간, 폐기 기준<\/li>\n          <li>대표 질의 정답셋과 테스트셋 구축<\/li>\n          <li>운영 중 지식베이스 갱신 권한과 승인 절차<\/li>\n        <\/ul>\n        <div class=\"kpi-line\"><b>산출<\/b> 지식베이스 구축 명세 · 정답셋<\/div>\n      <\/div>\n      <div class=\"ph\"><div class=\"p-no\">SCOPE 03<\/div><h4>보안·개인정보 보호<\/h4><div class=\"term\">필수 준수 기준<\/div>\n        <ul>\n          <li>입력 개인정보 탐지·마스킹, 로그 분리 저장, 접근권한 통제<\/li>\n          <li>외부 LLM 사용 시 입출력 미저장·자체학습 미활용·국외이전 검토<\/li>\n          <li>프롬프트 인젝션·데이터 유출·학습데이터 복원 위험 대응 체계<\/li>\n          <li>보존기간, 파기절차, 감사로그, 관리자 권한 이력 관리<\/li>\n        <\/ul>\n        <div class=\"kpi-line\"><b>산출<\/b> 보안계획서 · 개인정보 영향평가<\/div>\n      <\/div>\n      <div class=\"ph\"><div class=\"p-no\">SCOPE 04<\/div><h4>품질관리·검수 체계<\/h4><div class=\"term\">운영 품질 기준<\/div>\n        <ul>\n          <li>정확도·근거 충실도·환각률·부서 분류 정확도·1차 해결률 KPI<\/li>\n          <li>오답 신고, 담당자 피드백, 재학습·재색인 주기<\/li>\n          <li>답변 초안은 담당자 검수 후 발송하는 승인 흐름<\/li>\n          <li>월간 품질 리포트와 장애·오답 개선 이력 제공<\/li>\n        <\/ul>\n        <div class=\"kpi-line\"><b>산출<\/b> 월간 품질 리포트 · 개선 이력<\/div>\n      <\/div>\n      <div class=\"ph\"><div class=\"p-no\">SCOPE 05<\/div><h4>기존 시스템 연계<\/h4><div class=\"term\">연계 범위<\/div>\n        <ul>\n          <li>민원 접수 시스템, 홈페이지 CMS, 문자·알림톡, 전자결재 연계<\/li>\n          <li>API·RPA·파일 연계 중 적용 방식과 예외 처리 기준<\/li>\n          <li>시·군 확장을 고려한 멀티테넌트 또는 분리형 지식베이스 구조<\/li>\n          <li>운영자·부서 담당자별 권한 체계<\/li>\n        <\/ul>\n        <div class=\"kpi-line\"><b>산출<\/b> 연계 설계서 · 아키텍처<\/div>\n      <\/div>\n      <div class=\"ph\"><div class=\"p-no\">SCOPE 06<\/div><h4>산출물·검수 기준<\/h4><div class=\"term\">계약 명확화<\/div>\n        <ul>\n          <li>요구사항정의서, 화면설계서, 아키텍처, 보안계획, 테스트 결과서<\/li>\n          <li>지식베이스 구축 명세, 정답셋, 프롬프트 정책, 운영 매뉴얼<\/li>\n          <li>시범운영 결과 보고서와 개선계획<\/li>\n          <li>소스·데이터·산출물 권리와 유지보수 범위 명확화<\/li>\n        <\/ul>\n        <div class=\"kpi-line\"><b>산출<\/b> 검수 기준서 · 운영 매뉴얼<\/div>\n      <\/div>\n    <\/div>\n\n\n    <h3>시스템 확장 모듈 — 동일 엔진 위의 후속 범위<\/h3>\n    <p class=\"sec-lede\">아래 모듈은 1차 구축이 안정화된 뒤 <b>엔진 교체 없이 기능 계층만 추가<\/b>하는 방식으로 확장됩니다.\n    각 모듈은 독립 발주가 가능하며, 확장 시점에도 지식베이스·권한 체계·검수 절차는 그대로 승계됩니다.<\/p>\n    <div class=\"cases\">\n      <div class=\"case\"><span class=\"tag gov\">확산<\/span><h4>다기관 공통 템플릿<\/h4><p>상위 기관이 공통 엔진을 운영하고 하위 기관은 자체 조례·업무분장·FAQ만 별도 지식베이스로 관리해 확산 비용을 최소화합니다.<\/p><\/div>\n      <div class=\"case\"><span class=\"tag kr\">분석<\/span><h4>민원 이슈 대시보드<\/h4><p>지역·분야·시기별 민원 급증 키워드를 분석해 주간 민원 동향 리포트로 제공합니다.<\/p><\/div>\n      <div class=\"case\"><span class=\"tag intl\">접근성<\/span><h4>다국어·쉬운말 안내<\/h4><p>외국인·고령층·디지털 취약계층을 위해 쉬운 문장, 큰글씨·음성 모드, 다국어 안내를 병행 제공합니다.<\/p><\/div>\n      <div class=\"case\"><span class=\"tag gov\">안전<\/span><h4>재난·긴급 분기<\/h4><p>도로 침수·산불·안전사고 등 긴급 키워드는 일반 상담 경로보다 우선 분기합니다.<\/p><\/div>\n      <div class=\"case\"><span class=\"tag kr\">상담 지원<\/span><h4>상담원 보조<\/h4><p>콜센터 상담 중 실시간 관련 문서 추천, 상담 요약, 처리 이력 자동 정리를 지원합니다.<\/p><\/div>\n      <div class=\"case\"><span class=\"tag intl\">책임성<\/span><h4>감사·책임성 로그<\/h4><p>AI 추천 근거, 답변 버전, 검수자, 최종 발송 이력을 감사 가능한 형태로 남깁니다.<\/p><\/div>\n    <\/div>\n\n    <h3>확장 단계와 전제 조건<\/h3>\n    <div class=\"tbl-outer tbl-wrap\">\n    <table>\n      <thead><tr><th style=\"width:16%\">확장 단계<\/th><th style=\"width:30%\">추가되는 범위<\/th><th style=\"width:28%\">선행 전제<\/th><th>확인 지표<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td><b>EXT 1<\/b> 채널 확장<\/td><td>전화 콜봇(STT/TTS), 메신저, 민원실 키오스크<\/td><td>웹 챗봇 1차 해결률 안정화, 정답셋 확보<\/td><td><span class=\"target good\">채널별 1차 해결률<\/span><\/td><\/tr>\n        <tr><td><b>EXT 2<\/b> 기관 확장<\/td><td>멀티테넌트 또는 분리형 지식베이스로 기관 추가<\/td><td>공통 엔진·공통 정답셋 확정, 권한 체계 정립<\/td><td><span class=\"target\">기관 온보딩 소요일<\/span><\/td><\/tr>\n        <tr><td><b>EXT 3<\/b> 업무 확장<\/td><td>정보공개청구, 행정쟁송 대응, 상담원 실시간 보조<\/td><td>답변 초안 검수 승인 흐름 안착<\/td><td><span class=\"target good\">초안 채택률<\/span><\/td><\/tr>\n        <tr><td><b>EXT 4<\/b> 분석 확장<\/td><td>민원 이슈 대시보드, 급증 키워드 감지, 정책 리포트<\/td><td>유형 코드 체계 정비, 최소 6개월 누적 데이터<\/td><td><span class=\"target\">정책 과제 발굴 건수<\/span><\/td><\/tr>\n        <tr><td><b>EXT 5<\/b> 접근성 확장<\/td><td>다국어·쉬운말 안내, 음성·큰글씨 모드<\/td><td>대표 질의 정답셋의 다국어 검수 체계<\/td><td><span class=\"target good\">취약계층 이용률<\/span><\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    <\/div>\n    <p class=\"proto-cap\">확장 모듈은 <b>선행 전제가 충족된 뒤에 착수<\/b>하는 것을 원칙으로 합니다. 특히 채널·기관 확장을 지식베이스 정비보다 먼저 진행하면\n    오답이 채널 수만큼 복제되므로, EXT 1·2는 1차 사업의 품질 지표 달성을 착수 조건으로 명시하시길 권고드립니다.<\/p>\n\n\n    <h3>발주 제안요청서 필수 명시 항목<\/h3>\n    <p class=\"sec-lede\">초기 RFP 단계에서 못박지 않으면 수행사는 가장 쉬운 길을 택합니다.\n    아래 8개 항목은 <b>계약 문서에 문장 단위로 들어가야 하는 요구사항<\/b>이며, 앞선 SCOPE 01~06의 요약이자 검수 기준입니다.<\/p>\n    <div class=\"tbl-outer tbl-wrap\">\n    <table>\n      <thead><tr><th style=\"width:16%\">항목<\/th><th style=\"width:48%\">명시할 요구사항<\/th><th>미명시 시 발생하는 문제<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td><b>서비스 채널<\/b><\/td><td>웹·모바일웹·메신저/문자 기본 제공 + 콜봇·키오스크로 확장 가능한 구조<\/td><td>웹 단일 채널로 구축되어 확장 시 재구축<\/td><\/tr>\n        <tr><td><b>AI 방식<\/b><\/td><td>RAG 기반 답변 · 근거문서 출처 표시 · 신뢰도 미달 시 상담 전환 의무화<\/td><td>시나리오 고정형 챗봇으로 납품<\/td><\/tr>\n        <tr><td><b>데이터<\/b><\/td><td>민원편람·조례·FAQ·업무분장·공지의 구조화 및 메타데이터 부여 범위 명시<\/td><td>원문 파일 업로드 수준에서 종료<\/td><\/tr>\n        <tr><td><b>관리자 기능<\/b><\/td><td>답변 수정·FAQ 등록·문서 갱신·로그 조회·품질 평가 화면 제공<\/td><td>운영 단계마다 수행사 요청 의존<\/td><\/tr>\n        <tr><td><b>보안<\/b><\/td><td>개인정보 마스킹·접근권한·로그관리 + 외부 LLM 조건(미저장·미학습·국외이전) 계약 명시<\/td><td>학습 활용·국외 이전 여부를 사후에 확인 불가<\/td><\/tr>\n        <tr><td><b>연계<\/b><\/td><td>기존 민원시스템·홈페이지·알림톡·조직도·GIS 연계 범위와 방식(API/RPA/파일)<\/td><td>대화까지만 자동화되고 행정 흐름은 수작업<\/td><\/tr>\n        <tr><td><b>운영<\/b><\/td><td>월간 품질 리포트 · 오답 개선 이력 · 현업 피드백 반영 루프의 주기와 책임<\/td><td>품질이 하락해도 개선 근거가 남지 않음<\/td><\/tr>\n        <tr><td><b>확장성<\/b><\/td><td>콜봇·키오스크·자동화·답변 초안·이슈 대시보드의 단계적 확장 전제 설계<\/td><td>1차 구축물이 확장의 걸림돌이 됨<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    <\/div>\n\n    <div class=\"final\">\n      <div class=\"eyebrow\">CONCLUSION<\/div>\n      <h2>지금이 도입 적기입니다<\/h2>\n      <p>연간 1,400만 건의 민원이 디지털로 들어오지만, 민원인은 여전히 어디에 전화해야 할지 모르고\n      담당자의 86%는 특이민원에 시달립니다. 본 시스템은 이 두 위기를 <b>하나의 AI 완충 구조<\/b>로 동시에 풉니다 —\n      민원인에게는 <b>3무(無)의 경험<\/b>을, 담당자에게는 <b>3감(減)의 업무 환경<\/b>을.<\/p>\n      <p>정부의 생성형 AI 민원 혁신 기조, 특이민원 보호 제도 강화, 검증된 실태 데이터가 모두 같은 방향을 가리키고 있습니다.\n      <b>민원 다발 2~3개 부서 대상 4개월 PoC<\/b>로 착수하여 자체 성과 근거를 확보하고, 단계적으로 확산하는 방안의 검토를 건의드립니다.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<div id=\"hostToast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n<footer>\n  <div class=\"wrap\">\n    <b>근거자료<\/b> — 국민권익위원회 민원 빅데이터 분석(2024) · 2025 특이민원 실태조사 · 국민신문고 생성형 AI 서비스 개시 브리핑 ·\n    행정안전부 전자정부서비스 이용실태조사(2024) · AI 정부 서비스 사례집(2026) · 민원처리법 및 시행령(2024.10.29 개정) ·\n    행정안전부 악성민원 방지 및 민원공무원 보호 강화 대책(2024.5.2) · 세종시 AI충녕 · 제천시 AI 민원 응대 시스템 · 서울시 120다산콜재단 운영 실적 ·\n    경기 광주시 GeniusGov · 용인시 AI 보이스봇 · 경북 챗경북 운영 경과 · 개인정보보호위원회 「생성형 AI 개발·활용을 위한 개인정보 처리 안내서」(2025.8)\n    <div class=\"refs\">본 문서의 화면 시안은 구현 방향을 제시하기 위한 예시이며, 표기된 목표치는 PoC 단계에서 자체 데이터로 보정하는 관리 목표입니다.<\/div>\n  <\/div>\n<\/footer>\n\n<scr\ipt>\n/* ═══ PART 06 프로토타입 ↔ 본문 동기화 ═══\n   프레임 내부 스크롤을 제거하고 문서 스크롤 하나로 통일한다. */\n(function(){\n  var frame=document.getElementById('protoFrame');\n  var toast=document.getElementById('hostToast');\n  var timer;\n  if(!frame) return;\n\n  function setH(h){\n    h=Math.max(560,Math.min(6000,Math.round(h)));\n    var cur=parseInt(frame.style.height,10)||0;\n    if(Math.abs(cur-h)<4) return;\n    frame.style.height=h+'px';\n  }\n\n  window.addEventListener('message',function(e){\n    var d=e.data;\n    if(!d||d.civicos===undefined) return;\n    if(d.civicos==='height'){ setH(d.h); return; }\n    if(d.civicos==='align'){\n      var top=frame.getBoundingClientRect().top+window.pageYOffset-86;\n      if(window.pageYOffset>top) window.scrollTo({top:top,behavior:'smooth'});\n      return;\n    }\n    if(d.civicos==='toast'&&toast){\n      toast.innerHTML=d.html;\n      toast.classList.add('show');\n      clearTimeout(timer);\n      timer=setTimeout(function(){toast.classList.remove('show');},2600);\n    }\n  });\n})();\n<\/script>\n\n<scr\ipt>\n// hero tracker fill animation\nwindow.addEventListener('load',()=>{\n  const f=document.getElementById('heroFill');\n  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  if(f){ if(reduce){f.style.transition='none';} requestAnimationFrame(()=>{f.style.width='60%';}); }\n});\n\n// ---- Charts ----\nconst NAVY='#16203a', GOLD='#b8902a', GOLDS='#d9b45c', BLUE='#2f6fed', SUB='#5b6478', RED='#d5453c', GREEN='#1f9d55', AMBER='#d97b06', LINE='#e4dfd4';\nconst gridOpt={color:'#efece4'};\n\nfunction renderFallbackCharts(){\n  const sets={\n    chVolume:{kind:'bar',title:'연간 민원 발생량',labels:['2023 전체','2024 전체','2024 신문고','2025 신문고'],values:[1472.7,1403.8,1222.8,1169.7],unit:'만'},\n    chChannel:{kind:'donut',title:'2024 국민신문고 접수 경로',labels:['직접','홈페이지','이송','서신'],values:[84.6,14.5,0.7,0.2],unit:'%'},\n    chType:{kind:'bar',title:'특이민원 유형별 경험률',labels:['상습·반복','폭언','정보공개 과다','부당요구'],values:[70.9,63.1,56,50],unit:'%'},\n    chHarm:{kind:'bar',title:'특이민원 피해',labels:['업무지연','정신적 스트레스','업무과중','인사문제','감사·고소'],values:[87.9,90.8,55,51.9,23.6],unit:'%'},\n    chKeyword:{kind:'bar',title:'상위 민원 키워드',labels:['불법 주정차','불법 광고물','재개발','교통환경','교육'],values:[100,78,54,49,41],unit:''},\n    chPurpose:{kind:'bar',title:'행정서비스 이용 목적',labels:['발급','신청·접수','세금','예약','문의'],values:[75.8,56.7,50.1,41,38.5],unit:'%'},\n    chKpiCitizen:{kind:'bar',title:'시민 편의 지표 목표',labels:['AI 1차 응답률','1차 해결률','상담 전환율'],values:[88,40,25],unit:'%'},\n    chKpiAdmin:{kind:'bar',title:'행정 효율 지표 목표',labels:['배정 소요','오배정률','초안 작성','응대량'],values:[40,65,60,70],unit:''},\n    chKpiQuality:{kind:'bar',title:'품질·안전 지표 목표',labels:['근거 첨부율','개인정보 탐지','KB 갱신율','분류 정확도'],values:[100,95,90,85],unit:'%'}\n  };\n  Object.entries(sets).forEach(([id,cfg])=>{\n    const canvas=document.getElementById(id);\n    if(!canvas) return;\n    const max=Math.max(...cfg.values,1);\n    const rows=cfg.values.map((v,i)=>{\n      const w=Math.max(4,Math.round((v/max)*78));\n      return `<g transform=\"translate(0 ${54+i*31})\">\n        <text x=\"0\" y=\"12\" font-size=\"11\" fill=\"${SUB}\">${cfg.labels[i]}<\/text>\n        <rect x=\"112\" y=\"1\" width=\"236\" height=\"14\" rx=\"7\" fill=\"#efece4\"/>\n        <rect x=\"112\" y=\"1\" width=\"${w*3}\" height=\"14\" rx=\"7\" fill=\"${i%2?GOLD:NAVY}\"/>\n        <text x=\"360\" y=\"12\" font-size=\"11\" font-weight=\"700\" fill=\"${NAVY}\">${v}${cfg.unit}<\/text>\n      <\/g>`;\n    }).join('');\n    const points=cfg.values.map((v,i)=>`${56+i*74},${174-(v/max)*120}`).join(' ');\n    const lineDots=cfg.values.map((v,i)=>`<circle cx=\"${56+i*74}\" cy=\"${174-(v/max)*120}\" r=\"4\" fill=\"${RED}\"/>`).join('');\n    const donut=cfg.kind==='donut'\n      ? `<circle cx=\"192\" cy=\"126\" r=\"70\" fill=\"none\" stroke=\"${NAVY}\" stroke-width=\"34\"/><circle cx=\"192\" cy=\"126\" r=\"70\" fill=\"none\" stroke=\"${GOLD}\" stroke-width=\"34\" stroke-dasharray=\"64 440\" stroke-dashoffset=\"-374\"/><text x=\"192\" y=\"123\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"${NAVY}\">84.6%<\/text><text x=\"192\" y=\"144\" text-anchor=\"middle\" font-size=\"11\" fill=\"${SUB}\">직접 접수<\/text>`\n      : '';\n    const line=cfg.kind==='line'\n      ? `<polyline points=\"${points}\" fill=\"none\" stroke=\"${RED}\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>${lineDots}<text x=\"18\" y=\"210\" font-size=\"11\" fill=\"${SUB}\">물놀이장 위생 키워드
