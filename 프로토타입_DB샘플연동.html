d2}\n.nas-flow b{display:block;font-family:var(--mono);font-size:10px;color:var(--gold);margin-bottom:5px}\n.nas-flow span{font-size:11.5px;color:var(--sub);line-height:1.45}\n.nas-controls{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px}\n.nas-control{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}\n.nas-control b{display:block;font-size:12px;color:var(--navy);margin-bottom:5px}\n.nas-control span{font-size:11px;color:var(--sub)}\n.nas-note{margin-top:16px;background:#e8effd;border:1px solid #bfd0f2;border-radius:12px;padding:13px 16px;font-size:12.5px;color:#244777}\n.nas-note b{color:var(--blue-d)}\n\n/* effects table */\n.effects td:first-child{font-weight:600}\n.target{font-family:var(--mono);font-weight:700;color:var(--navy);white-space:nowrap}\n.target.good{color:var(--green)}\n\n/* roadmap */\n.road{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}\n.ph{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;position:relative}\n.ph .p-no{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--gold)}\n.ph h4{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--navy);margin:8px 0 4px}\n.ph .term{font-family:var(--mono);font-size:11.5px;color:var(--sub);margin-bottom:14px}\n.ph ul{list-style:none}\n.ph li{font-size:13.5px;color:var(--ink);padding:7px 0 7px 16px;border-top:1px dashed var(--line);position:relative}\n.ph li::before{content:\"\";position:absolute;left:0;top:15px;width:6px;height:6px;border-radius:50%;background:var(--gold)}\n.ph .kpi-line{margin-top:14px;background:#fbf7ec;border-radius:10px;padding:10px 13px;font-size:12px;color:var(--ink)}\n.ph .kpi-line b{color:var(--gold)}\n\n/* conclusion */\n.final{background:var(--navy);color:#e9ecf6;border-radius:18px;padding:46px 44px;margin-top:60px}\n.final .eyebrow{color:var(--gold-soft)}\n.final h2{color:#fff}\n.final p{margin-top:16px;font-size:15.5px;color:#c6cbdc;max-width:820px}\n.final b{color:var(--gold-soft)}\nfooter{padding:44px 0 60px;color:var(--sub);font-size:12.5px}\nfooter .refs{margin-top:10px;line-height:2}\nfooter a{color:var(--sub)}\n/* ---------- PART 07 프로토타입 프레임 (본문 wrap 정렬 · 페이지 스크롤 단일화) ---------- */\n.proto-shell{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 24px 60px -36px rgba(22,32,58,.34)}\n.proto-bar{display:flex;align-items:center;gap:13px;padding:12px 18px;background:#fbfaf6;border-bottom:1px solid var(--line);flex-wrap:wrap}\n.proto-bar .dots{display:flex;gap:6px;flex:none}\n.proto-bar .dots i{width:10px;height:10px;border-radius:50%;display:block}\n.proto-bar .addr{font-family:var(--mono);font-size:11px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:100px;padding:5px 13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.proto-bar .hint{margin-left:auto;font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:6px}\n.proto-bar .hint b{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--gold);border:1px solid #e3d7b4;background:#fbf7ec;border-radius:100px;padding:3px 8px}\n.proto-frame{display:block;width:100%;height:1240px;border:0;background:var(--paper);transition:height .3s ease}\n@media (prefers-reduced-motion:reduce){.proto-frame{transition:none}}\n.proto-cap{font-size:12.5px;color:var(--sub);margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}\n.proto-cap b{color:var(--navy)}\n#hostToast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-size:13.5px;padding:12px 22px;border-radius:100px;box-shadow:0 14px 40px -10px rgba(15,23,41,.55);opacity:0;pointer-events:none;transition:.3s;z-index:999;max-width:92vw;text-align:center}\n#hostToast.show{opacity:1;transform:translateX(-50%) translateY(0)}\n#hostToast b{color:var(--gold-soft)}\n\n/* ---------- 정책 타임라인 (PART 02) ---------- */\n.pol-tl{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:34px}\n.pol-node{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;position:relative;overflow:hidden}\n.pol-node::before{content:\"\";position:absolute;top:0;left:0;right:0;height:3px;background:var(--line)}\n.pol-node.key::before{background:var(--gold)}\n.pol-node small{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--gold)}\n.pol-node h4{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--navy);margin:9px 0 8px;line-height:1.4}\n.pol-node p{font-size:13px;color:var(--sub)}\n\n/* ---------- 심층 사례 카드 (PART 03) ---------- */\n.rcases{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}\n.rcase{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column}\n.rcase .rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}\n.rcase h4{font-size:16px;font-weight:700;color:var(--navy);line-height:1.4}\n.rcase .badge{font-family:var(--mono);font-size:10px;font-weight:700;background:#f4ecd8;color:var(--gold);border-radius:100px;padding:4px 9px;white-space:nowrap;flex:none}\n.rcase .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}\n.rcase .meta span{font-size:11px;color:var(--sub);background:#fbfaf6;border:1px solid var(--line);border-radius:100px;padding:3px 9px}\n.rcase>p{font-size:13px;color:var(--sub);margin-top:12px}\n.rcase>p b{color:var(--navy)}\n.rcase ul{list-style:none;margin-top:12px;display:grid;gap:6px}\n.rcase li{font-size:12.5px;color:var(--ink);padding-left:14px;position:relative}\n.rcase li::before{content:\"\";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold-soft)}\n.rcase .foot{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--navy);font-weight:600}\n\n/* ---------- 공무원 보호 (PART 06) ---------- */\n.twin-col.before{background:linear-gradient(180deg,#fdeceb,#fff 62%)}\n.twin-col.after{background:linear-gradient(180deg,#e9f6ee,#fff 62%)}\n.twin-col.before .t-head .big{color:var(--red)}\n.twin-col.after .t-head .big{color:var(--green)}\n.twin-col .label{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.16em;padding:4px 11px;border-radius:100px;display:inline-block;margin-bottom:13px}\n.before .label{background:#fdeceb;color:var(--red)}\n.after .label{background:#e9f6ee;color:var(--green)}\n.twin-col>p{font-size:13.5px;color:var(--sub);margin-top:4px}\n.sh-list{list-style:none;margin-top:14px}\n.sh-list li{font-size:13.5px;color:var(--ink);padding:10px 0 10px 17px;border-top:1px dashed var(--line);position:relative}\n.sh-list li::before{content:\"\";position:absolute;left:0;top:18px;width:6px;height:6px;border-radius:50%;background:var(--sub)}\n.before .sh-list li::before{background:var(--red)}\n.after .sh-list li::before{background:var(--green)}\n.shield-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}\n.sstep{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px}\n.sstep .no{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px;background:var(--navy);color:#fff;margin-bottom:12px}\n.sstep b{display:block;font-size:14px;color:var(--navy)}\n.sstep p{font-size:12.5px;color:var(--sub);margin-top:6px}\n.sstep .layer{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;border-radius:100px;padding:4px 9px}\n.sstep.l1 .no{background:var(--blue)}.sstep.l1 .layer{background:var(--blue-soft);color:var(--blue)}\n.sstep.l2 .no{background:var(--gold)}.sstep.l2 .layer{background:#f4ecd8;color:var(--gold)}\n.sstep.l3 .no{background:var(--amber)}.sstep.l3 .layer{background:#fdf3e2;color:var(--amber)}\n.sstep.l4 .no{background:var(--red)}.sstep.l4 .layer{background:#fdeceb;color:var(--red)}\n.pill-tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:100px;padding:3px 9px;white-space:nowrap}\n.pill-tag.auto{background:#f4ecd8;color:var(--gold)}\n.pill-tag.team{background:var(--blue-soft);color:var(--blue)}\n.pill-tag.office{background:#fdf3e2;color:var(--amber)}\n.pill-tag.legal{background:#fdeceb;color:var(--red)}\n.blocked{color:var(--red);font-weight:700;font-family:var(--mono);font-size:12.5px}\n\n\n/* ---------- 신규: 교훈 사례 카드 변형 (PART 03) ---------- */\n.rcase.warn{border-color:#eeb3af;background:linear-gradient(180deg,#fdf4f3,#fff 55%)}\n.rcase.warn .badge{background:#fdeceb;color:var(--red)}\n.rcase.warn li::before{background:var(--red)}\n.rcase.warn .foot{color:var(--red)}\n\n/* ---------- 신규: 생애주기 / RAG 단계 변형 (PART 05) ---------- */\n.sstep.ai .no{background:var(--gold)}.sstep.ai .layer{background:#f4ecd8;color:var(--gold)}\n.sstep.gate .no{background:var(--amber)}.sstep.gate .layer{background:#fdf3e2;color:var(--amber)}\n.sstep.man .no{background:var(--navy)}.sstep.man .layer{background:#eceef4;color:var(--navy)}\n.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px}\n.steps5 .sstep{padding:15px 15px 13px}\n.steps5 .sstep b{font-size:13.5px}\n.steps5 .sstep p{font-size:12px}\n\n/* ---------- 신규: 3대 시나리오 (PART 05) ---------- */\n.scens{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}\n.scen{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column}\n.scen .sc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 13px;border-radius:10px;margin-bottom:14px}\n.scen .sc-head b{font-size:15px}\n.scen .sc-head span{font-family:var(--mono);font-size:10.5px;font-weight:700}\n.scen.a .sc-head{background:#e9f6ee;color:var(--green)}\n.scen.b .sc-head{background:var(--blue-soft);color:var(--blue)}\n.scen.c .sc-head{background:#fdf3e2;color:var(--amber)}\n.sc-flow{display:flex;flex-direction:column;align-items:center;gap:4px}\n.sc-flow .s{font-size:12.5px;font-weight:600;background:#fbfaf6;border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;text-align:center;color:var(--ink)}\n.sc-flow .s.end{background:#e9f6ee;border-color:#b9dfc8;color:var(--green);font-weight:700}\n.sc-flow .s.hand{background:var(--blue-soft);border-color:#bfd0f2;color:var(--blue);font-weight:700}\n.sc-flow .s.tr{background:#fdf3e2;border-color:#f0d2a1;color:var(--amber);font-weight:700}\n.sc-flow .ar{color:var(--sub);font-size:12px;line-height:1}\n.sc-note{font-size:12.5px;color:var(--sub);margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}\n\n/* ---------- 신규: 의사결정 흐름 (PART 05) ---------- */\n.decflow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:22px}\n.dfnode{background:#fbfaf6;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:13px;font-weight:700;color:var(--navy);flex:1;min-width:148px}\n.dfnode s{display:block;font-size:11.5px;font-weight:500;color:var(--sub);text-decoration:none;margin-top:4px}\n.dfnode.start{border-left:3px solid var(--sub)}\n.dfnode.ai{border-left:3px solid var(--gold)}\n.dfnode.score{border-left:3px solid var(--blue)}\n.dfstack{display:flex;flex-direction:column;gap:9px;flex:1.2;min-width:168px}\n.dfstack .dfnode{flex:none}\n.dfarrow{color:var(--gold);font-weight:700;font-size:17px;flex:none}\n.dfgate{background:#fdf3e2;border:1.5px solid #e6c47a;border-radius:11px;padding:14px 13px;font-size:13px;font-weight:800;color:var(--amber);text-align:center;flex:none}\n.dfbranch{display:flex;flex-direction:column;gap:9px;flex:1.3;min-width:196px}\n.dfyes,.dfno{font-size:12.5px;font-weight:600;border-radius:10px;padding:11px 12px}\n.dfyes{background:#e9f6ee;color:var(--green);border:1px solid #b9dfc8}\n.dfno{background:#fdeceb;color:var(--red);border:1px solid #eeb3af}\n\n/* ---------- 신규: 4계층 아키텍처 (PART 05) ---------- */\n.arch{display:flex;flex-direction:column;margin-top:22px}\n.alayer{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--sub);border-radius:12px;padding:19px 20px 15px;position:relative;display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.alayer::before{content:attr(data-l);position:absolute;top:-10px;left:16px;font-family:var(--mono);font-size:10.5px;font-weight:700;background:var(--paper);color:var(--sub);padding:2px 9px;border-radius:6px;border:1px solid var(--line);letter-spacing:.04em}\n.alayer.gold{border-left-color:var(--gold)}.alayer.gold::before{color:var(--gold)}\n.alayer.blue{border-left-color:var(--blue)}.alayer.blue::before{color:var(--blue)}\n.alayer.green{border-left-color:var(--green)}.alayer.green::before{color:var(--green)}\n.acomp{font-size:12.5px;font-weight:600;background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:7px 11px;color:var(--ink)}\n.arole{width:100%;font-size:12px;color:var(--sub);margin-top:5px;padding-top:9px;border-top:1px dashed var(--line)}\n.aflow{font-family:var(--mono);font-size:11px;color:var(--gold);text-align:center;padding:8px 0;font-weight:700}\n\n/* ---------- 신규: 3열 패널 그리드 (KPI) ---------- */\n.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}\n.grid3 .panel canvas{max-height:230px}\n\n/* ---------- 지역 맞춤 설계 (PART 09) ---------- */\n.cbf{list-style:none;display:grid;gap:12px;margin-top:20px}\n.cbf li{display:grid;grid-template-columns:38px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;align-items:start}\n.cbf .ico{width:38px;height:38px;border-radius:11px;background:#fbf7ec;color:var(--gold);font-family:var(--mono);font-weight:700;font-size:13px;display:grid;place-items:center}\n.cbf b{font-size:14.5px;color:var(--navy)}\n.cbf small{display:block;font-size:13px;color:var(--sub);margin-top:5px;line-height:1.65}\n\n@media (max-width:960px){\n  nav{overflow:hidden}\n  nav .wrap{max-width:100%;width:100%;flex-wrap:wrap;justify-content:center;overflow-x:hidden}\n  nav a{padding:10px 9px;font-size:12.5px}\n  .stats,.kpis{grid-template-columns:repeat(2,1fr)}\n  .pol-tl,.shield-steps,.steps5{grid-template-columns:repeat(2,1fr)}\n  .scens,.grid3{grid-template-columns:1fr}\n  .decflow{flex-direction:column;align-items:stretch}\n  .dfarrow{transform:rotate(90deg);align-self:center}\n  .alayer{flex-direction:column;align-items:flex-start}\n  .rcases{grid-template-columns:1fr}\n  .cbf li{grid-template-columns:32px 1fr;gap:11px}\n  .proto-bar .hint{margin-left:0;width:100%}\n  .proto-frame{height:1600px}\n  .cases,.road,.mobile-showcase{grid-template-columns:1fr}\n  .twin-col{padding:22px 20px}\n  .screen-system,.page-grid,.page-grid.three,.handoff-grid{grid-template-columns:1fr}\n  .nas-head{grid-template-columns:1fr}\n  .nas-diagram,.nas-controls{grid-template-columns:1fr}\n  .nas-arrow{grid-template-columns:1fr}\n  .nas-flow:not(:last-child)::after{display:none}\n  .persona-head{display:grid;gap:8px}\n  .grid2,.twin,.mock-row,.admin-grid{grid-template-columns:1fr}\n  .admin-grid.three{grid-template-columns:1fr}\n  .panel{min-width:0;overflow:hidden}\n  .panel canvas{width:100%!important;max-width:100%!important}\n  .tbl-wrap table{min-width:100%}\n  .flow-panel svg{min-width:0}\n  .zt{grid-template-columns:1fr}\n  .zt-mid{flex-direction:row}\n  .zt-mid .ai{writing-mode:horizontal-tb}\n  .c-main{grid-template-columns:1fr}\n  .c-side{display:flex;flex-wrap:wrap;overflow:hidden;padding:10px}\n  .c-side .brand{border:none;padding:10px 14px;margin:0}\n  .c-side a{white-space:nowrap}\n  .c-detail{border-left:none;border-top:1px solid #1c2942}\n  .phone{max-width:380px;margin:0 auto}\n  .modern-phone{max-width:360px}\n  .c-metrics,.dept-bays{grid-template-columns:repeat(2,1fr)}\n  .tracker{padding:24px 14px 30px}\n  .tname{font-size:11.5px}\n  .tsub{display:none}\n}\n\n/* ══════ FLOW MOTION — 진행 과정 애니메이션 (AIONICS 스타일) ══════ */\n@media(prefers-reduced-motion:no-preference){\n.fx{opacity:0;transform:translateY(12px)}\n.fx-on .fx{animation:fxIn .62s cubic-bezier(.2,.8,.25,1) forwards;animation-delay:var(--d,0s)}\n@keyframes fxIn{to{opacity:1;transform:none}}\n.fx-draw{stroke-dasharray:var(--len,1);stroke-dashoffset:var(--len,1)}\n.fx-on .fx-draw{animation:fxDraw .85s cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--d,0s)}\n@keyframes fxDraw{to{stroke-dashoffset:0}}\n.fx-arrow{opacity:0}\n.fx-on .fx-arrow{animation:fxIn .4s ease forwards;animation-delay:var(--d,0s)}\n/* 카드 순차 점등 — 파이프라인이 \"구동\"되는 느낌 */\n.fx-hot{filter:drop-shadow(0 0 0 rgba(184,144,42,0));transition:filter .45s ease}\n.fx-hot.hot{filter:drop-shadow(0 0 10px rgba(184,144,42,.75)) drop-shadow(0 0 22px rgba(184,144,42,.35))}\n.fx-hot.hot-b.hot{filter:drop-shadow(0 0 10px rgba(47,111,237,.8)) drop-shadow(0 0 22px rgba(47,111,237,.4))}\n/* HTML 스텝 순차 등장 + 진행 스캔 */\n.fx-step{position:relative;overflow:hidden}\n.fx-step::after{content:\"\";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(184,144,42,.18) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none}\n.fx-on .fx-step.scan::after{animation:fxScan 1.05s cubic-bezier(.4,0,.2,1)}\n@keyframes fxScan{to{transform:translateX(120%)}}\n.fx-live{position:relative}\n.fx-live::before{content:\"\";position:absolute;left:-5px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--gold,#B8902A);transform:translateY(-50%) scale(0);}\n.fx-on .fx-live.live::before{animation:fxPing 1.4s ease-out infinite}\n@keyframes fxPing{0%{transform:translateY(-50%) scale(.6);opacity:1}70%,100%{transform:translateY(-50%) scale(2.6);opacity:0}}\n/* 트래커 */\n.fx-on .tracker .fill{transition:width 1.6s cubic-bezier(.4,0,.2,1)}\n.fx-on .tracker .tstop.now .tdot{animation:fxDot 1.9s ease-in-out infinite}\n@keyframes fxDot{0%,100%{box-shadow:0 0 0 0 rgba(47,111,237,.55)}55%{box-shadow:0 0 0 12px rgba(47,111,237,0)}}\n/* 흐름 화살표 위 이동 패킷 */\n.fx-pk{opacity:.95}\n}\n@media(prefers-reduced-motion:reduce){.fx,.fx-arrow{opacity:1;transform:none}.fx-draw{stroke-dashoffset:0}.fx-pk{display:none}}\n<\/style>\n<\/head>\n<body>\n\n<\!-- ═══════════════ HERO ═══════════════ -->\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <div class=\"doc-type\">SMART CIVIL SERVICE PLATFORM · 통합 도입 기획안 v3.0 · 2026.08<\/div>\n    <h1>AI 기반 스마트 민원 처리 및<br><span class=\"gold\">진행상황 시각화<\/span> 시스템<\/h1>\n    <p class=\"lede\">민원인은 전화하지 않아도 되고, 담당자는 설명하지 않아도 되는 구조 —\n    AI가 앞단에서 접수·필터링을 흡수하고, 뒷단에서 처리 과정을 자동으로 시각화하는\n    양측 만족형 민원 행정 플랫폼을 제안합니다.<\/p>\n    <div class=\"hero-chips\">\n      <div class=\"chip\">연간 민원 <b>1,404만 건<\/b> · 2024<\/div>\n      <div class=\"chip\">담당자 <b>86%<\/b> 특이민원 경험<\/div>\n      <div class=\"chip\">단순·반복 민원 <b>약 15%<\/b> 자동화 가능<\/div>\n      <div class=\"chip\">진행 문의 전화 <b>20~30%↓<\/b> 목표<\/div>\n      <div class=\"chip\">민원처리법 시행령 <b>2024.10.29<\/b> 시행<\/div>\n    <\/div>\n\n    <div class=\"tracker\" aria-label=\"민원 진행상황 다이어그램 예시\">\n      <div class=\"t-label\">\n        <span>LIVE TRACKER · 민원번호 <b>2026-0709-0412<\/b> · 가로등 점멸 신고<\/span>\n        <span>시민에게 이렇게 보입니다<\/span>\n      <\/div>\n      <div class=\"tline\">\n        <div class=\"fill\" id=\"heroFill\"><\/div>\n        <div class=\"tstop done\"><div class=\"tdot\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 13l4 4L19 7\" stroke=\"#16203a\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/div><div class=\"tname\">접수 완료<\/div><div class=\"tsub\">07.09 09:12<\/div><\/div>\n        <div class=\"tstop done\"><div class=\"tdot\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 13l4 4L19 7\" stroke=\"#16203a\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/div><div class=\"tname\">AI 1차 검토<\/div><div class=\"tsub\">07.09 09:12<\/div><\/div>\n        <div class=\"tstop done\"><div class=\"tdot\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 13l4 4L19 7\" stroke=\"#16203a\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/div><div class=\"tname\">부서 배정<\/div><div class=\"tsub\">도로관리과 · 09:14<\/div><\/div>\n        <div class=\"tstop now\"><div class=\"tdot\"><\/div><div class=\"tname\">처리 중<\/div><div class=\"tsub\">현장 확인 예정 07.10<\/div><\/div>\n        <div class=\"tstop pending\"><div class=\"tdot\"><\/div><div class=\"tname\">답변 완료<\/div><div class=\"tsub\">예상 07.15(수)<\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<nav aria-label=\"문서 목차\">\n  <div class=\"wrap\">\n    <a href=\"#p1\">01 민원 실태<\/a>\n    <a href=\"#p2\">02 정책 배경<\/a>\n    <a href=\"#p3\">03 도입 사례<\/a>\n    <a href=\"#p4\">04 솔루션 설계<\/a>\n    <a href=\"#p5\">05 구축 로직<\/a>\n    <a href=\"#p6\">06 공무원 보호<\/a>\n    <a href=\"#p7\">07 화면 구성<\/a>\n    <a href=\"#p8\">08 기대 효과<\/a>\n    <a href=\"#p9\">09 지역 맞춤<\/a>\n    <a href=\"#p10\">10 로드맵<\/a>\n    <a href=\"#p11\">11 범위·확장<\/a>\n  <\/div>\n<\/nav>\n\n<\!-- ═══════════════ PART 01 민원 실태 ═══════════════ -->\n<section id=\"p1\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">PART 01 · 데이터로 보는 민원 실태<\/div>\n    <h2>민원은 \"폭증\"이 아니라 \"상시 대량 유입\",<br>병목은 접수가 아니라 그 이후에 있습니다<\/h2>\n    <p class=\"sec-lede\">국민권익위원회·행정안전부 공개 통계로 검증한 수치입니다. 디지털 접수는 이미 완성 단계 —\n    문제는 분류·배정·과정 설명·특이민원 대응이라는 <b>접수 이후의 수작업 비용<\/b>입니다.<\/p>\n\n    <div class=\"stats\">\n      <div class=\"stat\"><div class=\"num\">1,404<small>만 건<\/small><\/div><div class=\"lab\">2024년 전체 민원 발생량<\/div><div class=\"src\">범정부 민원분석시스템 · 월평균 117만 건<\/div><\/div>\n      <div class=\"stat\"><div class=\"num\">~15<small>%<\/small><\/div><div class=\"lab\">단순·반복형 민원 비중<\/div><div class=\"src\">권익위 추산 · AI 즉시 자동화 가능 영역<\/div><\/div>\n      <div class=\"stat alert\"><div class=\"num\">86<small>%<\/small><\/div><div class=\"lab\">담당자 특이민원 경험률<\/div><div class=\"src\">2025 실태조사 · 393개 기관 1,097명<\/div><\/div>\n      <div class=\"stat alert\"><div class=\"num\">87.9<small>%<\/small><\/div><div class=\"lab\">특이민원發 타 업무 지연<\/div><div class=\"src\">기관 차원 피해 1위 항목<\/div><\/div>\n    <\/div>\n\n    <h3>민원 유입 규모와 경로<\/h3>\n    <div class=\"grid2\">\n      <div class=\"panel\">\n        <div class=\"p-title\">연간 민원 발생량 추이<\/div>\n        <div class=\"p-sub\">범정부 민원분석시스템(전체) vs 국민신문고 접수 · 단위: 만 건<\/div>\n        <canvas id=\"chVolume\" role=\"img\" aria-label=\"연간 민원 발생량 막대 그래프\"><\/canvas>\n        <div class=\"p-note\">2025년 국민신문고는 국가정보자원관리원 화재로 9.26~10.28 서비스가 중단되어 전년과 단순 비교가 어렵습니다.<\/div>\n      <\/div>\n      <div class=\"panel\">\n        <div class=\"p-title\">2024년 국민신문고 접수 경로<\/div>\n        <div class=\"p-sub\">총 1,222.8만 건 기준 · 절대다수가 디지털 직접 유입<\/div>\n        <canvas id=\"chChannel\" role=\"img\" aria-label=\"접수 경로 도넛 차트\"><\/canvas>\n        <div class=\"p-note\">신문고 직접 접수 84.6% + 기관 홈페이지 연계 14.5% = 사실상 전량 디지털. \"AI 1차 대응\"의 기술적 전제가 이미 갖춰져 있습니다.<\/div>\n      <\/div>\n    <\/div>\n\n    <h3>담당자를 소모시키는 특이민원 — AI 필터링의 근거<\/h3>\n    <div class=\"grid2\">\n      <div class=\"panel\">\n        <div class=\"p-title\">특이민원 유형별 경험률<\/div>\n        <div class=\"p-sub\">2025 특이민원 실태조사 · 복수응답 · %<\/div>\n        <canvas id=\"chType\" role=\"img\" aria-label=\"특이민원 유형 가로 막대 그래프\"><\/canvas>\n      <\/div>\n      <div class=\"panel\">\n        <div class=\"p-title\">특이민원으로 인한 피해<\/div>\n        <div class=\"p-sub\">기관 차원 vs 담당자 개인 차원 · %<\/div>\n        <canvas id=\"chHarm\" role=\"img\" aria-label=\"특이민원 피해 가로 막대 그래프\"><\/canvas>\n        <div class=\"p-note\">특이민원은 감정노동 문제를 넘어 <b>조직 전체의 처리 지연(87.9%)<\/b>으로 전이 — 일반 민원인의 피해로 되돌아갑니다.<\/div>\n      <\/div>\n    <\/div>\n\n    <h3>무엇이 반복 유입되는가 — AI 1차 대응의 표적<\/h3>\n    <div class=\"grid2\">\n      <div class=\"panel\">\n        <div class=\"p-title\">2024년 상위 민원 키워드<\/div>\n        <div class=\"p-sub\">민원 빅데이터 1,404만 건 분석 · 상대 비중 지수<\/div>\n        <canvas id=\"chKeyword\" role=\"img\" aria-label=\"상위 민원 키워드 막대 그래프\"><\/canvas>\n        <div class=\"p-note\">불법 주정차·불법 광고물·시설 정비 등 <b>반복성 높은 신고형 민원<\/b>이 상위를 점유합니다.<\/div>\n      <\/div>\n      <div class=\"panel\">\n        <div class=\"p-title\">행정서비스 이용 목적 (2024)<\/div>\n        <div class=\"p-sub\">전자정부서비스 이용실태조사 · 복수응답 · %<\/div>\n        <canvas id=\"chPurpose\" role=\"img\" aria-label=\"행정서비스 이용목적 가로 막대 그래프\"><\/canvas>\n        <div class=\"p-note\">발급·신청·조회·예약 등 <b>판단이 필요 없는 안내형 상호작용<\/b>이 대부분 — AI 즉시 종결의 최적 구간입니다.<\/div>\n      <\/div>\n    <\/div>\n\n    <h3>리서치 수치 검증 결과<\/h3>\n    <div class=\"tbl-outer tbl-wrap\">\n    <table>\n      <thead><tr><th style=\"width:46%\">리서치 수치<\/th><th style=\"width:12%\">검증<\/th><th>근거<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td>2024년 민원 빅데이터 1,404만 건 · 상위 키워드 불법주정차/광고물/재개발/교통환경/교육<\/td><td><span class=\"ok\">일치<\/span><\/td><td>국민권익위 2025.1.24 발표<\/td><\/tr>\n        <tr><td>단순·반복형 민원 약 15% → AI 자동답변 추진<\/td><td><span class=\"ok\">일치<\/span><\/td><td>권익위원장 공식 발언(2022)<\/td><\/tr>\n        <tr><td>특이민원 실태조사: 경험률 86% · 1인당 5.5명 · 유형/피해 세부 수치 전체<\/td><td><span class=\"ok\">일치<\/span><\/td><td>권익위 2025.9 공식 발표<\/td><\/tr>\n        <tr><td>민원처리법 시행령 개정 — 전수녹음·통화 종결·법적대응 지원<\/td><td><span class=\"ok\">확인<\/span><\/td><td>2024.10.29 개정 · AI 증적 기능의 법적 근거<\/td><\/tr>\n        <tr><td>국민신문고 이용기관 1,407개<\/td><td><span class=\"warn\">보완<\/span><\/td><td>공식 확인치는 2024.7 기준 \"1,200개 이상\" — 보수적 수치 사용 권고<\/td><\/tr>\n        <tr><td>연도별 접수 건수 세부 내역(1,222.8만/1,169.7만)<\/td><td><span class=\"warn\">대조 권장<\/span><\/td><td>규모·방향은 정합 · 최종 보고서는 민원 빅데이터 개방시스템 원자료로 확정<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    \n<div style=\"margin-top:44px;border:1px solid #d9b45c;border-radius:16px;overflow:hidden;background:#fffdf6\">\n  <div style=\"padding:14px 22px;background:linear-gradient(90deg,#16203a,#243154);color:#f2eee4;display:flex;align-items:center;gap:12px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.2em;color:#d9b45c\">1.5 · DIFFERENTIATOR<\/span>\n    <b style=\"font-size:16px;font-weight:800\">AI 스마트 민원의 차별성 — 인증은 <u>등록 시점<\/u>에, 질문은 <u>말하듯이<\/u><\/b><\/div>\n  <div style=\"padding:20px 22px\">\n    <p style=\"font-size:15px;line-height:1.75;color:#3b3a36;margin-bottom:18px\">기존 민원 게시판은 <b>본인인증 → 글쓰기 → 담당 부서 배정 → 답변<\/b> 순서라, 구비서류 한 줄이 궁금한 시민도 인증부터 거쳐 게시글을 남기고 며칠을 기다립니다. AI 스마트 민원은 순서를 뒤집습니다. <b>먼저 AI에게 말하듯 물어보고<\/b>, 데이터를 분석한 자료(조례·편람·FAQ·유사 처리 이력)를 근거로 <b>그 자리에서 답변<\/b>합니다. 답변으로 해결되지 않을 때만 민원 내용을 입력하고, “등록하시겠어요?”에 동의하는 <b>그 시점에 인증 절차<\/b>가 시작됩니다.<\/p>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n      <div style=\"border:1px solid #e4dfd4;border-radius:12px;padding:16px;background:#fff\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#8a93a6;margin-bottom:8px\">AS-IS · 기존 민원 게시판<\/div>\n        <ol style=\"margin:0 0 0 18px;font-size:13.5px;line-height:1.9;color:#5b6478\">\n          <li>본인인증(휴대폰·공동인증)<\/li><li>게시판 글쓰기 — 부서·분류 선택<\/li><li>담당 부서 배정 (1~2일)<\/li><li>답변 등록 (평균 5~7일)<\/li><li>단순 문의도 동일 경로 · 담당자 응대 필수<\/li><\/ol><\/div>\n      <div style=\"border:1.5px solid #16203a;border-radius:12px;padding:16px;background:#fff\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#b8902a;margin-bottom:8px\">TO-BE · AI 스마트 민원<\/div>\n        <ol style=\"margin:0 0 0 18px;font-size:13.5px;line-height:1.9;color:#16203a\">\n          <li><b>AI에게 말하듯 질문<\/b> — 인증 없음<\/li><li><b>데이터 분석 기반 즉시 답변<\/b> (근거 출처 병기)<\/li><li>해결됐으면 종결 — 게시판까지 갈 필요 없음<\/li><li>해결되지 않으면 민원 내용 입력 → <b>“등록하시겠어요?” → 인증<\/b><\/li><li>명확한 소관은 담당과 직행 · 판단 필요 건만 민원과 배정<\/li><\/ol><\/div>\n    <\/div>\n    <div style=\"margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n      <div style=\"background:#f7f5f0;border-radius:10px;padding:12px 14px\"><b style=\"display:block;font-size:13px;color:#16203a\">시민 측 간소화<\/b><span style=\"font-size:12.5px;color:#5b6478;line-height:1.6\">인증·부서 선택·게시글 작성이 사라짐. 단순 문의는 30초 안에 해결<\/span><\/div>\n      <div style=\"background:#f7f5f0;border-radius:10px;padding:12px 14px\"><b style=\"display:block;font-size:13px;color:#16203a\">담당자 측 간소화<\/b><span style=\"font-size:12.5px;color:#5b6478;line-height:1.6\">AI 즉시 종결 30~40%가 게시판에 오지 않음 · 남은 건은 분류·요약·양식이 채워진 채 도착<\/span><\/div>\n      <div style=\"background:#f7f5f0;border-radius:10px;padding:12px 14px\"><b style=\"display:block;font-size:13px;color:#16203a\">원칙 유지<\/b><span style=\"font-size:12.5px;color:#5b6478;line-height:1.6\">AI 답변은 근거 안에서만 · 법령·보상·처분은 사람에게 · 등록 후 모든 답변은 결재를 거침<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/div><\/div>\n  <\/div>\n<\/section>\n\n<\!-- ═══════════════ PART 02 정책·제도 배경 ═══════════════ -->\n<section id=\"p2\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">PART 02 · 정책·제도 배경<\/div>\n    <h2>'공무원 개인 응대'에서 '기관 대응'으로 —<br>법·제도는 이미 바뀌었습니다<\/h2>\n    <p class=\"sec-lede\">2024년 10월 29일 시행된 민원처리법·시행령 개정으로 <b>통화 전수녹음, 장시간 통화 종결권, 욕설 포함 문서민원 종결권<\/b>이 확보됐습니다.\n    다만 법령은 민원이 <b>담당자에게 도달한 이후<\/b>를 규율할 뿐, 도달 자체를 줄이지는 못합니다.\n    본 시스템은 그 앞단에 <b>0단계 자동 응대층<\/b>을 놓아 담당자가 처리해야 할 절대량을 먼저 흡수합니다.<\/p>\n\n    <div class=\"pol-tl\">\n      <div class=\"pol-node\">\n        <small>2022 ~ 2023.04<\/small>\n        <h4>민원처리법 1차 개정 시행<\/h4>\n        <p>폭언·폭행 및 반복민원 보호조치 의무를 시행령에서 법률로 격상. 안전장비·안전요원·기관 차원 법적 대응을 의무화.<\/p>\n      <\/div>\n      <div class=\"pol-node\">\n        <small>2024.03 ~ 05<\/small>\n        <h4>김포 사건 · 범정부 종합대책<\/h4>\n        <p>행정안전부가 '악성민원 방지 및 민원공무원 보호 강화 대책(2024.5.2)'을 범정부 종합대책으로 발표.<\/p>\n      <\/div>\n      <div class=\"pol-node key\">\n        <small>2024.10.29<\/small>\n        <h4>민원처리법 시행령 시행<\/h4>\n        <p>통화 시작부터 끝까지 전체 녹음 허용, 장시간 통화·면담 종결권 부여, 욕설·협박 포함 문서민원의 종결 처리 허용.<\/p>\n      <\/div>\n      <div class=\"pol-node\">\n        <small>2025.03 ~ 현재<\/small>\n        <h4>전국 3,934개 기관 실태조사<\/h4>\n        <p>행안부가 시행령 이행 현황을 3,934개 기관 대상으로 조사하고, 부진 기관 맞춤형 컨설팅으로 현장 안착을 점검 중.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"stats\">\n      <div class=\"stat\"><div class=\"num\">5<small>개 항목<\/small><\/div><div class=\"lab\">법률로 격상된 보호조치<\/div><div class=\"src\">안전장비 · 녹음 · 퇴거 · 법적대응 · 치유<\/div><\/div>\n      <div class=\"stat\"><div class=\"num\">3,934<small>개<\/small><\/div><div class=\"lab\">실태조사 대상 기관<\/div><div class=\"src\">2025.3 행안부 점검 · 시행 6개월 후<\/div><\/div>\n      <div class=\"stat\"><div class=\"num\">전수<small> 녹음<\/small><\/div><div class=\"lab\">민원 통화 녹음 범위<\/div><div class=\"src\">폭언 발생 여부와 무관 · 시작~종료 전체<\/div><\/div>\n      <div class=\"stat\"><div class=\"num\">신설<small><\/small><\/div><div class=\"lab\">문서민원 종결권<\/div><div class=\"src\">욕설·협박·모욕·성희롱 상당 포함 시<\/div><\/div>\n    <\/div>\n\n    <div class=\"callout\">\n      <div class=\"mark\">\"<\/div>\n      <p><b>법·제도와 AI의 역할 분담<\/b> — 민원처리법 개정은 \"민원공무원이 홀로 악성민원을 받지 않는다\"는 원칙을 법적으로 확립했고,\n      통화녹음·전담부서·법적 대응이 그 운영 수단입니다. AI 민원 시스템은 그보다 한 단계 앞에서\n      <b>단순·반복·욕설·협박 민원을 사전에 분류·자동 응대·기록 보전해 담당자에게 도달하는 건수 자체를 줄이는 역할<\/b>을 수행합니다.\n      즉 법령은 <b>사후 보호<\/b>, AI는 <b>사전 차단<\/b> — 두 층이 겹칠 때 비로소 보호가 완성됩니다.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ═══════════════ PART 03 국내외 도입 사례 ═══════════════ -->\n<section id=\"p3\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">PART 03 · 국내외 도입 사례<\/div>\n    <h2>정부·지자체·해외가 이미 같은 방향으로 —<br>단, 한 조각이 비어 있습니다<\/h2>\n\n    <div class=\"cases\">\n      <div class=\"case\"><span class=\"tag gov\">중앙정부<\/span><h4>국민신문고 생성형 AI<\/h4><p>답변문 작성 지원·16종 다국어 번역 개통(2025.6). 7대 서비스에 부서 추천·악성민원 탐지 포함.<\/p><div class=\"pt\"><b>시사점<\/b> 정부 스스로 병목을 \"분류·배정·초기응답\"으로 진단 — 본 기획과 정합<\/div><\/div>\n      <div class=\"case\"><span class=\"tag gov\">중앙정부<\/span><h4>정부24+ AI · 기재부 내부 AI<\/h4><p>서비스 이용을 \"검색→대화\"로 전환. 기재부는 직원 1,000명 대상 폐쇄형 생성형 AI 운영(2025.2~).<\/p><div class=\"pt\"><b>시사점<\/b> 자연어 접수의 표준화 + 폐쇄형 구축이라는 안전 운영 모델<\/div><\/div>\n      <div class=\"case\"><span class=\"tag gov\">제도<\/span><h4>특이민원 보호 제도화<\/h4><p>시행령 개정(2024.10)으로 전수녹음·통화 종결·법적대응 지원. 시민상담관 112명, 부처별 로펌 자문.<\/p><div class=\"pt\"><b>시사점<\/b> AI 악성발언 탐지·증적 기능이 법령상 보호조치와 직결<\/div><\/div>\n      <div class=\"case\"><span class=\"tag kr\">서울시<\/span><h4>서울톡 · 아리수톡<\/h4><p>24시간 AI 상담 + 불법주정차 등 현장민원 접수·예약까지 원스톱. 가입자 30만+. 아리수톡은 메뉴형→자연어형 단계 고도화.<\/p><div class=\"pt\"><b>시사점<\/b> 챗봇이 \"접수 창구\"까지 수행 가능 · 점진 확장 경로 검증<\/div><\/div>\n      <div class=\"case\"><span class=\"tag kr\">대구시<\/span><h4>뚜봇 (지자체 최초)<\/h4><p>여권 분야로 시작해 차량등록·축제·시정 전반 확대. 학습데이터 6만 건, 카카오톡 등 멀티채널, 상담→신고 접수 원스톱.<\/p><div class=\"pt\"><b>시사점<\/b> 도메인 단계 확장 + 시민 접점 멀티채널화의 선행 모델<\/div><\/div>\n      <div class=\"case\"><span class=\"tag kr\">경기도<\/span><h4>생성형 AI 행정 플랫폼<\/h4><p>대표 홈페이지 수준에 AI 전면 배치(2024.11 시범→2025.5 정식). 세정봇·교육청 민원상담 챗봇 병행.<\/p><div class=\"pt\"><b>시사점<\/b> 민원 전용을 넘어 기관 대표 채널 단위의 AI 에이전트화<\/div><\/div>\n      <div class=\"case\"><span class=\"tag intl\">싱가포르<\/span><h4>Ask Jamie (GovTech)<\/h4><p>70개 이상 정부 웹사이트에서 활용된 범정부 공통 챗봇.<\/p><div class=\"pt\"><b>시사점<\/b> 공통 엔진 + 기관별 지식베이스 구조의 확장성<\/div><\/div>\n      <div class=\"case\"><span class=\"tag intl\">호주 NSW<\/span><h4>Service NSW \"Eva\"<\/h4><p>웹 문의에 자연어 즉시 응답. AI 투명성 성명으로 운영 원칙 공개.<\/p><div class=\"pt\"><b>시사점<\/b> AI 운영 원칙의 문서화·공개 — 시민 신뢰 장치<\/div><\/div>\n      <div class=\"case\"><span class=\"tag intl\">호주 연방<\/span><h4>Services Australia<\/h4><p>AI 어시스턴트가 정보 탐색·계정 관리·기본 청구 처리 지원.<\/p><div class=\"pt\"><b>시사점<\/b> 성공 열쇠는 \"정답 생성\"이 아니라 빠른 탐색·기본업무 처리·상담 전환<\/div><\/div>\n    <\/div>\n\n    <h3>국내 지자체 심층 사례 — 무엇을, 어떻게 도입했는가<\/h3>\n    <p class=\"sec-lede\">광역·기초 자치단체는 2020년대부터 AI 챗봇·콜봇·법령 분석 AI를 도입해 단순·반복 민원의 자동 응대를 확대해 왔습니다.\n    후발 도입 기관은 검증된 모델을 압축 학습하고 <b>'민원처리법 개정 + 통화 녹음 + 전담부서'<\/b>가 결합된 한 단계 진화한 형태로 설계할 수 있습니다.<\/p>\n\n    <p class=\"proto-cap\" style=\"border-top:none;padding-top:0\"><b>사례에서 얻은 결론<\/b> — AI 민원의 성패는 모델 성능이 아니라\n    ① 지식베이스 최신성 ② 정답셋·근거문서 관리 ③ 현업 피드백 루프 ④ 담당자 AI 리터러시에 달려 있습니다.\n    성공 사례와 실패 사례가 동시에 같은 지점을 가리킵니다.<\/p>\n\n    <div class=\"rcases\">\n      <article class=\"rcase\">\n        <div class=\"rc-head\"><h4>세종특별자치시 AI충녕<\/h4><span class=\"badge\">2025.09 ~<\/span><\/div>\n        <div class=\"meta\"><span>광역 자치단체<\/span><span>다국어 4종<\/span><span>12월 정식 운영<\/span><\/div>\n        <p>2025년 9월 시범 운영을 시작한 광역 단위 AI 챗봇. <b>여권 발급·부서 위치 등 단순 반복 민원<\/b>과 <b>공공시설 예약현황·도서 대출현황 등 실시간 생활 민원<\/b>을 자동 응대합니다.<\/p>\n        <ul>\n          <li>24시간 연중무휴 안내 · 별도 앱 설치 불필요<\/li>\n          <li>한국어·영어·중국어·일본어 다국어 응답<\/li>\n          <li>시범 운영 → 이용자 의견 반영 → 정식 운영의 2단계 전개<\/li>\n          <li>정식 출시 시 체육시설 예약·도서 대출 자동화 확대<\/li>\n        <\/ul>\n        <div class=\"foot\">시사점 — 광역 단위 AI 챗봇 표준 도입 모델. 도청 단위에 직접 벤치마킹 가능<\/div>\n      <\/article>\n\n      <article class=\"rcase\">\n        <div class=\"rc-head\"><h4>제천시 AI 민원 응대 시스템<\/h4><span class=\"badge\">2024.12 ~<\/span><\/div>\n        <div class=\"meta\"><span>충북 시·군<\/span><span>KT클라우드<\/span><span>과기부 공모 선정<\/span><\/div>\n        <p>충북 도내 기초 자치단체 중 첫 사례. <b>과기정통부 '디지털서비스 이용·확산 지원' 공모에 선정되어 클라우드 기반으로 구축<\/b>됐고, 대규모 행사 시 대량 문의의 실시간 동시 응대가 핵심 목적입니다.<\/p>\n        <ul>\n          <li>국제음악영화제 등 대규모 행사 시 민원 폭증 대응<\/li>\n          <li>클라우드 기반 — 자체 인프라 보유 부담 해소<\/li>\n          <li>기존 안내 채널과 병행 운영 (디지털 약자 배제 방지)<\/li>\n          <li>공모 선정 — 국비 매칭으로 초기 도입 비용 절감<\/li>\n        <\/ul>\n        <div class=\"foot\">시사점 — 공통 엔진 + 기관별 지식베이스 분리 모델의 실증 사례<\/div>\n      <\/article>\n\n      <article class=\"rcase\">\n        <div class=\"rc-head\"><h4>옥천군 AI 법률 서비스<\/h4><span class=\"badge\">2026 ~<\/span><\/div>\n        <div class=\"meta\"><span>충북 시·군<\/span><span>새올행정시스템 연계<\/span><span>법령 리스크 관리<\/span><\/div>\n        <p><b>새올행정시스템과 연계한 AI 기반 법률 서비스<\/b>로 민원·정보공개청구·행정쟁송 대응을 지원하는 차세대 모델. 분야별 특화 질의응답 챗봇을 운영해 법령 리스크를 관리합니다.<\/p>\n        <ul>\n          <li>기존 행정 시스템 위에 AI 보조 레이어를 얹는 구조<\/li>\n          <li>민원 응대 + 정보공개청구 답변 + 행정쟁송 대응 통합<\/li>\n          <li>분야별 특화 챗봇 운영 (기간 한정 운용 포함)<\/li>\n          <li>법령 리스크가 큰 인허가·처분성 민원에 강점<\/li>\n        <\/ul>\n        <div class=\"foot\">시사점 — 기존 행정시스템 연계 시 도내 기초 시군 일괄 확산 가능<\/div>\n      <\/article>\n\n      <article class=\"rcase\">\n        <div class=\"rc-head\"><h4>서울시 120다산콜 · 서울톡<\/h4><span class=\"badge\">2020.02 ~<\/span><\/div>\n        <div class=\"meta\"><span>광역 자치단체<\/span><span>7개 채널 통합<\/span><span>가입자 45.8만<\/span><\/div>\n        <p>전국 최대 규모 공공 콜센터 사례. <b>2024년 상반기 전체 상담의 16.7%를 챗봇이 처리<\/b>했고, 보이는 ARS가 전화 상담의 6.4%를 자동 처리했습니다. 응대율 1.5%p 향상, 평균 대기 2.4초 감소.<\/p>\n        <ul>\n          <li>전화·문자·챗봇·앱·수어·외국어·SNS 등 7개 채널 24시간 운영<\/li>\n          <li>'심층 상담은 상담사, 단순 반복은 AI'의 명확한 역할 분담<\/li>\n          <li>보이는 ARS → 실시간 채팅 → 콜봇·빅데이터 분석의 단계적 도입<\/li>\n          <li>AI 도입 후에도 일반전화 상담 유지 — 디지털 약자 배제 방지<\/li>\n        <\/ul>\n        <div class=\"foot\">시사점 — 다채널 통합 + 단계적 고도화 로드맵의 원형<\/div>\n      <\/article>\n\n      <article class=\"rcase\">\n        <div class=\"rc-head\"><h4>대전 중구 AI 음성인식 콜센터<\/h4><span class=\"badge\">2025.06 협약<\/span><\/div>\n        <div class=\"meta\"><span>광역시 자치구<\/span><span>음성인식 + LLM<\/span><span>민·관 협력<\/span><\/div>\n        <p><b>AI 음성인식 콜센터(AICC) 구축, LLM 기반 법령·행정절차·지침 자동 분석, AI 에이전트 기반 민원 챗봇<\/b>을 공동 추진하는 모델. 데이터 제공·연계·기술 지원·실증까지 단계별 협력체계를 구축합니다.<\/p>\n        <ul>\n          <li>음성인식 콜센터 — 전화 민원의 자동 응대층 확보<\/li>\n          <li>LLM 기반 법령·행정절차·지침 자동 분석<\/li>\n          <li>단순 안내를 넘어 실제 민원 처리까지 확장하는 에이전트 설계<\/li>\n          <li>데이터·인프라 지원 → 개발 → 실증 → 후속관리 단계별 진행<\/li>\n        <\/ul>\n        <div class=\"foot\">시사점 — 산학협력·공모형 도입으로 초기 사업비 부담 분산 가능<\/div>\n      <\/article>\n\n      <article class=\"rcase\">\n        <div class=\"rc-head\"><h4>경기 광주시 GeniusGov<\/h4><span class=\"badge\">2026.02 정식<\/span><\/div>\n        <div class=\"meta\"><span>기초 자치단체<\/span><span>챗봇+콜봇+감사검토<\/span><span>도비 5.6억<\/span><\/div>\n        <p>AI 챌린지 선정으로 <b>챗봇·콜봇·AI 감사검토를 하나로 묶은 통합 행정 어시스턴트<\/b>를 구축. 2025년 12월 시범운영 후 2026년 2월 정식 운영에 들어갔습니다.<\/p>\n        <ul>\n          <li>콜봇이 <b>18:00~익일 08:30 당직시간<\/b> 전화를 대신 수신<\/li>\n          <li>불법주정차·동물사체 신고를 전화로 접수해 담당부서 전달<\/li>\n          <li>AI 감사검토까지 포함 — 민원을 넘어 내부 행정으로 확장<\/li>\n          <li>챗 → 콜 → 감사검토의 단계적 통합 순서를 실증<\/li>\n        <\/ul>\n        <div class=\"foot\">시사점 — 야간 당직 자동화가 담당자 보호 효과가 가장 즉각적인 구간<\/div>\n      <\/article>\n\n      <article class=\"rcase\">\n        <div class=\"rc-head\"><h4>경기 용인시 AI 보이스봇<\/h4><span class=\"badge\">야간 상담<\/span><\/div>\n        <div class=\"meta\"><span>기초 자치단체<\/span><span>음성 접수<\/span><span>15개 분야<\/span><\/div>\n        <p>콜센터 업무 종료 후 야간 상담을 보이스봇이 담당합니다. <b>행정·여권·지방세·문화관광·보건복지 등 15개 분야 안내와 포트홀·로드킬·가로등·쓰레기 등 15개 유형 생활불편 신고<\/b>를 음성으로 접수합니다.<\/p>\n        <ul>\n          <li>야간 접수 건은 챗봇과 연계돼 담당부서로 자동 전달<\/li>\n          <li>음성 신고 → 텍스트 구조화 → 부서 이관의 워크플로 확립<\/li>\n          <li>전화만 쓰는 이용자도 배제되지 않는 접근성 설계<\/li>\n          <li>PART 05의 채널 계층 설계에 직접 반영<\/li>\n        <\/ul>\n        <div class=\"foot\">시사점 — 음성 채널을 별도 시스템이 아닌 같은 엔진의 입력으로 처리<\/div>\n      <\/article>\n\n      <article class=\"rcase warn\">\n        <div class=\"rc-head\"><h4>경북 '챗경북' — 실패에서 얻은 교훈<\/h4><span class=\"badge\">교훈 사례<\/span><\/div>\n        <div class=\"meta\"><span>광역 자치단체<\/span><span>생성형 챗봇<\/span><span>이용률 급감<\/span><\/div>\n        <p>전국 지자체 최초 생성형 챗봇으로 출시 첫 달 약 3만 건 질의를 모으며 주목받았으나, <b>정확성·실용성 한계로 이용률이 급감해 9월에는 첫 달의 3% 수준까지 하락<\/b>했습니다.<\/p>\n        <ul>\n          <li>초기 관심은 데이터 정비가 뒷받침되지 않으면 빠르게 식는다<\/li>\n          <li>모델 성능보다 <b>지식베이스 최신성과 근거 제시<\/b>가 체감 품질을 결정<\/li>\n          <li>오답 신고·현업 피드백 루프가 없으면 품질이 개선되지 않는다<\/li>\n          <li>그래서 본 기획은 거대 플랫폼이 아닌 검증 가능한 MVP에서 출발<\/li>\n        <\/ul>\n        <div class=\"foot\">시사점 — 실패 원인이 곧 본 기획의 설계 제약 조건<\/div>\n      <\/article>\n\n      <article class=\"rcase\">\n        <div class=\"rc-head\"><h4>확산 구조 설계 결론<\/h4><span class=\"badge\">설계 결론<\/span><\/div>\n        <div class=\"meta\"><span>후발 도입 이점<\/span><span>비용 대비 효과<\/span><\/div>\n        <p>후발 도입은 오히려 장점이 됩니다. 선행 기관의 시행착오를 우회하고 <b>검증된 기능 위주로 압축 도입<\/b>하면 도입 비용 대비 효과가 가장 큽니다.<\/p>\n        <ul>\n          <li>① 광역 통합 모델(세종) + ② 기초 시군 모델(제천·옥천) + ③ 단계적 고도화(서울)의 결합<\/li>\n          <li>공통 조례 체계·인접 행정 구조 → <b>공통 엔진 + 기관별 지식베이스 분리<\/b>가 최적<\/li>\n          <li>기 구축 자산(클라우드·행정시스템 연계)을 그대로 통합 대상으로 편입<\/li>\n          <li>여기에 본 기획의 <b>진행상황 시각화<\/b>를 더하면 국내 미구현 영역을 선점<\/li>\n        <\/ul>\n        <div class=\"foot\">시사점 — 검증 모델 압축 도입 + 미구현 영역 선점의 이중 전략<\/div>\n      <\/article>\n    <\/div>\n\n    <div class=\"callout\">\n      <div class=\"mark\">\"<\/div>\n      <p>국내외 어느 사례도 <b>민원인이 처리 과정을 단계별로 보는 시각적 프로세스 UX<\/b>를 전면 구현하지 않았습니다.\n      24시간 응대·부서 추천·답변 초안은 이미 검증된 공식 — 여기에 <b>진행상황 자동 시각화<\/b>를 결합하는 것이\n      본 시스템의 차별화이자, 이 페이지 상단에서 보신 트래커가 그 실물입니다.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- ═══════════════ PART 04 솔루션 설계 ═══════════════ -->\n<section id=\"p4\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">PART 04 · 솔루션 설계<\/div>\n    <h2>하나의 AI 완충지대,<br>두 방향의 해방<\/h2>\n    <p class=\"sec-lede\">민원인의 불만(\"어디에 전화하지?\")과 담당자의 소진(\"같은 설명의 반복\")은 같은 원인 —\n    불투명한 프로세스의 완충 역할을 <b>사람이 떠맡는 구조<\/b>에서 나옵니다. AI를 양측 사이의 완충지대로 배치합니다.<\/p>\n\n\n    <div class=\"cases\" style=\"margin-top:30px\">\n      <div class=\"case\"><span class=\"tag kr\">시민 · 도민용<\/span><h4>24시간 쉬운 민원 창구<\/h4>\n        <p>대형폐기물·여권·지방세·복지·교통·환경 등 반복 문의는 즉시 안내하고, 신청 링크·담당부서·준비서류를 함께 제공합니다.<\/p>\n        <div class=\"pt\"><b>채널<\/b> 웹·모바일·카카오톡 · 야간/휴일 콜봇 · 민원실 키오스크<\/div><\/div>\n      <div class=\"case\"><span class=\"tag gov\">담당자용<\/span><h4>민원 업무 보조 콘솔<\/h4>\n        <p>민원을 요약하고 유형·긴급도·담당부서를 추천하며, 조례·편람·공지 근거를 붙인 답변 초안을 생성합니다.<\/p>\n        <div class=\"pt\"><b>핵심<\/b> 반복 민원 군집화 · 부서 추천 사유와 신뢰도 표시 · 주간 이슈 리포트<\/div><\/div>\n      <div class=\"case\"><span class=\"tag intl\">운영 원칙<\/span><h4>AI 1차 + 사람 최종<\/h4>\n        <p>법적 판단·보상·인허가 재량·분쟁성 민원은 AI가 확정 답변하지 않고, 일반 절차 안내 후 담당자 검토로 전환합니다.<\/p>\n        <div class=\"pt\"><b>규칙<\/b> 근거 기반 답변 · 출처와 최종수정일 표시 · 개인정보 탐지/마스킹<\/div><\/div>\n    <\/div>\n\n    <div class=\"buffer\">\n      <svg viewBox=\"0 0 900 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"AI 완충지대 개념도\">\n        <defs>\n          <marker id=\"arw\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3ba\"/><\/marker>\n          <marker id=\"arwG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#b8902a\"/><\/marker>\n          <marker id=\"arwB\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#2f6fed\"/><\/marker>\n        <\/defs>\n        <\!-- citizen -->\n        <rect x=\"20\" y=\"90\" width=\"170\" height=\"120\" rx=\"16\" fill=\"#e8effd\" stroke=\"#bcd0f7\"/>\n        <text x=\"105\" y=\"135\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#16203a\" font-family=\"Pretendard,sans-serif\">민원인<\/text>\n        <text x=\"105\" y=\"160\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5b6478\" font-family=\"Pretendard,sans-serif\">○○시 민원 웹 · 문자 · 콜센터<\/text>\n        <text x=\"105\" y=\"178\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5b6478\" font-family=\"Pretendard,sans-serif\">콜봇 · 방문<\/text>\n        <\!-- AI buffer -->\n        <rect x=\"300\" y=\"34\" width=\"300\" height=\"232\" rx=\"18\" fill=\"#16203a\"/>\n        <rect x=\"300\" y=\"34\" width=\"300\" height=\"4\" fill=\"#b8902a\"/>\n        <text x=\"450\" y=\"66\" text-anchor=\"middle\" font-size=\"12\" letter-spacing=\"4\" fill=\"#d9b45c\" font-family=\"'JetBrains Mono',monospace\">AI BUFFER ZONE<\/text>\n        <rect x=\"322\" y=\"84\" width=\"256\" height=\"56\" rx=\"10\" fill=\"#1e2b4d\" stroke=\"#2a3a63\"/>\n        <text x=\"450\" y=\"107\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\" font-family=\"Pretendard,sans-serif\">앞단 — 24시간 안내 · 접수<\/text>\n        <text x=\"450\" y=\"127\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#9aa6c8\" font-family=\"Pretendard,sans-serif\">단순민원 즉시 종결 · 악성발언 필터·증적<\/text>\n        <rect x=\"322\" y=\"150\" width=\"256\" height=\"56\" rx=\"10\" fill=\"#1e2b4d\" stroke=\"#2a3a63\"/>\n        <text x=\"450\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\" font-family=\"Pretendard,sans-serif\">중단 — 요약 · 스마트 라우팅<\/text>\n        <text x=\"450\" y=\"193\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#9aa6c8\" font-family=\"Pretendard,sans-serif\">요약 카드 · 하이브리드 배정 · 신뢰도 검증<\/text>\n        <rect x=\"322\" y=\"216\" width=\"256\" height=\"34\" rx=\"10\" fill=\"#3a2f16\" stroke=\"#6b5518\"/>\n        <text x=\"450\" y=\"238\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#ffd98a\" font-family=\"Pretendard,sans-serif\">뒷단 — 제로터치 상태 동기화 ★<\/text>\n        <\!-- staff -->\n        <rect x=\"710\" y=\"90\" width=\"170\" height=\"120\" rx=\"16\" fill=\"#f4ecd8\" stroke=\"#e2cf9d\"/>\n        <text x=\"795\" y=\"135\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#16203a\" font-family=\"Pretendard,sans-serif\">담당자<\/text>\n        <text x=\"795\" y=\"160\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5b6478\" font-family=\"Pretendard,sans-serif\">검토 · 판단 · 해결에<\/text>\n        <text x=\"795\" y=\"178\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5b6478\" font-family=\"Pretendard,sans-serif\">역량 집중<\/text>\n        <\!-- arrows -->\n        <line x1=\"192\" y1=\"120\" x2=\"296\" y2=\"120\" stroke=\"#2f6fed\" stroke-width=\"2.5\" marker-end=\"url(#arwB)\"/>\n        <text x=\"244\" y=\"110\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2f6fed\" font-family=\"Pretendard,sans-serif\">자연어 민원<\/text>\n        <line x1=\"296\" y1=\"180\" x2=\"192\" y2=\"180\" stroke=\"#9aa3ba\" stroke-width=\"2.5\" marker-end=\"url(#arw)\"/>\n        <text x=\"244\" y=\"200\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6478\" font-family=\"Pretendard,sans-serif\">즉시 답변 · 진행 시각화<\/text>\n        <line x1=\"604\" y1=\"120\" x2=\"706\" y2=\"120\" stroke=\"#b8902a\" stroke-width=\"2.5\" marker-end=\"url(#arwG)\"/>\n        <text x=\"655\" y=\"110\" text-anchor=\"middle\" font-size=\"11\" fill=\"#b8902a\" font-family=\"Pretendard,sans-serif\">요약 카드 · 배정<\/text>\n        <line x1=\"706\" y1=\"180\" x2=\"604\" y2=\"180\" stroke=\"#9aa3ba\" stroke-width=\"2.5\" marker-end=\"url(#arw)\"/>\n        <text x=\"655\" y=\"200\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6478\" font-family=\"Pretendard,sans-serif\">업무 행위 (결재·일정·협조전)<\/text>\n        <\!-- bottom labels -->\n        <text x=\"105\" y=\"250\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2f6fed\" font-family=\"Pretendard,sans-serif\">\"전화할 필요가 없다\"<\/text>\n        <text x=\"795\" y=\"250\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#b8902a\" font-family=\"Pretendard,sans-serif\">\"설명할 필요가 없다\"<\/text>\n      <\/svg>\n    <\/div>\n\n    <div class=\"twin\">\n      <div class=\"twin-col citizen\">\n        <div class=\"t-head\"><span class=\"big\">3무(無)<\/span><span>민원인의 경험<\/span><\/div>\n        <div class=\"tw-item\"><div class=\"no\">01<\/div><div><h5>부서를 몰라도 된다<\/h5><p>\"우리집 앞 가로등이 깜빡거려요\" — 일상어로 말하면 AI가 소관 부서를 찾아갑니다. 조직도를 아는 것은 시민의 의무가 아닙니다.<\/p><\/div><\/div>\n        <div class=\"tw-item\"><div class=\"no\">02<\/div><div><h5>확인 전화가 필요 없다<\/h5><p>진행상황 트래커가 전화를 대체합니다. 단계 전환마다 문자(SMS) 자동 발송, 배정 즉시 담당 부서·연락처 표시.<\/p><\/div><\/div>\n        <div class=\"tw-item\"><div class=\"no\">03<\/div><div><h5>기다림이 불안하지 않다<\/h5><p>유사 민원 평균 처리일 기반 예상 완료일 제시. \"처리 중\"도 현장 확인 중 / 부서 협의 중 / 답변 검토 중으로 세분화.<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"twin-col staff\">\n        <div class=\"t-head\"><span class=\"big\">3감(減)<\/span><span>담당자의 업무 환경<\/span><\/div>\n        <div class=\"tw-item\"><div class=\"no\">01<\/div><div><h5>1차 감정노동의 감소<\/h5><p>첫 접점을 AI가 맡습니다. 폭언·협박 감지 시 원문 노출 전 경고 태그 + 순화 요약 제공, 발언 증적은 시행령상 법적 대응 근거로 자동 보존.<\/p><\/div><\/div>\n        <div class=\"tw-item\"><div class=\"no\">02<\/div><div><h5>분류·배정 노동의 감소<\/h5><p>전문을 읽는 대신 AI 요약 카드(요지·요청·추천 부서·근거·신뢰도)를 확인·승인. 신뢰도 0.70 미만은 자동 배정하지 않습니다.<\/p><\/div><\/div>\n        <div class=\"tw-item\"><div class=\"no\">03<\/div><div><h5>상태보고 노동의 제로화 ★<\/h5><p>진행 상황을 \"정리\"하지 않습니다. 결재·일정·협조전 등 평소 업무 행위에서 AI가 상태를 추출해 시민용 다이어그램으로 자동 번역합니다.<\/p><\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <h3>전체 아키텍처 — 접수부터 성과관리까지 하나의 흐름<\/h3>\n    <div class=\"flow-panel\">\n      <div class=\"f-title\">스마트 민원 플랫폼 구성도<\/div>\n      <div class=\"f-sub\">접수 채널, AI 처리, 부서 업무, 시각화, 감사·성과관리가 끊기지 않고 연결되어야 반복 문의와 오배정을 함께 줄일 수 있습니다.<\/div>\n      <svg viewBox=\"0 0 920 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"스마트 민원 플랫폼 전체 아키텍처\">\n        <defs><marker id=\"archArrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6.5\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#5b6478\"/><\/marker><\/defs>\n        <g font-family=\"Pretendard,sans-serif\">\n          <rect x=\"18\" y=\"72\" width=\"118\" height=\"94\" rx=\"14\" fill=\"#e8effd\" stroke=\"#bcd0f7\"/>\n          <text x=\"77\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#16203a\">접수 채널<\/text>\n          <text x=\"77\" y=\"126\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5b6478\">신문고 · 홈페이지<\/text>\n          <text x=\"77\" y=\"143\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5b6478\">○○시 민원 웹 · 문자 · 콜센터<\/text>\n\n          <rect x=\"158\" y=\"72\" width=\"118\" height=\"94\" rx=\"14\" fill=\"#fbfaf6\" stroke=\"#e4dfd4\"/>\n          <text x=\"217\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#16203a\">전처리<\/text>\n          <text x=\"217\" y=\"126\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5b6478\">STT · OCR<\/text>\n          <text x=\"217\" y=\"143\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5b6478\">개인정보 마스킹<\/text>\n\n          <rect x=\"298\" y=\"72\" width=\"118\" height=\"94\" rx=\"14\" fill=\"#16203a\"/>\n          <text x=\"357\" y=\"101\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#ffd98a\">AI 1차 대응<\/text>\n          <text x=\"357\" y=\"124\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#9aa6c8\">즉시응답 · 필터<\/text>\n          <text x=\"357\" y=\"141\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#9aa6c8\">특이민원 증적<\/text>\n\n          <rect x=\"438\" y=\"72\" width=\"118\" height=\"94\" rx=\"14\" fill=\"#16203a\"/>\n          <text x=\"497\" y=\"101\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#ffd98a\">스마트 라우팅<\/text>\n          <text x=\"497\" y=\"124\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#9aa6c8\">요약 카드<\/text>\n          <text x=\"497\" y=\"141\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#9aa6c8\">부서 추천 · 신뢰도<\/text>\n\n          <rect x=\"578\" y=\"72\" width=\"118\" height=\"94\" rx=\"14\" fill=\"#f4ecd8\" stroke=\"#e2cf9d\"/>\n          <text x=\"637\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#16203a\">부서 처리<\/text>\n          <text x=\"637\" y=\"126\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#7a6a3c\">검토 · 결재 · 협조전<\/text>\n          <text x=\"637\" y=\"143\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#7a6a3c\">AI 답변 초안<\/text>\n\n          <rect x=\"718\" y=\"72\" width=\"118\" height=\"94\" rx=\"14\" fill=\"#e9f6ee\" stroke=\"#9bd8b4\"/>\n          <text x=\"777\" y=\"103\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1f6f42\">시각화<\/text>\n          <text x=\"777\" y=\"126\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#4a7a5d\">시민 트래커<\/text>\n          <text x=\"777\" y=\"143\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#4a7a5d\">담당자 큐 · 관리자 통계<\/text>\n\n          <path d=\"M136 119 H154\" stroke=\"#5b6478\" stroke-width=\"2\" marker-end=\"url(#archArrow)\"/>\n          <path d=\"M276 119 H294\" stroke=\"#5b6478\" stroke-width=\"2\" marker-end=\"url(#archArrow)\"/>\n          <path d=\"M416 119 H434\" stroke=\"#5b6478\" stroke-width=\"2\" marker-end=\"url(#archArrow)\"/>\n          <path d=\"M556 119 H574\" stroke=\"#5b6478\" stroke-width=\"2\" marker-end=\"url(#archArrow)\"/>\n          <path d=\"M696 119 H714\" stroke=\"#5b6478\" stroke-width=\"2\" marker-end=\"url(#archArrow)\"/>\n\n          <rect x=\"300\" y=\"194\" width=\"520\" height=\"38\" rx=\"10\" fill=\"#fbf7ec\" stroke=\"#e2cf9d\"/>\n          <text x=\"560\" y=\"218\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#16203a\">RAG 지식베이스 · 조례/규칙 · 업무분장표 · 매뉴얼 · FAQ · 과거 답변 · GIS · 법령<\/text>\n          <path d=\"M560 194 C560 176 560 174 560 168\" stroke=\"#b8902a\" stroke-width=\"1.8\" stroke-dasharray=\"4 4\" marker-end=\"url(#archArrow)\"/>\n        <\/g>\n      <\/svg>\n    <\/div>\n\n    <h3>청내 Smart-NAS 기반 온프레미스 AI 구축 구조<\/h3>\n    <p class=\"sec-lede\">첨부한 Smart-NAS 제안의 핵심은 \"자료를 외부로 보내지 않고, 승인된 내부 지식 안에서만 AI가 작동하는 구조\"입니다.\n    이를 민원 시스템에 적용하면 청내망에 민원 지식 저장소와 AI 추론 환경을 두고, 시민 웹에는 공개 가능한 답변과 진행상태만 제공하는 온프레미스 AI 인프라가 됩니다.<\/p>\n    <div class=\"nas-panel\">\n      <div class=\"nas-head\">\n        <div>\n          <h4>청내 Smart-NAS형 온프레미스 AI 인프라<\/h4>\n          <p>청내 자료, 개인정보, 민원 처리 이력은 청내망 Smart-NAS에 보관하고, AI는 권한·정책·감사 로그를 거쳐 승인된 자료만 RAG로 참조합니다.<\/p>\n        <\/div>\n        <div class=\"nas-badge\">ON-PREMISE · ZERO DATA LEAK<\/div>\n      <\/div>\n      <div class=\"nas-body\">\n        <div class=\"nas-map\">\n          <svg viewBox=\"0 0 1040 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"청내 Smart-NAS 기반 온프레미스 AI 네트워크 구조도\">\n            <defs>\n              <marker id=\"nasArr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6.5\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#5b6478\"/><\/marker>\n              <marker id=\"nasArrGold\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6.5\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#b8902a\"/><\/marker>\n              <marker id=\"nasArrBlue\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6.5\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#2f6fed\"/><\/marker>\n              <filter id=\"nasShadow\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"130%\"><feDropS
