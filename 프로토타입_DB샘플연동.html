<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청주시 AI 스마트 민원 — 실동작 프로토타입 v3.0 · PHAROS SOFT</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NotoSerifKR.css');

:root{
  --navy:#16203A; --navy-2:#243154; --navy-3:#33436C;
  --gold:#B8902A; --gold-soft:#FBF3DE; --gold-line:#E6D190;
  --blue:#2F6FED; --blue-soft:#EAF1FE;
  --green:#1F9D55; --green-soft:#E6F6ED;
  --amber:#D97B06; --amber-soft:#FDF1E0;
  --red:#D5453C; --red-soft:#FCEBEA;
  --cj-brown:#5A2D22; --cj-green:#76B62C;
  --ink:#1B2233; --ink-2:#4A5468; --ink-3:#7A8496; --ink-4:#A6AEBD;
  --line:#E3E7EE; --line-2:#EFF2F6; --bg:#F4F6F9; --white:#fff;
  --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,monospace;
  --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;
  --r:12px; --sh:0 1px 2px rgba(22,32,58,.06),0 8px 24px rgba(22,32,58,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:#0E1626;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C8D0DC;border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ───────── 상단 역할 전환 바 ───────── */
.topbar{position:fixed;inset:0 0 auto 0;height:56px;background:linear-gradient(180deg,#101a2e,#0d1526);
  border-bottom:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:18px;padding:0 18px;z-index:120}
.tb-brand{display:flex;align-items:center;gap:9px;color:#fff;white-space:nowrap}
.tb-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(145deg,var(--gold),#8f6d16);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:#1a1405}
.tb-brand b{font-size:13.5px;font-weight:700;letter-spacing:-.2px}
.tb-brand span{font-family:var(--mono);font-size:10px;color:#7C8AA6;letter-spacing:.06em}
.roleswitch{display:flex;gap:4px;background:rgba(255,255,255,.06);padding:4px;border-radius:10px}
.roleswitch button{padding:7px 15px;border-radius:7px;color:#93A0B8;font-size:13px;font-weight:600;transition:.16s;white-space:nowrap}
.roleswitch button:hover{color:#dfe6f2}
.roleswitch button[data-on="1"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sync{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(31,157,85,.6);animation:pulse 2.4s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,85,.55)}70%{box-shadow:0 0 0 8px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
.sync-txt{font-size:11.5px;color:#8D9AB4;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.sync-txt b{color:#E4C877;font-weight:500}
.tb-reset{font-size:11.5px;color:#8D9AB4;border:1px solid rgba(255,255,255,.14);padding:5px 10px;border-radius:7px;flex:none}
.tb-reset:hover{color:#fff;border-color:rgba(255,255,255,.35)}

/* ───────── 스테이지 ───────── */
.stage{position:fixed;inset:56px 0 0 0;overflow:auto}
.stage[data-role="citizen"]{background:
  radial-gradient(900px 500px at 50% -10%,rgba(47,111,237,.16),transparent 60%),#0E1626;
  display:flex;justify-content:center;padding:26px 16px 40px}
.stage[data-role="staff"],.stage[data-role="minwon"],.stage[data-role="admin"]{background:var(--bg)}
.stage[data-role="doc"],.stage[data-role="spec"]{background:var(--bg);overflow:hidden}
.docwrap{display:flex;flex-direction:column;height:calc(100vh - 56px)}
.docbar{height:56px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px}
.docbar .dtitle b{display:block;font-size:14px;font-weight:800;letter-spacing:-.4px}
.docbar .dtitle span{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.docbar .dact{margin-left:auto;display:flex;gap:8px;align-items:center}
.docnav{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:9px 22px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.docnav::-webkit-scrollbar{display:none}
.dchip{flex:none;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:11.5px;color:var(--ink-3);
  display:flex;align-items:center;gap:6px;white-space:nowrap;background:#FAFBFD}
.dchip b{font-family:var(--mono);font-size:10px;color:var(--navy);font-weight:700}
.docframe{flex:1;min-height:0;background:#F7F5F0;overflow-y:auto;overflow-x:hidden;position:relative}
.docload{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-4);font-size:13px}
.dchip{cursor:pointer}
.dchip:hover{border-color:var(--navy);color:var(--navy);background:#fff}

/* ═════════ 시민 웹 (모바일 프레임) ═════════ */
.phonewrap{display:flex;gap:26px;align-items:flex-start}
.phone{width:392px;height:786px;background:#fff;border-radius:34px;box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 9px #1B2536,0 0 0 10px #2C3852;
  display:flex;flex-direction:column;overflow:hidden;position:relative;flex:none}
.p-status{height:26px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:none}
.p-url{height:34px;background:#F1F3F7;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--mono);font-size:11px;color:var(--ink-2);flex:none}
.p-url i{font-style:normal;color:var(--green);font-size:10px}
.p-head{padding:14px 18px 10px;border-bottom:1px solid var(--line-2);flex:none;display:flex;align-items:center;gap:10px}
.p-head h2{font-size:18px;font-weight:800;letter-spacing:-.4px}
.p-head p{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.p-back{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:17px;color:var(--ink-2);margin-left:-6px}
.p-back:hover{background:var(--line-2)}
.p-body{flex:1;overflow-y:auto;overflow-x:hidden;background:#FBFCFD}
.p-tabs{height:62px;border-top:1px solid var(--line);background:#fff;display:grid;grid-template-columns:repeat(5,1fr);flex:none;padding-bottom:2px}
.p-tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--ink-4);font-weight:600}
.p-tabs button i{font-style:normal;font-size:17px;line-height:1}
.p-tabs button[data-on="1"]{color:var(--blue)}
.p-tabs .fab{position:relative}
.p-tabs .fab i{width:44px;height:44px;border-radius:15px;background:var(--blue);color:#fff;display:grid;place-items:center;
  font-size:22px;margin-top:-14px;box-shadow:0 6px 16px rgba(47,111,237,.42)}
.p-tabs .fab span{font-size:10px}

.c-sec{padding:16px 18px}
.c-hello{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.c-lead{margin-top:6px;font-size:21px;font-weight:800;line-height:1.35;letter-spacing:-.6px;cursor:pointer}
.c-lead em{font-style:normal;color:var(--blue);border-bottom:2.5px solid rgba(47,111,237,.28)}
.c-label{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.c-label a{color:var(--blue);font-size:11.5px;cursor:pointer}
.prog-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;gap:13px;align-items:center;cursor:pointer;box-shadow:var(--sh)}
.prog-card:active{transform:scale(.99)}
.ring{width:52px;height:52px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;color:var(--blue);font-weight:700}
.prog-card h4{font-size:14.5px;font-weight:700;letter-spacing:-.3px}
.prog-card p{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.prog-card p b{color:var(--blue);font-weight:600}
.askbar{margin-top:11px;border:1.5px solid var(--blue);border-radius:16px;background:#fff;padding:13px 14px;
  display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 6px 18px rgba(47,111,237,.14);transition:.15s}
.askbar:hover{background:#F7FAFF}
.askbar:active{transform:scale(.99)}
.askbar .ic{width:32px;height:32px;border-radius:11px;background:var(--blue-soft);display:grid;place-items:center;font-size:16px;flex:none}
.askbar .ph{flex:1;min-width:0;font-size:13px;color:var(--ink-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.askbar .ph b{display:block;font-size:11px;color:var(--blue);font-weight:700;margin-bottom:2px}
.askbar .go{flex:none;background:var(--blue);color:#fff;border-radius:11px;padding:9px 13px;font-size:12.5px;font-weight:700;white-space:nowrap}
.askzone{padding:4px 18px 20px;background:linear-gradient(180deg,rgba(47,111,237,0),rgba(47,111,237,.06))}
.askzone .c-lead{margin-top:6px;font-size:19px}
.quickwrap{margin:0 -18px;padding:2px 18px 6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.quickwrap::-webkit-scrollbar{display:none}
.quick{display:flex;gap:8px;width:max-content;padding-bottom:2px}
.quick button{border:1px solid var(--line);border-radius:13px;background:#fff;width:78px;flex:none;padding:12px 4px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.quick button:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.quick i{font-style:normal;font-size:20px}
.svcgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.svcgrid button{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 12px;text-align:left;
  display:flex;flex-direction:column;gap:4px}
.svcgrid button:hover{border-color:var(--blue);background:var(--blue-soft)}
.svcgrid i{font-style:normal;font-size:21px}
.svcgrid b{font-size:13px;font-weight:700}
.svcgrid span{font-size:10.5px;color:var(--ink-4);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;box-shadow:var(--sh)}
.ni{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;position:relative;
  border-bottom:1px solid var(--line-2);transition:background .14s}
.news .ni:last-child{border-bottom:0}
.ni:hover{background:#FAFBFD}
.ni:active{background:#F4F6FA}
.ni-ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px;flex:none;
  background:var(--blue-soft);box-shadow:inset 0 0 0 1px rgba(47,111,237,.1)}
.ni-ic.env{background:#E7F6F1;box-shadow:inset 0 0 0 1px rgba(31,157,85,.12)}
.ni-ic.road{background:var(--amber-soft);box-shadow:inset 0 0 0 1px rgba(217,123,6,.12)}
.ni-tx{flex:1;min-width:0}
.ni-tx b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.3px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.ni-meta{display:flex;align-items:center;gap:6px;margin-top:4px}
.ni-date{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);background:#F1F3F7;border-radius:5px;padding:1px 6px;white-space:nowrap}
.ni-dept{font-size:11px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-go{flex:none;color:#C8D0DC;font-size:16px;line-height:1}
.ni.fresh{background:#F7FAFF}
.ni.fresh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.ni-new{flex:none;background:var(--blue);color:#fff;border-radius:5px;padding:1px 6px;font-size:9.5px;font-weight:700;letter-spacing:.02em}


/* 대화 */
.chat{padding:16px 14px 6px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.bub{max-width:83%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.62}
.bub.ai{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start;box-shadow:var(--sh)}
.bub.me{background:var(--blue);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.bub b{font-weight:700}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-4);animation:bnc 1.2s infinite}
.typing i:nth-child(2){animation-delay:.16s} .typing i:nth-child(3){animation-delay:.32s}
@keyframes bnc{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
.aicard{align-self:stretch;border:1px solid var(--gold-line);background:linear-gradient(180deg,#FFFDF6,#FDF8EA);border-radius:14px;overflow:hidden;animation:rise .32s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.aicard header{padding:9px 13px;border-bottom:1px solid var(--gold-line);display:flex;justify-content:space-between;align-items:center;background:rgba(184,144,42,.08)}
.aicard header b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--gold)}
.aicard header span{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.arow{display:flex;gap:10px;padding:8px 13px;font-size:12.5px;border-bottom:1px dashed rgba(184,144,42,.28)}
.arow:last-of-type{border:0}
.arow dt{width:56px;flex:none;color:var(--gold);font-weight:700;font-size:11.5px;padding-top:1px}
.arow dd{color:#463A18;line-height:1.5}
.aicard footer{display:flex;gap:8px;padding:11px 13px;border-top:1px solid var(--gold-line);background:rgba(255,255,255,.6)}
.cta{width:auto;white-space:nowrap;border-radius:11px;font-size:13.5px;font-weight:700;padding:12px 10px;
  display:flex;align-items:center;justify-content:center;line-height:1.2;flex:1}
.cta.go{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(47,111,237,.3)}
.cta.go:active{transform:scale(.985)}
.cta.edit{border:1px solid var(--line);background:#fff;color:var(--ink-2)}
.cta.edit:hover{border-color:var(--blue);color:var(--blue)}
.cta.next{border:1.5px solid var(--blue);background:#fff;color:var(--blue)}
.cta.next:hover{background:var(--blue-soft)}
.linkbtn{color:var(--blue);font-weight:700;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.editbox{padding:11px 13px;border-top:1px solid var(--gold-line);background:rgba(255,255,255,.7)}
.editbox label{display:block;font-size:11px;font-weight:700;color:var(--gold);margin-bottom:6px}
.editbox textarea{width:100%;min-height:74px;border:1.5px solid var(--blue);border-radius:11px;padding:11px 12px;
  font-size:13.5px;line-height:1.6;outline:none;resize:vertical;background:#fff;font-family:inherit;color:var(--ink)}
.editbox textarea:focus{box-shadow:0 0 0 3px rgba(47,111,237,.13)}
.editbox .ebtns{display:flex;gap:8px;margin-top:9px}
/* 청주 CI 헤더 — 좌: 시민특별시 · 우: 청주시 공식 로고 */
.cihead{display:flex;align-items:center;gap:12px;padding:17px 18px 13px;background:#fff;border-bottom:1px solid var(--line-2)}
.cihead .slogan{flex:1;min-width:0;font-size:25px;font-weight:800;letter-spacing:.16em;color:var(--navy);line-height:1.15;
  padding-left:2px;text-indent:1px}
.cihead .slogan i{font-style:normal;color:var(--cj-green)}
.cihead .logo{height:38px;width:auto;flex:none;display:block}
/* 접수 상세 입력 폼 */
.fform{align-self:stretch;border:1px solid var(--blue);border-radius:15px;background:#fff;overflow:hidden;
  box-shadow:0 6px 20px rgba(47,111,237,.13);animation:rise .3s ease}
.fform>header{padding:11px 14px;background:var(--blue-soft);border-bottom:1px solid #C7DAFB;display:flex;align-items:center;gap:8px}
.fform>header b{font-size:12.5px;font-weight:800;color:#1D4EB0}
.fform>header span{margin-left:auto;font-size:11px;color:#4C6DA8;font-family:var(--mono)}
.ff-hint{padding:10px 14px;background:#FBFCFE;border-bottom:1px solid var(--line-2);font-size:11.5px;color:var(--ink-3);line-height:1.55}
.ff-in{padding:12px 14px;border-bottom:1px solid var(--line-2)}
.ff-in:last-of-type{border-bottom:0}
.ff-in label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.ff-in label i{font-style:normal;font-size:13px}
.ff-in label em{font-style:normal;font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px}
.ff-in label em.must{background:var(--red-soft);color:var(--red)}
.ff-in label em.opt{background:#EEF1F5;color:var(--ink-3)}
.ff-in textarea,.ff-in input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;
  outline:none;font-family:inherit;color:var(--ink);background:#FCFDFE}
.ff-in textarea{min-height:72px;resize:vertical;line-height:1.6}
.ff-in textarea:focus,.ff-in input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.1)}
.ff-in .miss{border-color:var(--red);background:#FFF8F8}
.ff-chips{display:flex;gap:6px;flex-wrap:wrap}
.ff-chips button{border:1px solid var(--line);border-radius:18px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink-2);background:#fff}
.ff-chips button[data-on="1"]{background:var(--blue);border-color:var(--blue);color:#fff}
.ff-file{display:flex;gap:8px;align-items:center;border:1.5px dashed var(--line);border-radius:11px;padding:12px;
  background:#FCFDFE;width:100%;justify-content:center;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.ff-file:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.ff-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.ff-f{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;background:#fff}
.ff-f em{font-style:normal;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ff-f span{font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.ff-f button{color:var(--ink-4);font-size:14px}
.ff-btns{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:#FAFBFD}
.dupe{margin:9px 13px 0;border:1px solid var(--blue);background:var(--blue-soft);border-radius:11px;padding:10px 12px;font-size:12px;color:#1D4EB0}
.dupe b{font-weight:700}
.dupe .dbtns{display:flex;gap:7px;margin-top:9px}
.dupe .dbtns button{flex:1;border-radius:9px;padding:8px;font-size:12px;font-weight:700}
.dupe .yes{background:var(--blue);color:#fff} .dupe .no{background:#fff;border:1px solid #C7DAFB;color:#1D4EB0}
.emg{align-self:stretch;border:1px solid var(--red);background:var(--red-soft);border-radius:14px;padding:13px 14px;animation:rise .3s ease}
.emg b{display:block;font-size:13.5px;color:#9E2A23;font-weight:800;margin-bottom:4px}
.emg p{font-size:12.5px;color:#8E241D;line-height:1.6}

.d-gray{background:#EEF1F5;color:var(--ink-3)}
.newpill{background:var(--blue);color:#fff;border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700;font-family:var(--mono);animation:pulse2 1.6s infinite}
.deptsel{min-width:260px;max-width:100%;padding:9px 34px 9px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;font-weight:600;color:var(--navy)}\n.scope{display:flex;flex-wrap:wrap;gap:3px;background:#EDF0F5;padding:3px;border-radius:9px}
.scope button{padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-3)}
.scope button[data-on="1"]{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.newbar{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border:1px solid #C7DAFB;border-radius:11px;
  padding:11px 14px;margin-bottom:2px;font-size:12.5px;color:#1D4EB0}
.newbar .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse2 1.4s infinite;flex:none}
.newbar b{font-weight:800}
.newbar span{color:#4C6DA8;font-size:11.5px}
.newbar button{margin-left:auto}
.roleswitch button .nb{font-style:normal;background:var(--red);color:#fff;border-radius:9px;padding:1px 6px;font-size:10px;
  font-weight:700;margin-left:6px;font-family:var(--mono);animation:pulse2 1.5s infinite}
@keyframes pulse2{50%{opacity:.55}}

.aisum{border:1px solid var(--gold-line);border-radius:var(--r);background:linear-gradient(180deg,#FFFDF6,#FDFAF0);overflow:hidden}
.aisum header{padding:11px 15px;border-bottom:1px solid var(--gold-line);display:flex;align-items:center;gap:9px;background:rgba(184,144,42,.07)}
.aisum header b{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--gold)}
.aisum header span{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.aisum dl{padding:5px 15px 12px}
.aisum .r{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed rgba(184,144,42,.26);font-size:13px}
.aisum .r:last-child{border:0}
.aisum dt{width:62px;flex:none;font-size:11.5px;color:var(--gold);font-weight:700;padding-top:1px}
.aisum dd{color:#4A3D1A;line-height:1.55}
.confbox{margin:0 15px 14px;background:#fff;border:1px solid var(--gold-line);border-radius:10px;padding:12px 13px}
.confbox .t{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.confbox .t b{font-family:var(--mono);font-size:15px;color:var(--gold)}
.confbox .rs{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.actbar{display:flex;gap:8px;padding:0 15px 15px;flex-wrap:wrap}
.b{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.b:hover{border-color:var(--navy-3);color:var(--navy)}
.b.pri{background:var(--navy);border-color:var(--navy);color:#fff} .b.pri:hover{background:var(--navy-2)}
.b.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.b.gold{background:var(--gold);border-color:var(--gold);color:#231b06}
.b.green{background:var(--green);border-color:var(--green);color:#fff}
.b.red{background:var(--red);border-color:var(--red);color:#fff}
.b.ghostred{border-color:var(--red);color:var(--red)}
.b:disabled{opacity:.42;cursor:not-allowed}
.b.xs{padding:5px 10px;font-size:11.5px}

.log{padding:6px 0}
.logitem{display:flex;gap:11px;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.logitem:last-child{border:0}
.logitem .dt{width:5px;flex:none;position:relative}
.logitem .dt::before{content:"";position:absolute;left:0;top:6px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.logitem.internal .dt::before{background:var(--red)}
.logitem.ai .dt::before{background:var(--gold)}
.logitem h5{font-size:12.5px;font-weight:700}
.logitem .cz{font-size:11.5px;color:var(--blue);margin-top:3px}
.logitem .cz.hid{color:var(--red)}
.logitem time{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-4);white-space:nowrap;flex:none}
.vis{border-radius:5px;padding:1px 6px;font-size:10px;font-weight:700;font-family:var(--mono)}
.vis.pub{background:var(--blue-soft);color:var(--blue)} .vis.int{background:var(--red-soft);color:var(--red)}

.editor{border:1px solid var(--line);border-radius:10px;min-height:250px;padding:16px;font-size:13.5px;line-height:1.9;background:#fff;outline:none;white-space:pre-wrap}
.editor:focus{border-color:var(--blue)}
.appr{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line-2)}
.appr .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--line-2);color:var(--ink-4);flex:none}
.appr.done .st{background:var(--green);color:#fff} .appr.now .st{background:var(--blue);color:#fff}
.appr b{font-size:12.5px} .appr span{font-size:11.5px;color:var(--ink-3)} .appr .rr{margin-left:auto}

.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kcol{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kcol header{padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:800;display:flex;gap:7px;align-items:center}
.kcol .it{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:12.5px;cursor:pointer}
.kcol .it:hover{background:#F7F9FC}
.kcol .it b{display:block;font-weight:700} .kcol .it span{font-size:11px;color:var(--ink-3);font-family:var(--mono)}

.heat{width:100%;border-collapse:separate;border-spacing:3px}
.heat th{background:none;border:0;font-size:11px;padding:4px;text-align:center}
.heat th:first-child{text-align:left;width:118px}
.heat td{border:0;padding:0}
.heat td b{display:block;text-align:center;padding:11px 4px;border-radius:7px;font-family:var(--mono);font-size:12px;font-weight:700;cursor:default}
.h0{background:#E6F6ED;color:#14663A} .h1{background:#FDF1E0;color:#8A4E04}
.h2{background:#FBE3D6;color:#A4441B} .h3{background:#FCEBEA;color:#9E2A23}
.heat .dept{font-size:12.5px;font-weight:600;color:var(--ink-2);padding-left:2px}
.legend{display:flex;gap:14px;margin-top:12px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.tchart{display:flex;gap:5px;align-items:flex-end;padding:10px 2px 0;overflow-x:auto}
.tcol{flex:1;min-width:30px;display:flex;flex-direction:column;align-items:center;gap:5px}
.tbars{display:flex;gap:3px;align-items:flex-end;height:138px;justify-content:center;width:100%}
.tbars b{width:10px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#5A8DF2,var(--blue));transition:height .35s}
.tbars b.d{background:#CBD9F5}
.tcol span{font-size:9.5px;color:var(--ink-4);font-family:var(--mono);white-space:nowrap}
.tcol em{font-family:var(--mono);font-size:10px;font-style:normal;color:var(--ink-2);font-weight:700}
.tcol.hot em{color:var(--blue)}
.lgd{display:flex;gap:14px;font-size:11px;color:var(--ink-3);margin-top:12px;align-items:center}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.catrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.catrow:last-child{border:0}
.catrow .rk{width:20px;font-family:var(--mono);font-size:12px;color:var(--ink-4);font-weight:700}
.catrow .nm{width:150px;flex:none}
.catrow .nm b{font-size:13px;font-weight:700;display:block}
.catrow .nm span{font-size:11px;color:var(--ink-4)}
.catrow .bw{flex:1;min-width:80px}
.catrow .pc{font-family:var(--mono);font-size:12.5px;font-weight:700;width:46px;text-align:right}
.catrow .ct{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:64px;text-align:right}
.catrow .av{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:56px;text-align:right}
.catrow .dl{width:62px;text-align:right}
.hourbar{display:flex;gap:2px;align-items:flex-end;height:74px;margin-top:8px}
.hourbar b{flex:1;border-radius:2px 2px 0 0;background:#D5DEEC}
.hourbar b.pk{background:var(--blue)}
.hourlab{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-4);font-family:var(--mono);margin-top:5px}
/* ── A-11 정책 수립 ── */
.ppipe{display:flex;align-items:stretch;gap:0;padding:4px 0 2px}
.ppipe .pstep{flex:1;position:relative;background:#FAFBFD;border:1px solid var(--line);padding:13px 12px 12px;min-width:0}
.ppipe .pstep:first-child{border-radius:10px 0 0 10px}
.ppipe .pstep:last-child{border-radius:0 10px 10px 0}
.ppipe .pstep+.pstep{border-left:0}
.ppipe .pstep.on{background:var(--gold-soft);border-color:var(--gold-line)}
.ppipe .pstep em{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-4);font-style:normal}
.ppipe .pstep b{display:block;font-size:12.5px;font-weight:800;margin-top:5px;letter-spacing:-.3px}
.ppipe .pstep.on b{color:#5C4A17}
.ppipe .pstep span{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.ppipe .parrow{flex:none;width:16px;display:grid;place-items:center;color:var(--ink-4);font-size:12px}
.prow{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.12s}
.prow:last-child{border:0}
.prow:hover{background:#F7F9FC}
.prow .rk{width:26px;flex:none;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-4)}
.prow .pt{flex:1;min-width:0}
.prow .pt b{font-size:13.5px;font-weight:700;letter-spacing:-.2px;display:block}
.prow .pt .meta{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.prow .cnt2{font-family:var(--mono);font-size:12.5px;font-weight:700;width:62px;text-align:right;flex:none}
.prow .sc{width:104px;flex:none;display:flex;gap:8px;align-items:center}
.prow .sc em{font-family:var(--mono);font-size:11.5px;font-style:normal;font-weight:700;width:24px;text-align:right}
.prow .stt{width:96px;flex:none;text-align:right}
.pdoc{border:1px solid var(--line);border-radius:10px;padding:20px 22px;font-size:13px;line-height:2;background:#FCFCFD;
  white-space:pre-wrap;outline:none;min-height:340px;max-height:560px;overflow:auto}
.pdoc:focus{border-color:var(--blue);background:#fff}
.pdoc-empty{border:1px dashed var(--line);border-radius:10px;min-height:340px;display:grid;place-items:center;text-align:center;
  color:var(--ink-4);font-size:12.5px;line-height:1.9;padding:20px}
.evid{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line-2);font-size:12px}
.evid:last-child{border:0}
.evid .eno{font-family:var(--mono);font-size:10.5px;color:var(--gold);font-weight:700;flex:none;width:22px}
.evid b{font-size:12.5px;font-weight:700;display:block}
.evid span{color:var(--ink-3);display:block;margin-top:2px;line-height:1.6}

/* ── 배정·전달 프로세스 시각화 ── */

.hgrid{display:grid;grid-template-columns:28px repeat(24,1fr);gap:3px;align-items:center}
.hg-h{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);text-align:center}
.hg-d{font-size:11px;font-weight:700;color:var(--ink-3)}
.hg-c{height:20px;border-radius:4px;transition:transform .12s}
.hg-c:hover{transform:scale(1.18);outline:1.5px solid var(--navy)}

.hproc .hp.clk{cursor:pointer;border-radius:10px;padding:6px 2px 4px;transition:background .12s}
.hproc .hp.clk:hover{background:#F3F6FB}
.hproc .hp.cur{background:#EEF3FD;box-shadow:inset 0 0 0 1.5px var(--blue)}

.fq{margin-bottom:12px}
.fq-q,.fq-a,.fq-w{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.7;position:relative}
.fq-q{background:#EEF3FD;border:1px solid #C7DAFB;margin-bottom:6px}
.fq-a{background:#fff;border:1px solid var(--line)}
.fq-w{background:#FDF8EE;border:1px dashed #F0D2A3;color:#8A4E04;font-size:12.5px}
.fq span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#4C6DA8;margin-bottom:4px}
.fq-a span{color:#1F9D55}
.fq time{display:block;font-size:10.5px;color:#8A93A6;margin-top:6px;font-family:var(--mono)}
.hproc{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:2px 0}
.hproc .hp{flex:1;min-width:96px;text-align:center;position:relative}
.hproc .hp i{font-style:normal;width:28px;height:28px;border-radius:50%;background:#EEF1F5;color:var(--ink-4);display:grid;place-items:center;
  font-family:var(--mono);font-size:11.5px;font-weight:700;margin:0 auto 6px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.hproc .hp.done i{background:var(--green);color:#fff;box-shadow:0 0 0 1px var(--green)}
.hproc .hp.now i{background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(47,111,237,.16);animation:pulse2 1.6s infinite}
.hproc .hp b{display:block;font-size:11.5px;font-weight:700;letter-spacing:-.2px}
.hproc .hp.now b{color:var(--blue)} .hproc .hp:not(.done):not(.now) b{color:var(--ink-4)}
.hproc .hp span{display:block;font-size:10px;color:var(--ink-3);margin-top:2px;line-height:1.35;max-width:130px;margin-left:auto;margin-right:auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hproc em{flex:none;width:22px;height:2px;background:var(--line);margin-top:13px}
.fhead{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.fhead div{background:#FAFBFD;padding:10px 14px}
.fhead span{font-size:10.5px;color:var(--ink-3);display:block;margin-bottom:2px}
.fhead b{font-size:13px;font-weight:700}
.finput{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;outline:none;font-weight:600}
.finput:focus{border-color:var(--blue)}
.waitbox{display:flex;gap:14px;align-items:center;background:var(--blue-soft);border:1px solid #C7DAFB;border-radius:11px;padding:14px 16px;color:#1D4EB0;font-size:13px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #C7DAFB;border-top-color:var(--blue);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.modal .chips .chip{cursor:pointer}
.alert{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line-2);align-items:flex-start;cursor:pointer}
.alert:hover{background:#F7F9FC}
.alert .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:none;font-weight:700}
.alert h5{font-size:12.5px;font-weight:700} .alert p{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.alert .tg{margin-left:auto;flex:none}
.spark{display:flex;gap:2px;align-items:flex-end;height:26px}
.spark i{width:7px;background:#C8D3E4;border-radius:2px 2px 0 0} .spark i.hi{background:var(--red)}
.wbar{display:flex;gap:9px;align-items:flex-end;height:130px;padding:10px 4px 0}
.wbar div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.wbar b{width:100%;border-radius:5px 5px 0 0;background:#D5DEEC;position:relative}
.wbar b.hi{background:linear-gradient(180deg,#E86A60,var(--red))}
.wbar span{font-size:10.5px;color:var(--ink-4);font-family:var(--mono)}
.wbar em{font-family:var(--mono);font-size:10.5px;font-style:normal;color:var(--ink-2);font-weight:700}
.stagebar{display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:8px}
.stagebar div{flex:1;text-align:center}
.stagebar b{display:block;background:#D5DEEC;border-radius:5px 5px 0 0;margin-bottom:6px}
.stagebar b.hot{background:var(--red)}
.stagebar span{font-size:11px;color:var(--ink-3)} .stagebar em{font-family:var(--mono);font-size:11px;font-style:normal;display:block;color:var(--ink-2);font-weight:700}

.toggle{display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line-2)}
.toggle:last-child{border:0}
.toggle b{font-size:13px;font-weight:600} .toggle p{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.sw{margin-left:auto;width:42px;height:24px;border-radius:14px;background:#CFD6E1;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[data-on="1"]{background:var(--green)} .sw[data-on="1"]::after{left:21px}
.slider{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line-2)}
.slider input[type=range]{flex:1;accent-color:var(--gold)}
.slider .val{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--gold);width:52px;text-align:right}
.warnbar{background:var(--red-soft);border:1px solid #F2C9C6;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#8E241D;display:flex;gap:9px;align-items:flex-start}
.warnbar b{font-weight:800}
.goldbar{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:12px 14px;font-size:12.5px;color:#5C4A17;line-height:1.6}
.bluebar{background:var(--blue-soft);border:1px solid #C7DAFB;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#1D4EB0;line-height:1.6}
.sig{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff}
.sig b{font-size:12.5px;font-weight:700;display:block} .sig p{font-size:11px;color:var(--ink-3);margin-top:2px}
.sig .n{font-family:var(--mono);font-size:19px;font-weight:700;float:right;margin-top:-4px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:600;background:#fff;color:var(--ink-2)}
.chip[data-on="1"]{background:var(--navy);border-color:var(--navy);color:#fff}
.mask{filter:blur(4.5px);user-select:none}

/* 모달 · 토스트 */
.modal{position:fixed;inset:0;background:rgba(10,16,28,.55);backdrop-filter:blur(3px);z-index:200;display:grid;place-items:center;padding:20px;animation:fade .18s}
.modal .box{background:#fff;border-radius:16px;width:100%;max-width:460px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.modal header h3{font-size:15px;font-weight:800}
.modal .in{padding:18px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.modal footer{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#FAFBFD}
.sheetwrap{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end;
  background:rgba(15,22,36,.42);backdrop-filter:blur(1.5px);animation:fade .18s}
.sheet{background:#fff;border-radius:22px 22px 0 0;padding:16px 18px 18px;max-height:80%;overflow-y:auto;
  animation:sheetup .28s cubic-bezier(.2,.85,.25,1);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@keyframes sheetup{from{transform:translateY(101%)}to{transform:none}}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:#DDE3EC;margin:0 auto 14px}
.sheet h3{font-size:17px;font-weight:800;letter-spacing:-.5px;line-height:1.35}
.sheet .stags{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.sheet .sbody{font-size:13.5px;line-height:1.75;color:var(--ink-2);margin-top:13px}
.sheet .sbody b{color:var(--ink)}
.sheet .sbtns{display:flex;gap:8px;margin-top:18px}

ox-shadow:0 0 0 0 rgba(93,140,255,0)}}\n.tname{font-size:13.5px;font-weight:700;color:#e8ebf5;text-align:center}\n.tsub{font-family:var(--mono);font-size:10.5px;color:#8f99b6;text-align:center}\n.tstop.pending .tname{color:#6d7590}\n@media (prefers-reduced-motion:reduce){.tstop.now .tdot{animation:none}.tline .fill{transition:none}}\n\n/* ---------- NAV ---------- */\nnav{position:sticky;top:0;background:rgba(247,245,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:50}\nnav .wrap{display:flex;gap:4px;overflow-x:auto;padding:0 20px}\nnav a{font-size:13px;font-weight:600;color:var(--sub);text-decoration:none;padding:14px 10px;white-space:nowrap;border-bottom:2.5px solid transparent}\nnav a:hover,nav a:focus-visible{color:var(--navy);border-color:var(--gold)}\nnav a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}\n\n/* ---------- SECTIONS ---------- */\nsection{padding:84px 0 30px}\n.eyebrow{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.26em;color:var(--gold);margin-bottom:14px}\nh2{font-family:var(--serif);font-weight:900;font-size:clamp(24px,3.2vw,34px);color:var(--navy);line-height:1.35;letter-spacing:-.01em}\n.sec-lede{margin-top:14px;max-width:720px;color:var(--sub);font-size:16px}\nh3{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--navy);margin:52px 0 18px;display:flex;align-items:center;gap:10px}\nh3::before{content:\"\";width:22px;height:3px;background:var(--gold);border-radius:2px;flex:none}\n\n/* stat cards */\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:38px}\n.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 22px;position:relative;overflow:hidden}\n.stat::before{content:\"\";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}\n.stat.alert::before{background:var(--red)}\n.stat .num{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--navy);line-height:1.1}\n.sta
