,grid:gridOpt,angleLines:{color:'#efece4'},pointLabels:{font:{size:10}},ticks:{display:false}}}}\n});\n\n}else{\n  renderFallbackCharts();\n}\n\n<\/script>\n\n<scr\ipt>\n/* ══════ FLOW MOTION RUNTIME ══════ */\n(function(){\n  var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  var SVGNS='http://www.w3.org/2000/svg';\n  function isCard(r){ var w=+r.getAttribute('width'), h=+r.getAttribute('height'); return w>=56 && h>=28; }\n  function seqDelay(el,i,step,base){ el.style.setProperty('--d',((base||0)+i*(step||0.075))+'s'); }\n\n  /* ---- SVG 자동 계측 ---- */\n  function instrumentSVG(svg, host){\n    if(svg.__fx) return; svg.__fx=1;\n    var nodes=[], cards=[], lines=[];\n    var gs=svg.querySelectorAll('g');\n    var scan=(gs.length?gs:[svg]);\n    Array.prototype.forEach.call(scan,function(g){\n      Array.prototype.forEach.call(g.children,function(el){\n        var tag=el.tagName.toLowerCase();\n        if(tag==='defs'||tag==='marker'||tag==='style') return;\n        if(tag==='path'||tag==='line'||tag==='polyline'){\n          var st=el.getAttribute('stroke')||''; var fl=el.getAttribute('fill');\n          if(st && (!fl||fl==='none')){ lines.push(el); return; }\n        }\n        if(tag==='rect' && isCard(el)) cards.push(el);\n        nodes.push(el);\n      });\n    });\n    /* 카드·텍스트 순차 등장 */\n    nodes.forEach(function(el,i){ el.classList.add('fx'); seqDelay(el,i,0.03,0.05); });\n    /* 연결선 그리기 */\n    lines.forEach(function(el,i){\n      var len=0; try{ len=el.getTotalLength(); }catch(e){ len=0; }\n      if(len>0){ el.classList.add('fx-draw'); el.style.setProperty('--len',len); }\n      else el.classList.add('fx-arrow');\n      seqDelay(el,i,0.12,0.35);\n    });\n    /* 카드 점등 사이클 */\n    cards.sort(function(a,b){ return (+a.getAttribute('x'))-(+b.getAttribute('x')) || (+a.getAttribute('y'))-(+b.getAttribute('y')); });\n    cards.forEach(function(c){ c.classList.add('fx-hot'); if((c.getAttribute('fill')||'').match(/#(16203a|1e2b4d|0f1729|243154)/i)) c.classList.add('hot-b'); });\n    svg.__cards=cards;\n    /* 이동 패킷 — 연결선을 따라 흐르는 점 */\n    if(!RM) lines.forEach(function(el,i){\n      var d=el.getAttribute('d'); var len=0; try{ len=el.getTotalLength(); }catch(e){}\n      var pk=document.createElementNS(SVGNS,'circle');\n      pk.setAttribute('r','3.4'); pk.setAttribute('fill', el.getAttribute('stroke')||'#B8902A');\n      pk.setAttribute('class','fx-pk'); pk.setAttribute('opacity','0');\n      var mo=document.createElementNS(SVGNS,'animateMotion');\n      mo.setAttribute('dur','1.5s'); mo.setAttribute('begin', (1.1+i*0.18)+'s;'+'am'+i+'.end+2.2s'); mo.setAttribute('id','am'+i); mo.setAttribute('fill','remove');\n      if(d){ var mp=document.createElementNS(SVGNS,'mpath'); if(!el.id) el.id='fxl'+Math.random().toString(36).slice(2,7);\n             mp.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+el.id); mo.appendChild(mp); }\n      else {\n        var x1=el.getAttribute('x1'),y1=el.getAttribute('y1'),x2=el.getAttribute('x2'),y2=el.getAttribute('y2');\n        if(x1==null) return; mo.setAttribute('path','M'+x1+','+y1+' L'+x2+','+y2);\n      }\n      var op=document.createElementNS(SVGNS,'animate');\n      op.setAttribute('attributeName','opacity'); op.setAttribute('values','0;1;1;0'); op.setAttribute('keyTimes','0;.12;.8;1');\n      op.setAttribute('dur','1.5s'); op.setAttribute('begin', (1.1+i*0.18)+'s;'+'am'+i+'.end+2.2s');\n      pk.appendChild(mo); pk.appendChild(op);\n      el.parentNode.appendChild(pk);\n    });\n  }\n  function runCards(svg){\n    var cards=svg.__cards; if(!cards||!cards.length||RM) return;\n    var i=0, cyc=0; if(svg.__timer) return;\n    svg.__timer=setInterval(function(){\n      cards.forEach(function(c){ c.classList.remove('hot'); });\n      cards[i%cards.length].classList.add('hot');\n      i++; if(i%cards.length===0){ cyc++; if(cyc>=3){ clearInterval(svg.__timer); svg.__timer=null; setTimeout(function(){ cards.forEach(function(c){ c.classList.remove('hot'); }); },700); } }\n    }, 760);\n  }\n\n  /* ---- HTML 스텝 계측 ---- */\n  var STEP_SEL='.sc-flow .s, .steps5 .sstep, .flow-chain .fc, .ba-row .bx, .chain .cx, .pipe .p, .tstop, .stepbox, .chip, .fbox, .process-step, .flow-node, .shield-step, .channel-card, .cb-card, .kpi-card, .card3 > div, .grid3 > div';\n  function instrumentHTML(host){\n    if(host.__fx) return; host.__fx=1;\n    var els=host.querySelectorAll(STEP_SEL);\n    if(!els.length) els=host.querySelectorAll(':scope > div > div');\n    Array.prototype.forEach.call(els,function(el,i){ el.classList.add('fx','fx-step'); seqDelay(el,i,0.09,0.05); });\n    host.__steps=els;\n  }\n  function runHTML(host){\n    var els=host.__steps; if(!els||RM) return;\n    var arr=Array.prototype.slice.call(els); var i=0;\n    setTimeout(function(){\n      if(host.__timer) return;\n      var cyc=0;\n      host.__timer=setInterval(function(){\n        arr.forEach(function(e){ e.classList.remove('scan','live'); });\n        var e=arr[i%arr.length]; if(e){ e.classList.add('scan'); e.classList.add('live'); }\n        i++; if(i%arr.length===0){ cyc++; if(cyc>=3){ clearInterval(host.__timer); host.__timer=null; setTimeout(function(){ arr.forEach(function(e){ e.classList.remove('scan','live'); }); },900); } }\n      }, 880);\n    }, 400+arr.length*90);\n  }\n\n  /* ---- 트래커 ---- */\n  function runTracker(host){\n    var fill=host.querySelector('.fill'); if(!fill) return;\n    var w=fill.style.width||'60%'; fill.style.width='0%';\n    setTimeout(function(){ fill.style.width=w; }, 260);\n    var stops=host.querySelectorAll('.tstop');\n    Array.prototype.forEach.call(stops,function(el,i){ el.classList.add('fx'); seqDelay(el,i,0.22,0.15); });\n  }\n\n  var SEL=['.flow-panel','.tracker','.scens','.steps5','.buffer','.nas-map','.zt','.zt-mid','.arch','.dia','.pipe4','.decide','.process','.mini-flow','.shield-steps','.channel-grid','.cb-grid','.kpi-cards','.signal-grid','.roadmap','.work-card','.real-case-grid'];\n  function collect(root){\n    var out=[];\n    SEL.forEach(function(s){ Array.prototype.forEach.call(root.querySelectorAll(s),function(e){ if(out.indexOf(e)<0) out.push(e); }); });\n    /* svg를 감싼 블록도 대상 */\n    Array.prototype.forEach.call(root.querySelectorAll('svg'),function(sv){\n      var p=sv.parentElement; var k=0;\n      while(p&&k<3){ if(out.indexOf(p)>=0) return; p=p.parentElement; k++; }\n      var host=sv.parentElement; if(host&&out.indexOf(host)<0) out.push(host);\n    });\n    return out;\n  }\n  function boot(root){\n    var hosts=collect(root);\n    hosts.forEach(function(h){\n      var svgs=h.querySelectorAll('svg');\n      Array.prototype.forEach.call(svgs,function(sv){ if(sv.querySelectorAll('rect,path,line,text').length>3) instrumentSVG(sv,h); });\n      if(h.classList.contains('tracker')) { /* 별도 */ }\n      else if(!svgs.length || h.classList.contains('scens')||h.classList.contains('steps5')) instrumentHTML(h);\n    });\n    var io=(typeof IntersectionObserver!=='undefined')?new IntersectionObserver(function(es){\n      es.forEach(function(e){\n        if(!e.isIntersecting) return;\n        var h=e.target; h.classList.add('fx-on'); io.unobserve(h);\n        Array.prototype.forEach.call(h.querySelectorAll('svg'),function(sv){ setTimeout(function(){ runCards(sv); }, 1300); });\n        if(h.classList.contains('tracker')) runTracker(h); else runHTML(h);\n      });\n    },{threshold:.22}):null;\n    hosts.forEach(function(h){ if(h.__io) return; h.__io=1; if(io) io.observe(h); else { h.classList.add('fx-on'); if(h.classList.contains('tracker')) runTracker(h); else runHTML(h); } });\n    /* 안전장치 — 관찰이 발동하지 않아도 3초 뒤 반드시 표시 */\n    setTimeout(function(){ hosts.forEach(function(h){ if(!h.classList.contains('fx-on')){ h.classList.add('fx-on'); if(h.classList.contains('tracker')) runTracker(h); else runHTML(h);\n      Array.prototype.forEach.call(h.querySelectorAll('svg'),function(sv){ setTimeout(function(){ runCards(sv); },900); }); } }); }, 3000);\n  }\n  function rootEl(){ try{ if(typeof __r!=='undefined' && __r && __r.querySelectorAll) return __r; }catch(e){}\n    try{ if(document && document.querySelectorAll) return document; }catch(e){} return null; }\n  function ready(){ var r=rootEl(); if(!r) return; try{ boot(r); }catch(e){} }\n  ready(); setTimeout(ready,60); setTimeout(ready,400);\n  try{ window.__flowBoot=boot; }catch(e){}\n})();\n<\/script>\n<\/body>\n<\/html>\n";

까”가 아니라 <b>“프로토타입에서 동작하는 것을 운영 시스템으로 옮기려면 무엇을 정확히 구현해야 하는가”<\/b>를 적습니다. 화면 요소·상태·문구는 프로토타입을 기준으로 고정하며, 개발팀은 이 문서와 프로토타입을 함께 열어 대조하며 구현합니다.<\/p><div class=\"g4\"><div class=\"stat\"><div class=\"n\">6<small>탭<\/small><\/div><div class=\"l\">역할<\/div><div class=\"s\">문서 2 · 시민 · 민원과 · 담당자 · 관리자<\/div><\/div><div class=\"stat b\"><div class=\"n\">41<small>화면<\/small><\/div><div class=\"l\">화면 수<\/div><div class=\"s\">C 13 · M/S 11 · D 5 · A 15 (A-12·A-14 상세 포함)<\/div><\/div><div class=\"stat g\"><div class=\"n\">18<small>경로<\/small><\/div><div class=\"l\">교차 연동<\/div><div class=\"s\">역할 간 실시간 반영<\/div><\/div><div class=\"stat\"><div class=\"n\">38<\/div><div class=\"l\">API<\/div><div class=\"s\">REST · 이벤트 기반<\/div><\/div><\/div><h3>0.1 전달물<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:110px\">구분<\/th><th>내용<\/th><th style=\"width:200px\">비고<\/th><\/tr><\/thead><tbody><tr><td>참조 구현<\/td><td><code>청주시_AI스마트민원_실동작_프로토타입.html<\/code> — 단일 파일, 외부 의존 없음(Chart.js는 기획안 문서 내 차트 전용)<\/td><td>모든 화면·상태·문구의 기준<\/td><\/tr><tr><td>본 문서<\/td><td>개발 기획안 v4.0 — 데이터 모델·상태·API·인수 기준<\/td><td>구현 계약<\/td><\/tr><tr><td>시나리오 라이브러리<\/td><td>프로토타입 상단 🧪 시나리오 14종 + 전체 자동 검증<\/td><td>인수 테스트 케이스로 그대로 사용<\/td><\/tr><tr><td>기관 설정<\/td><td><code>ORG<\/code>·<code>TAXO<\/code>·<code>NONJUR<\/code>·<code>SEASON/PERIOD/REGION<\/code> 등 기관별 데이터 블록<\/td><td>운영 DB 초기 데이터로 이관<\/td><\/tr><\/tbody><\/table><\/div><h3>0.2 읽는 법<\/h3><div class=\"note gold\"><b>참조 구현 열<\/b>에 적힌 <code>함수명<\/code>은 프로토타입 스크립트 내 함수입니다. 동작이 불명확하면 해당 함수를 읽으면 됩니다. 상태값·태그 문구는 <b>그대로<\/b> 사용하고, 문구 변경은 §10 알림 규칙표를 단일 원천으로 관리합니다.<\/div><\/div><\/section>\n<section id=\"s1\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 01 · ARCHITECTURE<\/div><h2>한 개의 민원 레코드, 여섯 개의 창<\/h2><p class=\"lede\">프로토타입은 단일 상태 객체 <code>S<\/code>를 모든 화면이 공유하며, 운영 시스템은 이를 <b>단일 민원 DB + 이벤트 스트림<\/b>으로 옮깁니다.<\/p><pre><b>[ 시민 웹 · 모바일 ]<\/b>  minwon.cheongju.go.kr         <b>[ 청내망 콘솔 ]<\/b>  민원과 · 담당자 · 관리자\n   │ 접수 대화 / 폼 / 트래커 / 답변서 / 문자             │ 큐 · 배정 · 위저드 · 결재 · 통계 · 정책\n   ▼                                                    ▼\n<u>API Gateway<\/u> (REST + SSE 이벤트) ── 인증(휴대폰 본인인증 · 청내망 SSO) ── 감사 로그\n   │\n   ├─ <i>Case Service<\/i>        민원 CRUD · 상태 전이 · 이벤트(ev) · 프로세스(proc/dproc)\n   ├─ <i>AI Pipeline<\/i>         마스킹 → 긴급 판정 → 분류(TAXO 스코어링) → 라우팅 → 중복 탐지 → 안내(tip) → 폼 스펙\n   │                            RAG 답변 초안 · 문의 템플릿 · 업무 양식 생성 · 정책 초안\n   ├─ <i>Assignment Service<\/i>  자동 배정 · 민원과 배정 · 보좌관 판단 · 양식 전달/열람 · 반려/재배정\n   ├─ <i>Workflow Service<\/i>    담당자 7단계 위저드 · 협조 · 기한 연장 · 결재(기안/검토/전결)\n   ├─ <i>Notification<\/i>        이벤트 → 시민 문구 번역 → SMS(서명 토큰 링크)\n   ├─ <i>Analytics<\/i>           통계(일/주/월) · 분류 11축 · 자동 배정 정확도 · 정책 후보 도출\n   └─ <i>Protection<\/i>          특이민원 시그널 8종 · 순화 요약 · 발생보고서 · 보호 관제\n<\/pre><h3>1.1 기술 스택 권고<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:90px\">계층<\/th><th>권고<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>프론트<\/td><td>React 18 + TypeScript (SPA 2종: 시민 웹 · 콘솔) · 상태는 서버 이벤트 구독<\/td><td>프로토타입의 <code>render()<\/code> 전체 재렌더 → 컴포넌트 단위 갱신으로 전환<\/td><\/tr><tr><td>백엔드<\/td><td>Node.js(NestJS) 또는 Spring Boot · REST + SSE<\/td><td>이벤트 스트림으로 6개 창 동기화<\/td><\/tr><tr><td>DB<\/td><td>PostgreSQL (cases · events · forms · specials · policies) + pgvector(RAG)<\/td><td>JSONB로 <code>sum<\/code>·<code>form<\/code> 등 유연 필드<\/td><\/tr><tr><td>AI<\/td><td>LLM API(분류·요약·초안) + 규칙 엔진(TAXO 스코어링은 결정론) + 임베딩(중복·군집)<\/td><td>분류 결과의 재현성 확보<\/td><\/tr><tr><td>SMS<\/td><td>기관 SMS 게이트웨이 · 서명 토큰(7일) 링크<\/td><td>C-08 규칙<\/td><\/tr><tr><td>배포<\/td><td>온프레미스(청내망) · 시민 웹은 DMZ<\/td><td>원칙④ 보안<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section>\n<section id=\"s2\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 02 · DATA MODEL<\/div><h2>민원 레코드는 하나, 관점은 셋<\/h2><p class=\"lede\"><code>Case<\/code> 한 객체에 시민·민원과·담당자·관리자가 필요로 하는 모든 필드를 담습니다. 아래는 프로토타입 <code>C()<\/code>·<code>createCase()<\/code> 기준 스키마입니다.<\/p><h3>2.1 Case<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:220px\">필드<\/th><th style=\"width:150px\">타입<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td>id<\/td><td>string<\/td><td>민원번호 <code>YYYY-MMDD-NNNN<\/code>. 화면 표기는 뒤 4자리 <code>short(id)<\/code><\/td><\/tr><tr><td>title / raw<\/td><td>string<\/td><td>제목(요지 26자 절단) / 원문(마스킹 적용본만 저장)<\/td><\/tr><tr><td>mine<\/td><td>bool<\/td><td>현재 로그인 시민의 민원 여부<\/td><\/tr><tr><td>stage<\/td><td>1~5<\/td><td>접수 1 · AI검토 2 · 배정 3 · 처리중 4 · 답변완료 5 (§3)<\/td><\/tr><tr><td>status<\/td><td>enum<\/td><td>AI검토 · 배정완료 · 처리중 · 보완요청 · 답변완료 · 총괄검토 · 조정대기 · 재배정 · 반려 · 소관외 종결<\/td><\/tr><tr><td>dept<\/td><td>string<\/td><td>현재 담당 부서. 미배정·문의형은 <code>ORG.general<\/code>(민원총괄과)<\/td><\/tr><tr><td>conf<\/td><td>0~1<\/td><td>분류 신뢰도. 임계 <code>S.thresholds.assign<\/code>(기본 0.70)<\/td><\/tr><tr><td>cat / major / minor<\/td><td>string<\/td><td>“대분류 › 중분류” / 대분류 / 중분류 (TAXO 키)<\/td><\/tr><tr><td>cands<\/td><td>string[]<\/td><td>후보 부서 (주관 + alt)<\/td><\/tr><tr><td>ambiguous<\/td><td>bool<\/td><td>소관 검토 필요 (TAXO.amb 또는 conf&lt;임계)<\/td><\/tr><tr><td>inquiry<\/td><td>bool<\/td><td>단순 문의 — 부서 배정 없이 AI 초안 회신<\/td><\/tr><tr><td>urgent / special / specialFrom<\/td><td>bool / bool / string<\/td><td>긴급 · 특이민원 · 회부한 부서<\/td><\/tr><tr><td>auto / autoChecked<\/td><td>bool<\/td><td>AI 자동 배정 · 민원과 검수 완료<\/td><\/tr><tr><td>returned / returnReason / returnFrom / returnedAt<\/td><td>bool / string<\/td><td>담당 부서 반려 반환 이력<\/td><\/tr><tr><td>advisor / advDecision<\/td><td>bool / {main,co,t}<\/td><td>보좌관 판단 중 · 판단 결과<\/td><\/tr><tr><td>nonJur<\/td><td>string<\/td><td>소관 외 안내 답변 템플릿명 (있으면 status=소관외 종결)<\/td><\/tr><tr><td>addr / files / fileNames / meta / piiMasked<\/td><td>string / int / string[] / string / string<\/td><td>제출 위치·첨부·부가항목(시간대·노선·차량번호)·마스킹 내역<\/td><\/tr><tr><td>sum<\/td><td>object<\/td><td>AI 요약 카드 {요지, 분류, 요청, 감정·긴급, 근거, 접수 정보}<\/td><\/tr><tr><td>form<\/td><td>Form<\/td><td>업무 전달 양식 (§2.2)<\/td><\/tr><tr><td>proc / dproc<\/td><td>Step[]<\/td><td>민원과 프로세스 / 담당자 프로세스 로그 {k,t,v}<\/td><\/tr><tr><td>plan / field<\/td><td>object<\/td><td>조치 계획 {method,date,cost,memo,registered} / 현장 조치 {result,photos[],done}<\/td><\/tr><tr><td>coops<\/td><td>Coop[]<\/td><td>협조 요청 {to,from,t,state:sent|replied,ask,reply,repliedAt}<\/td><\/tr><tr><td>extReq<\/td><td>{why,days,state:req|ok|no,t,by}<\/td><td>기한 연장 요청<\/td><\/tr><tr><td>draft / appr / answer<\/td><td>string / 0~3 / string<\/td><td>AI 초안 · 결재 단계(기안1·검토2·전결3) · 게시 답변<\/td><\/tr><tr><td>needFile / submitted<\/td><td>string / bool<\/td><td>보완 요청 자료 · 제출 여부<\/td><\/tr><tr><td>rated<\/td><td>1~5<\/td><td>만족도<\/td><\/tr><tr><td>dd<\/td><td>int<\/td><td>법정 처리기한 D-day<\/td><\/tr><tr><td>isNew<\/td><td>bool<\/td><td>민원과 신규 팝업·NEW 배지 대상<\/td><\/tr><tr><td>ev<\/td><td>Event[]<\/td><td>상태 이벤트 로그 {act, cz, t, vis:pub|int|ai, sms}<\/td><\/tr><\/tbody><\/table><\/div><h3>2.2 Form — 업무 전달 양식<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:150px\">필드<\/th><th style=\"width:120px\">타입<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td>to / from<\/td><td>string<\/td><td>수신 부서 / 발신 (<code>류○○ 주무관 (민원총괄과)<\/code> 또는 <code>AI 자동 배정 (민원총괄과 검수)<\/code>)<\/td><\/tr><tr><td>title / body<\/td><td>string<\/td><td>[업무 전달] 제목 · 본문(요지·위치·첨부·요청 사항·배정 근거). 담당자 수정 가능<\/td><\/tr><tr><td>due<\/td><td>MM.DD<\/td><td>처리 기한 (긴급 +2일, 일반 +5일)<\/td><\/tr><tr><td>state<\/td><td>enum<\/td><td><code>draft<\/code> 작성 중 → <code>sent<\/code> 전달됨 → <code>opened<\/code> 열람됨 / <code>returned<\/code> 반려 반환<\/td><\/tr><tr><td>purpose<\/td><td>transfer | adv<\/td><td>부서 전달 / 보좌관 소관 판단 요청<\/td><\/tr><tr><td>sentAt / openedAt / opener<\/td><td>string<\/td><td>발송·열람 시각 · 열람자(<code>ORG.deptStaff[dept]<\/code>)<\/td><\/tr><\/tbody><\/table><\/div><h3>2.3 Event — 상태 이벤트<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:110px\">필드<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td>act<\/td><td>내부 행위 문장 (예: <code>현장 확인 일정 등록 (7.10)<\/code>)<\/td><\/tr><tr><td>cz<\/td><td>시민 노출 문구. 빈 문자열이면 <b>비공개<\/b>(공개범위 필터)<\/td><\/tr><tr><td>vis<\/td><td><code>pub<\/code> 자동 공개 · <code>int<\/code> 내부 전용 · <code>ai<\/code> AI 산출<\/td><\/tr><tr><td>sms<\/td><td>true면 문자 발송 (§10)<\/td><\/tr><tr><td>t<\/td><td>MM.DD HH:mm<\/td><\/tr><\/tbody><\/table><\/div><h3>2.4 보조 엔티티<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:170px\">엔티티<\/th><th>필드<\/th><th style=\"width:120px\">용도<\/th><\/tr><\/thead><tbody><tr><td>Special (발생보고서)<\/td><td>id · caseId · title · types · dept · t · status(상신→보호조치 승인/법무 검토→종결) · reporter<\/td><td>§8 A-13<\/td><\/tr><tr><td>Notice (우리 동네 소식)<\/td><td>ic · t · d · dept · tone · fresh · views · body<\/td><td>A-05·A-11·A-14 발행 → C-01/C-11<\/td><\/tr><tr><td>Issue (서류 발급)<\/td><td>id · doc · who · ch · auth · status(대기·처리중·인증대기·발급완료)<\/td><td>M-02<\/td><\/tr><tr><td>Policy<\/td><td>id · t · c(근거) · up · tgt · own · score · cat · spark[6] · gist · forced<\/td><td>A-11/A-12 · PDRAFT[id]<\/td><\/tr><tr><td>Thresholds<\/td><td>assign 0.70 · sla 3 · surge 30 · misroute 5 · policy 300<\/td><td>A-09 실시간 반영<\/td><\/tr><tr><td>Metrics<\/td><td>aiRate · solve · satis/satisN · classAcc · draftUse · aiClosedToday · nonJur …<\/td><td>A-01·A-06·A-10<\/td><\/tr><tr><td>Audit<\/td><td>who · act · purpose · t · case<\/td><td>S-07 원문 열람 · 발생보고서 · 군집 열람 · 설정 변경<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section>\n<section id=\"s3\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 03 · STATE<\/div><h2>상태는 3축입니다 — 민원 단계 · 양식 상태 · 플래그<\/h2><h3>3.1 민원 단계 stage / status<\/h3><div class=\"sm\"><div><b>stage 1<\/b>접수 완료<\/div><div><b>stage 2<\/b>AI 1차 검토 · status AI검토/총괄검토/조정대기/재배정/반려<\/div><div><b>stage 3<\/b>담당 부서 배정 · status 배정완료<\/div><div><b>stage 4<\/b>처리 중 · status 처리중/보완요청<\/div><div><b>stage 5<\/b>답변 완료 · status 답변완료/소관외 종결<\/div><\/div><h3>3.2 전이표<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:110px\">현재<\/th><th>트리거(함수)<\/th><th style=\"width:200px\">다음<\/th><th>이벤트 cz<\/th><th style=\"width:44px\">SMS<\/th><\/tr><\/thead><tbody><tr><td>—<\/td><td><code>createCase<\/code> (시민 접수)<\/td><td>1→2 AI검토<\/td><td>접수 완료 — 문자로 안내드렸어요<\/td><td>●<\/td><\/tr><tr><td>2<\/td><td><code>maybeAutoAssign<\/code> (conf≥임계·후보1·문의/특이 아님)<\/td><td>3 배정완료 · form.sent · auto=true<\/td><td>담당 부서 배정 — {dept}<\/td><td>●<\/td><\/tr><tr><td>2<\/td><td><code>doAssign(dept)<\/code> (민원과)<\/td><td>3 배정완료 · form.draft<\/td><td>담당 부서 배정 — {dept}<\/td><td>●<\/td><\/tr><tr><td>2<\/td><td><code>doAssign('__adv')<\/code><\/td><td>2 조정대기 · advisor · form(adv).draft<\/td><td>담당 부서를 확인하고 있습니다<\/td><td><\/td><\/tr><tr><td>조정대기<\/td><td><code>advisorDecide<\/code> (열람 후 자동)<\/td><td>3 배정완료 · form 재작성<\/td><td>담당 부서 배정 — {main}<\/td><td>●<\/td><\/tr><tr><td>2 (inquiry)<\/td><td><code>genInquiryDraft<\/code> → <code>sendInquiry<\/code><\/td><td>5 답변완료<\/td><td>답변 완료 — 문의 답변이 등록되었습니다<\/td><td>●<\/td><\/tr><tr><td>2·3·4<\/td><td><code>nonJurAnswer<\/code> (소관 외 템플릿)<\/td><td>5 소관외 종결 · nonJur<\/td><td>답변 완료 — 소관 기관 안내<\/td><td>●<\/td><\/tr><tr><td>3 form.draft<\/td><td><code>sendForm<\/code><\/td><td>form.sent<\/td><td>(내부 전용)<\/td><td><\/td><\/tr><tr><td>form.sent<\/td><td><code>openForm_<\/code> / <code>dOpen<\/code><\/td><td>form.opened<\/td><td>담당자가 검토를 시작했습니다<\/td><td><\/td><\/tr><tr><td>3·4 opened<\/td><td><code>deptReject(why)<\/code> (담당자)<\/td><td>2 반려 · returned · form.returned · isNew<\/td><td>담당 부서를 다시 확인하고 있습니다<\/td><td><\/td><\/tr><tr><td>opened<\/td><td><code>dRegisterPlan<\/code><\/td><td>4 처리중 · dproc 계획<\/td><td>담당 부서가 조치 계획을 세우고 있습니다 (예정 {date})<\/td><td><\/td><\/tr><tr><td>4<\/td><td><code>dAct('현장 확인 일정')<\/code><\/td><td>4 · dproc 조치<\/td><td>현장 확인 중 (방문 예정)<\/td><td>●<\/td><\/tr><tr><td>4<\/td><td><code>coopSend<\/code> / <code>coopReply<\/code><\/td><td>4 · coops<\/td><td>관련 부서와 협의 중 / 협의가 완료되었습니다<\/td><td><\/td><\/tr><tr><td>4<\/td><td><code>dAct('보완자료 요청')<\/code><\/td><td>4 보완요청 · needFile<\/td><td>추가 자료가 필요합니다 — {needFile}<\/td><td>●<\/td><\/tr><tr><td>보완요청<\/td><td><code>pickFile<\/code> (시민)<\/td><td>4 처리중 · submitted<\/td><td>검토가 재개되었습니다<\/td><td>●<\/td><\/tr><tr><td>4<\/td><td><code>extRequest<\/code> → <code>extDecide(true)<\/code><\/td><td>dd+=days · form.due<\/td><td>처리기간이 연장되었습니다 (사유: {why})<\/td><td>●<\/td><\/tr><tr><td>4<\/td><td><code>dFieldDone<\/code><\/td><td>4 · dproc 조치 · field.done<\/td><td>현장 조치가 완료되었습니다<\/td><td>●<\/td><\/tr><tr><td>4<\/td><td><code>submitAppr<\/code> → <code>apprStep(2)<\/code> → <code>apprStep(3)<\/code><\/td><td>appr 1→2→3 · 5 답변완료 · answer<\/td><td>답변 검토 중 → 답변 완료 — 처리기간 N일<\/td><td>● (전결)<\/td><\/tr><tr><td>2 미배정<\/td><td><code>sendQuestion<\/code> (민원과 추가 질문)<\/td><td>2 질문대기 · questions[]<\/td><td>추가 확인이 필요합니다 — {q}<\/td><td>●<\/td><\/tr><tr><td>질문대기<\/td><td><code>answerQuestion<\/code> (시민)<\/td><td>2 AI검토 · isNew · raw 추가<\/td><td>답변을 보내주셔서 감사합니다 — 검토를 이어갑니다<\/td><td><\/td><\/tr><tr><td>5 답변완료<\/td><td><code>sendFollowup<\/code> (시민 추가 문의)<\/td><td>4 추가문의 · followups[] · isNew<\/td><td>추가 문의가 접수되었습니다 — 담당자가 확인 후 답변드려요<\/td><td>●<\/td><\/tr><tr><td>추가문의<\/td><td><code>sendFollowAnswer<\/code> (민원과/담당 부서)<\/td><td>5 답변완료 · followups[i].a<\/td><td>추가 문의 답변이 등록되었습니다<\/td><td>●<\/td><\/tr><tr><td>5 (rated≤2)<\/td><td><code>reviewRequest<\/code> (시민)<\/td><td>4 재검토 · review.req · isNew<\/td><td>재검토 요청이 접수되었습니다<\/td><td>●<\/td><\/tr><tr><td>재검토<\/td><td><code>reviewDecide(resend)<\/code><\/td><td>3 배정완료 · form(재검토) draft · appr=0<\/td><td>담당 부서가 답변을 보완하고 있습니다<\/td><td><\/td><\/tr><tr><td>재검토<\/td><td><code>reviewDecide(keep)<\/code><\/td><td>5 답변완료 · answer += 재검토 결과<\/td><td>재검토 결과가 등록되었습니다<\/td><td>●<\/td><\/tr><tr><td>임의<\/td><td><code>referSpecial<\/code> (담당자)<\/td><td>special=true · specialFrom<\/td><td>(내부 전용)<\/td><td><\/td><\/tr><tr><td>임의<\/td><td><code>sendReport<\/code> (민원과)<\/td><td>Special 생성 status 상신<\/td><td>(내부 전용)<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><h3>3.3 보조 상태 축<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:170px\">축<\/th><th>상태값<\/th><th>전이<\/th><\/tr><\/thead><tbody><tr><td>Issue.step (서류 발급)<\/td><td>1 요청 확인 → 2 본인인증·수수료 → 3 발급 → 4 교부·안내 → 5 완료<\/td><td><code>issueDone(n)<\/code> · log[]에 단계·시각 · 4 완료 시 status=발급완료<\/td><\/tr><tr><td>Policy 단계 (pFirst)<\/td><td>1 근거 분석 → 2 원인 진단 → 3 정책 초안 → 4 부서 협의 → 5 예산·일정 → 6 안건 상신·심의 → 7 시행·효과 추적<\/td><td><code>plog[{k,t,v}]<\/code> — k가 있으면 완료. 6은 <code>agenda.state<\/code>(상신·가결·보류), 7은 <code>exec<\/code><\/td><\/tr><tr><td>Policy.consult[]<\/td><td>sent → 동의 | 조건부 동의<\/td><td><code>pConsult<\/code> 발송 · 회신 job(운영: 부서 콘솔 회신)<\/td><\/tr><tr><td>Case.review<\/td><td>req → resend | keep<\/td><td><code>reviewDecide<\/code><\/td><\/tr><tr><td>Case.questions[]<\/td><td>{q,t,a:null} → a 채움<\/td><td><code>sendQuestion<\/code> / <code>answerQuestion<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"note red\"><b>불변 규칙<\/b> — ① 답변은 결재 전결(<code>apprStep(3)<\/code>) 또는 민원과 확인(<code>sendInquiry<\/code>·<code>nonJurAnswer<\/code>) 없이 시민에게 도달할 수 없다. ② <code>vis:int<\/code> 이벤트와 <code>cz<\/code>가 빈 이벤트는 어떤 시민 화면에도 렌더링하지 않는다. ③ 원문 <code>raw<\/code>는 마스킹 적용본만 저장한다.<\/div><\/div><\/section>\n<section id=\"s4\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 04 · AI PIPELINE<\/div><h2>접수 한 줄이 통과하는 7단계<\/h2><p class=\"lede\"><code>send()<\/code> → <code>analyze()<\/code> → 카드 → <code>openForm()<\/code> → <code>submitForm()<\/code> → <code>createCase()<\/code> → <code>maybeAutoAssign()<\/code>. 각 단계는 결정론적 규칙과 AI 호출이 분리되어 있어 재현·검증이 가능합니다.<\/p><h3>4.0 접수 순서의 역전 — 인증은 등록 시점에<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:110px\">구간<\/th><th>서버 규칙<\/th><th style=\"width:150px\">구현<\/th><\/tr><\/thead><tbody><tr><td>익명 대화<\/td><td><code>POST /ai/analyze<\/code>·<code>/ai/mask<\/code>는 <b>익명 세션 토큰<\/b>으로 호출 가능. 즉시 답변(FAQ·문의 템플릿)은 인증 없이 반환<\/td><td>세션 쿠키 + rate limit<\/td><\/tr><tr><td>임시저장<\/td><td>폼·첨부는 세션 키로 24h 보관(<code>S.savedForm<\/code> 대응). 인증 후 세션→계정으로 승계<\/td><td><code>POST /drafts<\/code><\/td><\/tr><tr><td>등록 시점 인증<\/td><td><code>POST /cases<\/code>만 인증 토큰 필수. 미인증이면 401 + <code>pendingForm<\/code> 플래그 → 인증 성공 콜백에서 <b>동일 페이로드 자동 재전송<\/b>(idempotency-key로 중복 방지)<\/td><td><code>doAuth → submitForm<\/code><\/td><\/tr><tr><td>효과 지표<\/td><td>AI 즉시 종결(<code>aiClosedToday<\/code>) · 게시판 미유입률 · 인증 이탈률을 A-01/A-10에 노출<\/td><td>§8<\/td><\/tr><\/tbody><\/table><\/div><h3>4.1 파이프라인 9단계<\/h3><div class=\"tw\"><table><thead><tr><th style=\"width:110px\">단계<\/th><th>규칙<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td>① 마스킹<\/td><td>주민번호 <code>\\d{6}-[1-4]\\d{6}<\/code> · 휴대폰 <code>01[016789]-\\d{3,4}-\\d{4}<\/code> · 카드 16자리 · 계좌 <code>\\d{2,3}-\\d{2,6}-\\d{4,7}<\/code> · 이메일. 원본 미저장, 탐지 항목을 대화에 고지<\/td><td><code>maskPII<\/code><\/td><\/tr><tr><td>② 긴급 판정<\/td><td><code>EMG<\/code> 키워드(화재·가스·붕괴·폭발·감전·침수·쓰러졌·사고가 났·피가) 포함 시 119/112 배너 우선 표시, 접수 병행<\/td><td><code>send<\/code><\/td><\/tr><tr><td>③ FAQ / 이관<\/td><td><code>FAQ_K<\/code>(전입신고·구비서류…) → 즉시 종결형 / <code>BLOCK<\/code>(보상·배상·허가·과태료·소송·법령…) → 이관형(<code>ESCALATE_DEPT<\/code>)<\/td><td><code>analyze<\/code><\/td><\/tr><tr><td>④ 분류 스코어링<\/td><td>TAXO 각 항목의 <code>kw<\/code> 중 본문에 포함된 키워드 길이(공백 제외) 합 = 점수. 문의형(<code>inq<\/code>)은 +1, 의문 표현(언제·어디서·몇 시·어떻게·인가요·나요?·알려주·궁금) 시 +3. 최고 점수 항목 채택, 0점이면 <b>미분류 › 분류 검토 필요<\/b>(ambiguous)<\/td><td><code>analyze<\/code><\/td><\/tr><tr><td>⑤ 라우팅<\/td><td><code>dept=t.d<\/code>, <code>cands=[t.d]+t.alt<\/code>, <code>ambiguous=t.amb || t.c&lt;thresholds.assign<\/code>, <code>urgent=t.urg<\/code><\/td><td><code>analyze<\/code><\/td><\/tr><tr><td>⑥ 안내 문구<\/td><td><code>buildTip<\/code>: “{대분류 › 중분류} 민원으로 보여요. {t.tip} 예상 부서 {d}, 보통 {days}일 / 소관 갈림 시 민원과 확인” + “함께 주시면 빨라요: {form.need}”<\/td><td><code>buildTip<\/code><\/td><\/tr><tr><td>⑦ 폼 스펙<\/td><td><code>TAXO.form<\/code> 우선(노선형·기간형), 없으면 <code>formSpec<\/code> 정규식(소음·주정차·시설·서류·기본). 필드 <code>text·time·addr·file·vehicle·route·period<\/code>, <code>must<\/code> 검증<\/td><td><code>formSpec<\/code>·<code>fileForm<\/code>·<code>submitForm<\/code><\/td><\/tr><tr><td>⑧ 중복 탐지<\/td><td>한글 bigram 집합 교집합 ≥4 → “비슷한 접수가 있어요” → 병합(<code>mergeDupe<\/code>: 새 민원 없이 이벤트 추가) / 별도<\/td><td><code>findDupe<\/code><\/td><\/tr><tr><td>⑨ 자동 배정<\/td><td><code>!inquiry && !ambiguous && !special && conf≥임계 && dept≠general<\/code> → form 자동 작성·발송(sent), from=<code>AI 자동 배정<\/code>, 12초 후 자동 열람(운영: 담당자 열람 이벤트로 대체)<\/td><td><code>maybeAutoAssign<\/code><\/td><\/tr><\/tbody><\/table><\/div><h3>4.2 TAXO 항목 스키마<\/h3><pre>{ <b>ma<\/b>:\"대분류\", <b>mi<\/b>:\"중분류\", <b>kw<\/b>:[\"키워드\",…], <b>d<\/b>:\"주관 부서\", <b>alt<\/b>:[\"후보\",…], <b>c<\/b>:0.86,\n  <b>amb<\/b>:true|false, <b>urg<\/b>:true|false, <b>why<\/b>:\"소관이 갈리는 이유\", <b>tip<\/b>:\"상황별 안내\", <b>days<\/b>:5,\n  <b>form<\/b>:{need:[\"text\",\"route\",\"time\"], must:[\"text\",\"route\"], routeLabel:\"노선 번호·구간\", hint:\"…\"},\n  <b>inq<\/b>:true, <b>ans<\/b>:\"문의 답변 템플릿 [근거]\" }   <i>// 문의형은 d 없음 → ORG.general<\/i><\/pre><div class=\"note blue\"><b>운영 이관<\/b> — TAXO·NONJUR·SEASON/PERIOD/REGION은 관리자 A-08/A-09에서 편집 가능한 DB 테이블로 옮기고, 스코어링 규칙은 서버 규칙 엔진에 그대로 이식합니다. LLM은 ④의 보조(동의어 확장·요약·초안)에만 쓰고 최종 분류 결정은 규칙 점수로 고정합니다.<\/div><\/div><\/section>\n<section id=\"s5\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 05 · CITIZEN WEB<\/div><h2>시민 웹 · C-00 ~ C-12<\/h2><p class=\"lede\">설치 없는 모바일 웹. 접수까지 1탭, 접수 과정에서 잃는 정보 0.<\/p><div class=\"scr\"><header><span class=\"sid\">C-00<\/span><h5>스플래시<\/h5><span class=\"tag t-keep\">유지<\/span><span class=\"entry\">최초 로딩<\/span><\/header><div class=\"body\"><div class=\"desc\">공식 로고 PNG(base64 인라인) + 슬로건. 1.4초 후 홈. 타이머는 <code>role==citizen && cv==splash<\/code>일 때만 화면을 갱신.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>로고<\/b><\/td><td><code>CJ_LOGO<\/code> data URI. 원본 비율·색 변형 금지<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>citizen()<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>전환<\/b><\/td><td>타이머 가드 — 다른 탭 이동 시 덮어쓰지 않음<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\">v3.0 보정<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-01<\/span><h5>홈<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">스플래시 후 · 하단 탭<\/span><\/header><div class=\"body\"><div class=\"desc\">CI 헤더(좌 시민특별시 · 우 로고) → 우리 동네 소식 4건 → 자주 찾는 서비스 12종 가로 스크롤 → 접수 진입 바. 진행 중 민원 카드는 C-04로 이관.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>CI 헤더<\/b><\/td><td>좌측 슬로건(자간 .16em, ‘특별시’ CI 그린) · 우측 로고 38px<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>.cihead<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>우리 동네 소식<\/b><\/td><td><code>S.notices.slice(0,4)<\/code> · 아이콘 톤(env/road/기본) · 날짜 칩·부서·조회수 · [전체 보기]→C-11 · 클릭 → 바텀시트(<code>noticeSheet<\/code>, views++)<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>newsItem<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>자주 찾는 서비스<\/b><\/td><td><code>QUICK<\/code> 12종 · 가로 스크롤(스크롤바 숨김) · 클릭 시 <code>openChat(문장)<\/code> · [전체 보기]→C-12<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>QUICK<\/code><\/td><\/tr><tr><td class=\"c num\">4<\/td><td><b>접수 진입 바<\/b><\/td><td>입력창 형태 버튼 → <code>openChat()<\/code>. 임시저장 존재 시 ⊕접수 탭에 앰버 배지<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>askbar<\/code>·<code>S.savedForm<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-get\">GET<\/div><div><code>/api/notices?limit=4<\/code> — 홈 소식<\/div><div class=\"m-get\">GET<\/div><div><code>/api/quick<\/code> — 빠른 서비스 목록<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-02<\/span><h5>접수 대화<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">⊕접수 · 홈 진입 바 · 서비스 칩<\/span><\/header><div class=\"body\"><div class=\"desc\">자연어 1건 → 마스킹 고지 → 긴급 배너 → <b>상황별 안내 말풍선(tip)<\/b> → AI 분석 카드. 카드 버튼은 [확인]/[접수 진행].<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>첫 인사<\/b><\/td><td>예시 문장 3개를 힌트로 표시<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>openChat<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>메시지 타입<\/b><\/td><td><code>me · ai · typing · pii · emg · card · form · receipt<\/code> — 렌더러 분기<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>cChat<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>AI 카드<\/b><\/td><td>유형(+단순 문의/소관 검토 배지) · 긴급도 · 예상 부서(문의형은 “부서 배정 없이 답변”, 임계 미달은 “검토 중 — 후보”) · 보호(마스킹 항목·중복) · 첨부<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>aiCard<\/code><\/td><\/tr><tr><td class=\"c num\">4<\/td><td><b>[확인]<\/b><\/td><td>카드 접힘 + “접수 진행 →” 링크 유지<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>ackCard<\/code><\/td><\/tr><tr><td class=\"c num\">5<\/td><td><b>[접수 진행]<\/b><\/td><td>C-03 폼을 대화 안에 삽입<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>openForm<\/code><\/td><\/tr><tr><td class=\"c num\">6<\/td><td><b>내용 수정<\/b><\/td><td>카드 내 인라인 편집 → [수정 완료]는 재분석(새 카드) · [취소]. 새 민원 생성 금지<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>editText·applyEdit<\/code><\/td><\/tr><tr><td class=\"c num\">7<\/td><td><b>삼단 분기<\/b><\/td><td>FAQ: 근거 칩 답변 + [해결됐어요]/[정식 접수](원문 승계 <code>escalateFile<\/code>) · 이관형: 접수번호 즉시 발급<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>send<\/code><\/td><\/tr><tr><td class=\"c num\">8<\/td><td><b>도구 칩<\/b><\/td><td>📍주소(시트 입력) · 📷파일(최대 3) · ⌨️입력 · 🔒마스킹 안내 — 첨부는 입력창 위 칩<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>attach()·attachBar<\/code><\/td><\/tr><tr><td class=\"c num\">9<\/td><td><b>중복<\/b><\/td><td>“비슷한 접수가 있어요 (#id)” → [함께 처리]/[별도 접수]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>mergeDupe·keepSeparate<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/ai/analyze<\/code> — {text} → {type,cat,major,minor,dept,conf,cands,ambiguous,urgent,tip,form,dupe}<\/div><div class=\"m-post\">POST<\/div><div><code>/api/ai/mask<\/code> — 마스킹<\/div><\/div><div class=\"note gold\">tip 예시 — “버스 배차 간격이 너무 길어요. 105번 증차해주세요” → 노선형: “위치·사진 없이 노선 번호·시간대만 …”. “○○로 갓길에 고라니 사체가 있어요” → 소관 검토: “민원과가 확인 후 배정합니다 (후보 …)”.<\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-03<\/span><h5>접수 정보 입력 폼<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">C-02 [접수 진행]<\/span><\/header><div class=\"body\"><div class=\"desc\">유형별 동적 필드. 노선형(버스)·기간형(축제)·소음형(시간대+녹음)·주정차형(차량번호+사진 필수)·시설형(위치 필수)·서류형(내용만)·기본형.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>필드 타입<\/b><\/td><td><code>text<\/code> textarea · <code>time<\/code> 칩(심야/아침/주간/저녁) · <code>addr<\/code> · <code>vehicle<\/code> · <code>route<\/code> · <code>period<\/code> · <code>file<\/code>(소음 첫 첨부는 .m4a)<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>fileForm<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>필수 검증<\/b><\/td><td><code>sp.must<\/code> 미입력 → 해당 칸 <code>.miss<\/code> 강조 + 토스트(무엇을 채울지)<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>submitForm<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>임시저장<\/b><\/td><td><code>S.savedForm={mid,at,card,form}<\/code> · 재진입 시 복원 + [취소하기/접수하기]로 전환<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>saveDraftForm·resumeDraft·discardDraft<\/code><\/td><\/tr><tr><td class=\"c num\">4<\/td><td><b>다시 분석<\/b><\/td><td>내용 수정 후 재판정 → 유형·부서·필드 구성 갱신<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>reAnalyze<\/code><\/td><\/tr><tr><td class=\"c num\">5<\/td><td><b>접수<\/b><\/td><td>마스킹 → 본인인증 게이트(<code>S.citizen.verified<\/code>, 미인증 시 <code>pendingForm<\/code> 후 자동 재개) → <code>createCase<\/code> → 접수증 · 폼 제거<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>submitForm·doAuth<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/cases<\/code> — {text,addr,files,meta,major,minor,cands,ambiguous,inquiry} → Case<\/div><div class=\"m-post\">POST<\/div><div><code>/api/drafts<\/code> — 임시저장<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-04<\/span><h5>나의 민원<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">하단 탭<\/span><\/header><div class=\"body\"><div class=\"desc\">카드마다 링 게이지(20/40/60/80%) + 5단계 도트. 완료는 그린 ✓. 소관 외 종결은 <code>소관 외 안내<\/code> 회색 태그.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>목적지<\/b><\/td><td>보완요청→C-07 · 완료→C-06 · 그 외→C-05<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>listCard<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>필터<\/b><\/td><td>전체/진행 중/완료 · 상단 진행 안내바<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>cList<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-get\">GET<\/div><div><code>/api/cases?mine=1<\/code> — 목록<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-05<\/span><h5>진행상황 트래커<\/h5><span class=\"tag t-keep\">유지<\/span><span class=\"entry\">C-04 · 문자 링크<\/span><\/header><div class=\"body\"><div class=\"desc\">5단계 스텝퍼. <code>ev<\/code> 중 <code>cz<\/code>가 있는 항목만 표시. 배정 근거·신뢰도 게이지·임계선. 임계 미달·조정대기는 “적합한 부서를 검토 중”.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>접수 단계<\/b><\/td><td>첨부 수·주소 표기<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>cTrack<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>처리 중<\/b><\/td><td>현장·협의·자료·재개·계획·조치 문구 + ⚡배지<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>cTrack<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>연락처<\/b><\/td><td>부서 대표번호만<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\">원칙④<\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-get\">GET<\/div><div><code>/api/cases/{id}/timeline<\/code> — 공개 이벤트만<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-06<\/span><h5>답변서 · 만족도<\/h5><span class=\"tag t-keep\">유지<\/span><span class=\"entry\">C-04 완료<\/span><\/header><div class=\"body\"><div class=\"desc\"><code>answer<\/code> 게시. 출처 <code>[…]<\/code>는 칩으로 렌더 → 원문 시트. 별점 → <code>metrics.satis<\/code> 갱신, 3점 이하 사유 큐.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>소관 외<\/b><\/td><td>nonJur 답변도 동일 화면(안내처·근거 포함)<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>cAnswer<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/rating<\/code> — 별점<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-06f<\/span><h5>추가 문의 — 원 답변에 이어지는 질의 (새 접수 아님)<\/h5><span class=\"tag t-new\">신규<\/span><span class=\"entry\">C-06 [추가 문의]<\/span><\/header><div class=\"body\"><div class=\"desc\">답변 완료 건의 [추가 문의]는 일반 접수 대화로 가지 않습니다. <b>같은 민원번호<\/b>에 원문·답변 스레드를 먼저 보여주고, 그 답변에 대한 추가 질의만 받습니다.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>스레드<\/b><\/td><td>원 문의(raw) · 부서 답변 · 이전 추가 질의/답변. 대기 중 질의가 있으면 새 질의 입력 차단<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>cFollowup<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>질의 전송<\/b><\/td><td><code>followups[]<\/code> 추가 · stage 4 · status=추가문의 · isNew · SMS. AI 즉시 종결 건은 dept를 민원과로 전환<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>sendFollowup<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>답변 수신<\/b><\/td><td>C-06 답변서 아래 스레드에 표시 · 목록 태그 ↩ 추가 문의 → 답변 완료<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>cAnswer<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/followup<\/code> — {q}<\/div><div class=\"m-get\">GET<\/div><div><code>/api/cases/{id}/followups<\/code> — 스레드<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-07<\/span><h5>보완자료 제출<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">보완요청 카드 · 문자<\/span><\/header><div class=\"body\"><div class=\"desc\">요청 사유·요청자·시각 표시. 인증 게이트(문자 토큰 경로 예외). 제출 → 검토 재개 이벤트 + 문자.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>제출<\/b><\/td><td><code>submitted=true, status=처리중<\/code><\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>pickFile<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/supplement<\/code> — 파일<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-08<\/span><h5>문자<\/h5><span class=\"tag t-keep\">유지<\/span><span class=\"entry\">하단 탭<\/span><\/header><div class=\"body\"><div class=\"desc\"><code>ev.sms<\/code> 이벤트 목록 + 실제 발송 문안 미리보기. 링크는 서명 토큰(7일·1건 조회).<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>미확인<\/b><\/td><td>탭 점 배지 (<code>seenSms<\/code>)<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>smsList<\/code><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-09<\/span><h5>내 정보<\/h5><span class=\"tag t-keep\">유지<\/span><span class=\"entry\">하단 탭<\/span><\/header><div class=\"body\"><div class=\"desc\">인증 상태 · 문자 수신(끄기 전 영향 시트) · 개인정보 안내 · 접근성(큰 글씨) · 전화·방문 안내. 모든 팝업은 바텀시트.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>시트<\/b><\/td><td><code>openSheet(title,body,actions,tags)<\/code> — 폰 프레임 내부<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>sheetHtml<\/code><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-10<\/span><h5>휴대폰 본인인증<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">접수·보완 시점<\/span><\/header><div class=\"body\"><div class=\"desc\">인증 후 <code>pendingForm/pendingFile<\/code>이 있으면 접수를 자동 재개. 정보 즉시 파기.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>재개<\/b><\/td><td><code>doAuth → submitForm<\/code><\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>doAuth<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/auth/otp<\/code> — 발송<\/div><div class=\"m-post\">POST<\/div><div><code>/api/auth/verify<\/code> — 검증<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-11<\/span><h5>우리 동네 소식 전체<\/h5><span class=\"tag t-new\">신규<\/span><span class=\"entry\">C-01 전체 보기<\/span><\/header><div class=\"body\"><div class=\"desc\">전체 목록 · 누적 조회 · 새 공지 배지. 시트에서 [이 건으로 문의] → 제목 승계 접수.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>발행 원천<\/b><\/td><td>A-05 공지문 · A-11 사전 안내 · A-14 지역 맞춤 공지<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>S.notices<\/code><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">C-12<\/span><h5>자주 찾는 서비스 전체<\/h5><span class=\"tag t-new\">신규<\/span><span class=\"entry\">C-01 전체 보기<\/span><\/header><div class=\"body\"><div class=\"desc\">12종 2열 카드(아이콘·유형·실제 질문). 클릭 → 문장 입력된 채로 C-02.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>데이터<\/b><\/td><td><code>QUICK<\/code><\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div><\/div><\/section>\n<section id=\"s6\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 06 · 민원과<\/div><h2>민원과 · M-01 ~ M-03 · S-02 ~ S-10<\/h2><p class=\"lede\">접수 → 배정 → 전달 → 추적, 그리고 서류 발급·소관 외 안내. 조치·답변은 담당자 워크스테이션에서.<\/p><div class=\"scr\"><header><span class=\"sid\">M-01<\/span><h5>접수 대기·배정 (큐)<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">로그인 직후<\/span><\/header><div class=\"body\"><div class=\"desc\">접속 시 신규 접수 팝업(<code>showNewPopup<\/code>) → [확인] 시 신규 필터. 큐 포함 규칙: <code>isMine || stage&lt;3 || auto || returned || extReq.req<\/code>.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>범위<\/b><\/td><td>[내 부서 + 접수 대기 / 기관 전체]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>S.scope<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>필터 칩<\/b><\/td><td>전체 · 신규 접수 · <b>⚡ AI 자동 배정<\/b> · <b>⟲ 반려 반환<\/b> · <b>⏳ 연장 요청<\/b> · D-1 · 긴급 · 특이 · 묶음 · 보완대기<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>S.qfilter<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>행 태그<\/b><\/td><td>자동 배정(✓검수) · 반려 반환 · 연장 요청 · 문의 · 소관 검토 · 보좌관 판단 중 · 특이 · 분류 · 신뢰도 · 📍 · 🖼️ · NEW · D-day<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>sQueue<\/code><\/td><\/tr><tr><td class=\"c num\">4<\/td><td><b>KPI<\/b><\/td><td>접수 대기(미배정) 실시간 · AI 즉시 종결 · 기한 임박 · 문의 전화 감소<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-get\">GET<\/div><div><code>/api/queue?scope=&filter=<\/code> — 큐<\/div><div class=\"m-get\">GET<\/div><div><code>/api/queue/new<\/code> — 팝업용 신규<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">S-02<\/span><h5>민원 상세 — 상태별 액션 블록<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">큐 행 클릭<\/span><\/header><div class=\"body\"><div class=\"desc\">상단 7단계 프로세스(<code>procHtml<\/code>) + AI 요약 + 신뢰도 게이지. 액션 블록은 <b>상태에 따라 6종 중 하나<\/b>로 렌더됩니다.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>① 문의형<\/b><\/td><td>[⚡ AI 답변 초안 작성] → 편집 → [확인 — 시민에게 전달] · [부서 배정으로 전환] · [소관 외 안내]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>genInquiryDraft·sendInquiry<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>② 미배정<\/b><\/td><td>(반려 반환이면 사유 배너) [담당부서 배정 →](모달: AI 추천·후보 칩·그 밖의 부서·⚖ 보좌관 배정) · [소관 외 안내 답변] · [보좌관 배정]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>assignModal·doAssign·nonJurModal<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>③ 양식 작성 중<\/b><\/td><td>수신/발신/기한/상태 헤더 + 제목·본문 편집 → [전달하기] · [임시 저장] · [부서 다시 선택]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>genForm·sendForm<\/code><\/td><\/tr><tr><td class=\"c num\">4<\/td><td><b>④ 전달됨(sent)<\/b><\/td><td>(자동 배정이면 ⚡검수 블록: [배정 유지]/[재배정]) 수신 확인 대기 스피너<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>autoConfirm<\/code><\/td><\/tr><tr><td class=\"c num\">5<\/td><td><b>⑤ 열람됨(opened)<\/b><\/td><td>담당 부서 처리 모니터링: 열람자·시각 · 담당자 최근 처리 3건 · [담당자 화면에서 보기 →] · [기한 안내] · [재배정] · (자동 배정 검수 대기면 검수 블록)<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>sCase<\/code><\/td><\/tr><tr><td class=\"c num\">6<\/td><td><b>⑥ 완료<\/b><\/td><td>“✓ 답변 완료” 배너<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/assign<\/code> — {dept|__adv}<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/form/send<\/code> — <\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/nonjur<\/code> — {tpl,org,text}<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/inquiry/draft<\/code> — <\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/inquiry/send<\/code> — <\/div><\/div><div class=\"note red\">반려 버튼은 없습니다. 민원과에서 처리할 수 없는 민원은 <b>소관 외 안내 답변<\/b>으로 종결합니다(NONJUR 템플릿 6종 · 안내처·근거 자동 삽입).<\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">M-02<\/span><h5>담당업무 — 민원과 소관 민원 · 문의 · 서류 발급<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">사이드바<\/span><\/header><div class=\"body\"><div class=\"desc\">민원과도 서류 발급만 하는 조직이 아닙니다. 접수 시 또는 AI가 <code>ORG.general<\/code> 소관으로 배정한 민원(<code>form.purpose=own<\/code>)은 다른 부서와 똑같이 <b>담당자 7단계 프로세스<\/b>로 처리하고, 문의는 AI 초안 회신 또는 [자체 처리] 전환, 서류는 4단계 발급 프로세스를 따릅니다.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>소관 민원 목록<\/b><\/td><td><code>mwOwn()<\/code> = dept==general && !inquiry && form.purpose==own. 출처 태그 ⚡ AI 자동 배정 / 접수 배정 · 최근 처리 · D-day<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>mTasks<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>클릭 → 7단계<\/b><\/td><td><code>mOpenTask<\/code>: form 없으면 own 양식 생성(opened, opener=류○○ 주무관) → D-02 위저드(dcase)를 민원과 콘솔 안에서 렌더. draft/appr도 프로세스 바 부착<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>mOpenTask·dCase<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>문의 [자체 처리]<\/b><\/td><td>inquiry 해제 · dept=general · stage 3 → 7단계로 전환<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>mwAdopt<\/code><\/td><\/tr><tr><td class=\"c num\">4<\/td><td><b>담당자 콘솔 격리<\/b><\/td><td><code>transfers()<\/code>는 purpose=transfer만 포함 → 민원과 자체 업무는 부서 담당자 화면에 나타나지 않음<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>transfers<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-get\">GET<\/div><div><code>/api/minwon/tasks<\/code> — 소관 민원·문의·발급 통합<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/adopt<\/code> — 자체 처리 전환<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">M-02i<\/span><h5>서류 발급 프로세스 (4단계)<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">M-02 [발급 처리 →]<\/span><\/header><div class=\"body\"><div class=\"desc\">서류 발급 요청 표. [발급 처리 →]는 민원과 고유 업무를 담당자 프로세스와 같은 <b>4단계 위저드<\/b>로 엽니다.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>① 요청 확인<\/b><\/td><td>서류·신청인·채널·용도·제3자 위임 확인<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>mIssueProc n=1<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>② 본인인증·수수료<\/b><\/td><td>인증 상태(대기 시 재요청/창구 대면) · 수수료 면제/결제<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>issueDone(2)<\/code> → auth=true<\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>③ 발급<\/b><\/td><td>전자문서 생성 · 원본 대조 · 발급 번호 · 감사 로그<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>issueDone(3)<\/code><\/td><\/tr><tr><td class=\"c num\">4<\/td><td><b>④ 교부·안내<\/b><\/td><td>온라인 문자 링크(7일) / 창구 교부 / 무인발급기 출력 → status=발급완료<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>issueDone(4)<\/code><\/td><\/tr><tr><td class=\"c num\">5<\/td><td><b>프로세스 바<\/b><\/td><td>단계 클릭 이동 · 완료 로그<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>issueStep<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-get\">GET<\/div><div><code>/api/issues<\/code> — <\/div><div class=\"m-post\">POST<\/div><div><code>/api/issues/{id}/step<\/code> — {n} → log 추가·status<\/div><div class=\"m-post\">POST<\/div><div><code>/api/issues/{id}/auth-resend<\/code> — <\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">M-01a<\/span><h5>추가 질문 (Q&A 루프)<\/h5><span class=\"tag t-new\">신규<\/span><span class=\"entry\">S-02 미배정 블록<\/span><\/header><div class=\"body\"><div class=\"desc\">판단이 필요하거나 정보가 부족한 민원은 배정 전에 시민에게 질문합니다. 답변이 오면 큐에 💬 답변 도착으로 올라오고 원문에 [추가 답변]이 덧붙습니다.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>질문 발송<\/b><\/td><td>템플릿 5종(위치·사진·발생 시점·희망 조치·시간대) + 직접 입력 → status=질문대기 · 트래커·SMS<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>askModal·sendQuestion<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>답변 수신<\/b><\/td><td>C-05 질문 박스 → <code>answerQuestion<\/code> → isNew · raw += [추가 답변] · 큐 필터 💬<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>answerQuestion<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>Q&A 패널<\/b><\/td><td>S-02 상단에 질문/답변 이력<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>sCase<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/question<\/code> — {q}<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/question/{i}/answer<\/code> — {a} (시민 토큰)<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">S-02f<\/span><h5>추가 문의 답변<\/h5><span class=\"tag t-new\">신규<\/span><span class=\"entry\">큐 ↩ 추가 문의<\/span><\/header><div class=\"body\"><div class=\"desc\">원 답변 · 질의 스레드를 보고 [⚡ AI 추가 답변 초안](기존 답변·처리 계획 인용, 시점/재발/일반 3유형) → 편집 → [확인 — 전달]. 부서 소관이면 [담당 부서에 전달] → 담당자 D-02에서 같은 패널로 답변.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>초안<\/b><\/td><td><code>followups[i].draft<\/code> — 원 답변 인용<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>genFollowDraft<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>전달<\/b><\/td><td>a·at·by 기록 · stage 5 · SMS<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>sendFollowAnswer<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>부서 전달<\/b><\/td><td>followTo · form opened 유지 → transfers()에 포함<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>followToDept<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/followup/{i}/draft<\/code> — <\/div><div class=\"m-put\">PUT<\/div><div><code>/api/cases/{id}/followup/{i}<\/code> — {a}<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/followup/forward<\/code> — <\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">S-02r<\/span><h5>재검토(이의) 처리<\/h5><span class=\"tag t-new\">신규<\/span><span class=\"entry\">큐 ⟳ 재검토<\/span><\/header><div class=\"body\"><div class=\"desc\">시민이 답변 만족도 2점 이하에서 [재검토 요청]하면 민원과 큐 상단에 ⟳로 올라옵니다. 기존 답변을 검토해 보완 재전달 · 원 답변 유지 · 다른 부서 재배정 중 선택합니다.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>보완 재전달<\/b><\/td><td>form 재작성([재검토] 접두) · appr=0 · draft 초기화 → 담당자 D-01<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>reviewDecide(resend)<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>원 답변 유지<\/b><\/td><td>answer += [재검토 결과] · stage 5 · SMS<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>reviewDecide(keep)<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/review<\/code> — (시민)<\/div><div class=\"m-put\">PUT<\/div><div><code>/api/cases/{id}/review<\/code> — {mode:resend|keep}<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">M-03<\/span><h5>배정 현황<\/h5><span class=\"tag t-new\">신규<\/span><span class=\"entry\">사이드바<\/span><\/header><div class=\"body\"><div class=\"desc\">(연장 요청 승인 패널) + 배정 건 추적 표: 수신(⚡자동/⟲반려/소관 판단) · 양식 상태 · 열람자·시각 · 담당자 진행(dproc 최근) · 기한 · [재알림].<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>연장<\/b><\/td><td>[승인]→dd+=days, form.due 갱신, 시민 문구+SMS / [반려]→내부 전용<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>extDecide<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-put\">PUT<\/div><div><code>/api/cases/{id}/extension<\/code> — {ok}<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">S-06<\/span><h5>유사 민원 묶음<\/h5><span class=\"tag t-keep\">유지<\/span><span class=\"entry\">사이드바<\/span><\/header><div class=\"body\"><div class=\"desc\">군집 3건 일괄 처리 → 각 건 개별 이벤트·문자.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>일괄<\/b><\/td><td><code>mergeAll<\/code><\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">S-07<\/span><h5>특이민원 처리 프로세스 (5단계 · 발생보고서 통합)<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">큐 특이 · 담당자 회부<\/span><\/header><div class=\"body\"><div class=\"desc\">발생보고서를 별도 메뉴에서 분리하지 않고 특이민원 처리의 <b>④ 단계<\/b>로 통합했습니다. 대상 = <code>activeStaffCase<\/code>가 special이면 그 건, 아니면 첫 특이 건. 단계 완료는 데이터로 판정(<code>spDone<\/code>)합니다.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>① 시그널 확인<\/b><\/td><td>순화 요약(<code>c.soft<\/code>) · 8개 위험 시그널 · 회부 배지. 항상 완료<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>sProtectBody<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>② 원문 열람<\/b><\/td><td>선택 단계 — 목적 선택 → <code>Audit{원문 열람}<\/code>. 감사 기록이 있으면 완료<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>S.rawOpen<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>③ 정당 요구 분리<\/b><\/td><td>재점검 표준 절차 생성 + 시민 반영. 이벤트 존재 시 완료<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>splitLegit<\/code><\/td><\/tr><tr><td class=\"c num\">4<\/td><td><b>④ 발생보고서<\/b><\/td><td>자동 기입 + 유형 다중 선택 + 경위 → [부서장 보고 상신] → <code>specials(status:상신)<\/code>. 상신되면 완료<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>sReportBody·sendReport<\/code><\/td><\/tr><tr><td class=\"c num\">5<\/td><td><b>⑤ 보호조치·종결<\/b><\/td><td>관리자 A-13 승인 상태(보호조치 승인·법무·종결) 표시 · 심리 지원(익명) · 증적 출력<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>spDone(c,5)<\/code><\/td><\/tr><tr><td class=\"c num\">6<\/td><td><b>라우팅<\/b><\/td><td>구 <code>report<\/code> 경로는 ④로 진입. 사이드바 메뉴는 특이민원 하나<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>V.report<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/raw-view<\/code> — {purpose} → audit<\/div><div class=\"m-post\">POST<\/div><div><code>/api/specials<\/code> — 발생보고서 상신<\/div><div class=\"m-get\">GET<\/div><div><code>/api/cases/{id}/special-process<\/code> — 5단계 상태<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">S-09 · S-10<\/span><h5>기한 관리 · 설정<\/h5><span class=\"tag t-keep\">유지<\/span><span class=\"entry\">사이드바<\/span><\/header><div class=\"body\"><div class=\"desc\">칸반 3열 · 개인 보호 설정(통화 차단·원문 비표시·심리 지원 익명).<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>연장<\/b><\/td><td>담당자 요청 승인 후에만 기한 변경<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\">M-03<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div><\/div><\/section>\n<section id=\"s7\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 07 · STAFF WORKSTATION<\/div><h2>담당자 워크스테이션 · D-01 ~ D-05<\/h2><p class=\"lede\">부서 실무자 화면. 민원과가 전달한 업무만 보이며, 처리 행위가 곧 시민 진행 상황입니다.<\/p><div class=\"scr\"><header><span class=\"sid\">D-01<\/span><h5>배정 업무<\/h5><span class=\"tag t-new\">신규<\/span><span class=\"entry\">로그인 직후<\/span><\/header><div class=\"body\"><div class=\"desc\">접속 시 배정 팝업(<code>showAssignedPopup<\/code>, 미열람 강조). 부서 범위 칩(기본 <code>DEPT_DEFAULT<\/code>=도로관리과). (협조 요청 수신함) → 배정 목록(미열람 › 기한) → 답변 완료.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>대상<\/b><\/td><td><code>transfers()<\/code> = form.purpose=transfer && state∈{sent,opened}<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>myTransfers<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>열람<\/b><\/td><td>행 클릭 = 열람(오픈). <code>openForm_<\/code> → opener·openedAt · 시민 “검토 시작”<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>dOpen<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>협조 수신함<\/b><\/td><td><code>coops[].to==scope && state==sent<\/code> → [협조 회신]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>coopReply<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-get\">GET<\/div><div><code>/api/dept/{dept}/tasks<\/code> — <\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/form/open<\/code> — 열람<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">D-02<\/span><h5>업무 상세 — 7단계 위저드<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">D-01 행 · 기한 관리<\/span><\/header><div class=\"body\"><div class=\"desc\">프로세스 바 노드 클릭 → 해당 단계 화면. 열면 <b>첫 미완 단계<\/b>에서 시작(<code>dFirstStep<\/code>). 각 단계 완료 시 [다음 →] 활성.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>① 배정 수신<\/b><\/td><td>양식 헤더·본문 → [업무 열람으로]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>dCase n=1<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>② 업무 열람<\/b><\/td><td>열람 확인(미열람이면 버튼) · 처리 담당자 지정(<code>assignee<\/code>) · 원문·제출 자료<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\">n=2<\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>③ 조치 계획<\/b><\/td><td>방식 5종(필수) · 예정일 · 예상 소요 · 내부 메모 · [조치 계획 등록](<code>plan.registered<\/code>) · 협조/연장 요청<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>dRegisterPlan<\/code><\/td><\/tr><tr><td class=\"c num\">4<\/td><td><b>④ 현장 조치<\/b><\/td><td>현장 확인 일정 · 협조 · 보완 · 연장 · 조치 결과(필수) · 결과 사진 · [조치 완료 등록] · [⟲ 배정 반려] · [⚑ 특이민원 회부]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>dFieldDone·deptRejectModal·referSpecial<\/code><\/td><\/tr><tr><td class=\"c num\">5<\/td><td><b>⑤ AI 답변 초안<\/b><\/td><td>S-04 편집기 위에 프로세스 바 부착(<code>dStepWrap<\/code>). 근거 인용 · 격식 검사 · [결재 상신]→⑥<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>sDraft·genDraft·submitAppr<\/code><\/td><\/tr><tr><td class=\"c num\">6<\/td><td><b>⑥ 결재<\/b><\/td><td>기안→검토→전결. 전결 시 answer 게시·문자 + [시민 답변 확인 →]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>sAppr·apprStep<\/code><\/td><\/tr><tr><td class=\"c num\">7<\/td><td><b>⑦ 민원인 답변<\/b><\/td><td>게시 답변서 · 만족도/문자/행위 수 · [시민 답변서 화면 보기] · [목록으로]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\">n=7<\/td><\/tr><tr><td class=\"c num\">8<\/td><td><b>우측 고정<\/b><\/td><td>AI 요약 카드 · 진행 로그(최근 8) · 시민 화면 미리보기<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/plan<\/code> — 조치 계획<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/field<\/code> — 현장 조치<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/coop<\/code> — {to}<\/div><div class=\"m-put\">PUT<\/div><div><code>/api/cases/{id}/coop/{i}<\/code> — 회신<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/extension<\/code> — {why,days}<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/reject<\/code> — {why}<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/special<\/code> — 회부<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/draft<\/code> — AI 초안<\/div><div class=\"m-post\">POST<\/div><div><code>/api/cases/{id}/approval<\/code> — {step}<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">D-05<\/span><h5>기한 관리<\/h5><span class=\"tag t-new\">신규<\/span><span class=\"entry\">사이드바<\/span><\/header><div class=\"body\"><div class=\"desc\">전 부서 배정 건 D-1/D-2~3/D-4+ 칸반 + 전체 표(부서·분류·단계·열람·기한). 행 클릭 → D-02 첫 미완 단계.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>데이터<\/b><\/td><td><code>transfers().filter(stage&lt;5)<\/code> 기한 순<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>dDeadline<\/code><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div><\/div><\/section>\n<section id=\"s8\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 08 · ADMIN<\/div><h2>관리자 대시보드 · A-00 ~ A-14<\/h2><p class=\"lede\">메뉴 그룹: 현황 관리(기관 현황·통계·민원 분류·특이민원) / 분석·정책(부서별·이슈·정책) / 운영(AI 성능·보호 관제·지식베이스·설정).<\/p><div class=\"scr\"><header><span class=\"sid\">A-01<\/span><h5>기관 현황<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">로그인 직후<\/span><\/header><div class=\"body\"><div class=\"desc\">KPI 3계열 12지표 · 부서×단계 히트맵 · 운영 알림(SLA·급증·오배정·원문 열람·<b>반려 반환/자동 배정 정확도<\/b>·<b>특이민원 발생보고서<\/b>·정책 과제) · 실시간 접수 현황.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>알림 클릭<\/b><\/td><td>해당 화면 드릴다운<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>alert()<\/code><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">A-10<\/span><h5>통계 분석<\/h5><span class=\"tag t-keep\">유지<\/span><span class=\"entry\">현황 관리<\/span><\/header><div class=\"body\"><div class=\"desc\">일자별/주간별/월별 접수·처리 이중 막대 · 카테고리 분포 · 채널 · 시간대 · 정책 연계 패널. 시민 접수분은 마지막 막대에 실시간 반영(<code>S.filed<\/code>).<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>데이터<\/b><\/td><td><code>STAT<\/code>·<code>CATS<\/code>·<code>CHANNELS<\/code>·<code>HOURS<\/code><\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>aStats<\/code><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">A-14<\/span><h5>민원 분류 — 11개 탭<\/h5><span class=\"tag t-new\">신규<\/span><span class=\"entry\">현황 관리<\/span><\/header><div class=\"body\"><div class=\"desc\">종합 · 시기별 · 계절 · 지역별 · 시간대·요일 · 채널·이용자 · 처리기간 · 자주 하는 · 반복 · 이색 · 특이. 차트는 SVG 헬퍼(<code>lineChart·radarChart·barsChart<\/code>)로 외부 라이브러리 없음.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>종합<\/b><\/td><td>대분류 12개월 시계열(곡선·영역 그라데이션·현재월 밴드·값 라벨·범례 증감) + 이번 달 vs 전년 레이더<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>TS_RAW<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>시기별<\/b><\/td><td>히트맵 + 시계열 + 레이더 + 다음 달 급증 캘린더<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>PERIOD_RAW<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>계절<\/b><\/td><td>히트맵 + 시계열 + 분기 레이더 + 급증 구간<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>SEASON_RAW<\/code><\/td><\/tr><tr><td class=\"c num\">4<\/td><td><b>지역별<\/b><\/td><td>지역×유형 교차표(행 클릭) + 지역 레이더(전체 평균 대비) + 상위 유형 + [지역 맞춤 공지]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>REGION_RAW<\/code><\/td><\/tr><tr><td class=\"c num\">5<\/td><td><b>시간대·요일<\/b><\/td><td>24×7 히트맵(<code>hourMatrix<\/code>) · 24h 막대 · 시간대별 상위 유형 · 요일 레이더<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>HOURTYPE_RAW·WEEKF_RAW<\/code><\/td><\/tr><tr><td class=\"c num\">6<\/td><td><b>채널·이용자<\/b><\/td><td>채널 막대 · 이용자 비중 · 채널×이용자 레이더<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>USERS_RAW<\/code><\/td><\/tr><tr><td class=\"c num\">7<\/td><td><b>처리기간<\/b><\/td><td>소요일 분포 · 부서별 평균(5일↑ 강조)<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>DUR_RAW<\/code><\/td><\/tr><tr><td class=\"c num\">8<\/td><td><b>자주 하는<\/b><\/td><td><b>정책 과제 형식<\/b> 목록(prow: 순위·유형·소관·증감·근거·우선순위 바·정책 연계) → 행 클릭 <b>A-14 상세<\/b>(대표 민원·6주 추이·처리 규칙·[정책 과제로 등록]/[정책 초안 보기])<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>freqRows·aFreqDetail·freqToPolicy<\/code><\/td><\/tr><tr><td class=\"c num\">9<\/td><td><b>반복 / 이색 / 특이<\/b><\/td><td>군집 표 · 미분류 요청 · 특이 지정 건 → A-13<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>REPEAT_RAW·UNUSUAL_RAW<\/code><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">A-13<\/span><h5>특이민원 관리<\/h5><span class=\"tag t-new\">신규<\/span><span class=\"entry\">현황 관리<\/span><\/header><div class=\"body\"><div class=\"desc\">발생보고서(상신 → [보호조치 승인]/[법무 연계] → [종결]) · 특이 지정 건(회부 부서 표시) · 8개 위험 시그널. 모든 조치는 감사 로그.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>상태<\/b><\/td><td><code>spAct(i,status)<\/code><\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>aSpecial<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-put\">PUT<\/div><div><code>/api/specials/{id}<\/code> — {status}<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">A-11<\/span><h5>정책 수립 — 목록<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">분석·정책<\/span><\/header><div class=\"body\"><div class=\"desc\">관리자의 핵심 화면. 시민 민원 데이터를 정책으로 전환합니다. 파이프라인 5단계 · KPI · <b>대상(seg)·단계 필터<\/b> · 우선순위 목록(단계 태그 병기) · 정책 반영 현황.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>대상 필터<\/b><\/td><td><code>p.seg<\/code> — 보행자·아파트 거주·상인·초등 학부모 등 대상 집단별<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>S.polSeg<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>단계 필터<\/b><\/td><td>근거 분석 ~ 시행·효과 추적 7단계 = <code>pFirst(p)<\/code><\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>S.polSt<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>행 클릭<\/b><\/td><td>A-12 위저드 첫 미완 단계<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>S._pid<\/code> 리셋<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">A-12<\/span><h5>정책 수립 — 7단계 위저드<\/h5><span class=\"tag t-new\">신규<\/span><span class=\"entry\">A-11 행 클릭<\/span><\/header><div class=\"body\"><div class=\"desc\">담당자 업무 상세와 같은 방식으로, 단계 바를 누르면 해당 단계 화면이 열리고 확정 시 다음으로 넘어갑니다. 우측에 과제 요약·인용 근거·진행 로그 고정.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>① 근거 분석<\/b><\/td><td>근거·증감·우선순위 KPI · 6주 추이 · 대상/지역 분포 · 대표 민원(비식별) · [군집 열람](감사) → [분석 확정]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>pConfirm(id,1)<\/code><\/td><\/tr><tr><td class=\"c num\">2<\/td><td><b>② 원인 진단<\/b><\/td><td>AI 원인 후보 3개 칩 채택 + 진단 문안 편집 → [진단 확정] (<code>p.cause<\/code>)<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>pConfirm(id,2)<\/code><\/td><\/tr><tr><td class=\"c num\">3<\/td><td><b>③ 정책 초안<\/b><\/td><td>편집 가능한 초안(PDRAFT/강제 생성) → [초안 확정]. 임계 미달은 [초안 재생성]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>pConfirm(id,3)<\/code><\/td><\/tr><tr><td class=\"c num\">4<\/td><td><b>④ 부서 협의<\/b><\/td><td>소관·협조 부서별 [협의 요청] → 회신(동의/조건부, 운영: 부서 콘솔에서 회신) → 전부 회신 시 [협의 완료]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>pConsult<\/code><\/td><\/tr><tr><td class=\"c num\">5<\/td><td><b>⑤ 예산·일정<\/b><\/td><td>추정 예산(초안에서 추출) · 재원(본예산/추경/국비/전용) · 시기 칩 · [예산 요구서 생성] → [확정]<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>pBudget<\/code><\/td><\/tr><tr><td class=\"c num\">6<\/td><td><b>⑥ 안건 상신·심의<\/b><\/td><td>[정책조정회의 상신] → 상신 → [가결]/[보류]. 가결 시 <code>exec<\/code> 생성·⑦ 열림, 보류 시 ⑤로 복귀. 감사 로그<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>pAgenda<\/code><\/td><\/tr><tr><td class=\"c num\">7<\/td><td><b>⑦ 시행·효과 추적<\/b><\/td><td>KPI(근거 민원 감축 목표 30%) · 시행 전후 건수 · [사전 안내 공지] · [효과 보고서] → [추적 확정]. 미달 시 재도출(①)<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>exec.base/cur<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"api\"><div class=\"m-get\">GET<\/div><div><code>/api/policies?seg=&stage=<\/code> — <\/div><div class=\"m-post\">POST<\/div><div><code>/api/policies/{id}/step<\/code> — {k,v} → plog<\/div><div class=\"m-post\">POST<\/div><div><code>/api/policies/{id}/consult<\/code> — {dept}<\/div><div class=\"m-put\">PUT<\/div><div><code>/api/policies/{id}/consult/{dept}<\/code> — 회신<\/div><div class=\"m-put\">PUT<\/div><div><code>/api/policies/{id}/budget<\/code> — {src,when}<\/div><div class=\"m-post\">POST<\/div><div><code>/api/policies/{id}/agenda<\/code> — {act:submit|pass|hold}<\/div><div class=\"m-get\">GET<\/div><div><code>/api/policies/{id}/exec<\/code> — 효과 추적<\/div><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">A-06<\/span><h5>AI 성능<\/h5><span class=\"tag t-chg\">개편<\/span><span class=\"entry\">운영<\/span><\/header><div class=\"body\"><div class=\"desc\"><b>AI 자동 배정 지표<\/b>(자동 건·검수·반려·정확도) · 오배정 환류(담당자 반려 사유 포함, [학습 반영]→정확도↑) · 환각 의심 로그.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>정확도<\/b><\/td><td><code>1 - 반려/자동<\/code><\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\"><code>autoStats<\/code><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<div class=\"scr\"><header><span class=\"sid\">A-02~05 · A-07~09<\/span><h5>부서별 · 이슈 탐지 · 키워드 · 보호 관제 · 지식베이스 · 설정<\/h5><span class=\"tag t-keep\">유지<\/span><span class=\"entry\">—<\/span><\/header><div class=\"body\"><div class=\"desc\">설정 A-09: 신뢰도 임계(즉시 반영) · SLA · 급증 · 오배정 · <b>정책 초안 자동생성 기준<\/b> · 마스킹 정책 · 역할.<\/div><div class=\"tw\"><table><thead><tr><th style=\"width:44px\" class=\"c\">#<\/th><th style=\"width:170px\">요소<\/th><th>동작 · 규칙 · 구현 포인트<\/th><th style=\"width:150px\">참조 구현<\/th><\/tr><\/thead><tbody><tr><td class=\"c num\">1<\/td><td><b>임계 반영<\/b><\/td><td><code>setTh<\/code> → C-02 분기 · S-02 배정 UI · 자동 배정 조건<\/td><td class=\"num\" style=\"font-size:11px;color:#5B6478\">A-09<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div><\/div><\/section>\n<section id=\"s9\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 09 · PROCESS<\/div><h2>프로세스 시퀀스 8종<\/h2><pre><b>P1. 접수 → AI 자동 배정 → 담당자 처리<\/b>\n시민  send ─▶ analyze(conf .90, 후보 1) ─▶ 폼 ─▶ submitForm ─▶ createCase ─▶ <i>maybeAutoAssign<\/i>\n        form.state=sent (from: AI 자동 배정) · 시민 “담당 부서 배정 — {dept}” +SMS · 민원과 큐 ⚡태그 · 담당자 팝업 미열람\n담당자  dOpen ─▶ opened (“검토 시작”) ─▶ ③계획 ─▶ ④조치(+SMS) ─▶ ⑤초안 ─▶ ⑥전결(+SMS, 답변서) ─▶ ⑦확인\n민원과  S-02 검수 블록 [배정 유지] or [재배정]  ·  M-03 열람자·진행 추적\n\n<b>P2. 소관 검토 → 보좌관 판단<\/b>\nsend ─▶ analyze(amb) ─▶ 접수(stage 2) ─▶ 민원과 assignModal [⚖ 보좌관 배정] ─▶ form(adv).draft ─▶ sendForm\n ─▶ openForm_ (보좌관 열람) ─▶ <i>advisorDecide<\/i>(주관 cands[0] · 협조 cands[1]) ─▶ form(transfer) 재작성 ─▶ sendForm ─▶ P1 담당자 구간\n\n<b>P3. 단순 문의<\/b>   send ─▶ inquiry ─▶ 접수 ─▶ M-02/S-02 [AI 초안] ─▶ 편집 ─▶ [확인 — 전달] ─▶ stage 5 +SMS\n<b>P4. 소관 외<\/b>      S-02 [소관 외 안내 답변] ─▶ 템플릿·안내처 선택 ─▶ 편집 ─▶ [답변 등록] ─▶ 소관외 종결 +SMS · C-04 “소관 외 안내”\n<b>P5. 담당자 반려<\/b>  ④ [⟲ 배정 반려] ─▶ 사유 ─▶ returned · stage 2 · isNew ─▶ 민원과 팝업/필터 ⟲ ─▶ S-02 사유 배너 ─▶ 재배정 · misroutes 환류\n<b>P6. 협조<\/b>          ③/④ [협조 요청] ─▶ 부서 선택 ─▶ coops.sent (“협의 중”) ─▶ 협조 부서 D-01 수신함 [협조 회신] ─▶ replied (“협의 완료”)\n<b>P7. 기한 연장<\/b>     [기한 연장 요청] ─▶ extReq.req ─▶ 민원과 M-03 [승인] ─▶ dd+=days · form.due · “처리기간이 연장되었습니다” +SMS\n<b>P9. 추가 질문<\/b>     S-02 [💬 추가 질문] ─▶ 질문대기 (“추가 확인이 필요합니다” +SMS) ─▶ C-05 답변 ─▶ raw += [추가 답변] · 큐 💬 답변 도착 ─▶ 배정\n<b>P10. 재검토<\/b>       C-06 만족도 ≤2 [재검토 요청] ─▶ 재검토 · 큐 ⟳ ─▶ S-02 [보완 재전달] → P1 담당자 구간 / [원 답변 유지] → 답변 보완 +SMS\n<b>P11. 서류 발급<\/b>    M-02 [발급 처리 →] ─▶ ①요청 확인 ─▶ ②인증·수수료 ─▶ ③발급(번호·감사) ─▶ ④교부·안내(문자/창구/무인) ─▶ 발급완료\n<b>P12. 정책 수립<\/b>    A-11 행 ─▶ ①근거 분석 ─▶ ②원인 진단 ─▶ ③초안 ─▶ ④협의(요청→회신) ─▶ ⑤예산·일정 ─▶ ⑥상신→가결/보류 ─▶ ⑦시행·효과(미달 시 ①)\n<b>P8. 특이민원<\/b>      ④ [⚑ 회부] ─▶ special · specialFrom ─▶ 민원과 S-07(회부 배지·순화 요약·원문 열람=감사) ─▶ S-08 [상신] ─▶ A-13 [보호조치 승인]/[법무]/[종결]<\/pre><\/div><\/section>\n<section id=\"s10\"><div class=\"wrap\"><div class=\"eyebrow\">SECTION 10 · NOTIFICATION<\/div><h2>이벤트 → 시민 문구 → 문자 (단일 원천)<\/h2><p class=\"lede\">문구 변경은 이 표만 고치면 됩니다. <code>fire(id, act, cz, {sms})<\/code>의 <code>cz<\/code>가 곧 화면·문자 문구입니다.<\/p><div class=\"tw\"><table><thead><tr><th style=\"width:150px\">트리거<\/
