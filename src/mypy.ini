[mypy]
python_version = 3.12
strict = True
plugins = pydantic.mypy
files = src
exclude = src/tests/
warn_unused_ignores = True

[pydantic-mypy]
init_typed = True
warn_required_dynamic_aliases = False

[mypy-flask_openapi3.*]
follow_untyped_imports = True

# scripts/run is added to sys.path at runtime only (ASCII comment: mypy reads ini as cp949 on Windows).
[mypy-start_console]
ignore_missing_imports = True

[mypy-rag.*]
ignore_missing_imports = True
follow_imports = skip
