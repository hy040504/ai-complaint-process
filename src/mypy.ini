[mypy]
python_version = 3.12
strict = True
plugins = pydantic.mypy
files = src
warn_unused_ignores = True

[pydantic-mypy]
init_typed = True
warn_required_dynamic_aliases = False

[mypy-flask_openapi3.*]
follow_untyped_imports = True

# scripts/run is added to sys.path at runtime only (ASCII comment: mypy reads ini as cp949 on Windows).
[mypy-start_console]
ignore_missing_imports = True

# Tests index Flask's response.json (typed Any | None) right after asserting the status code.
[mypy-src.tests.*]
disable_error_code = index, union-attr
# Tests keep their short form: bare dict, unannotated helpers, monkeypatching module imports.
disallow_any_generics = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False
implicit_reexport = True

[mypy-rag.*]
ignore_missing_imports = True
follow_imports = skip
